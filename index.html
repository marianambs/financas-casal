/* =========================================================
   PRIMEIRO USO E ACESSO

   Entrar escolhe QUEM está usando — não existe seletor separado de "lançando
   como". Um toque a menos, várias vezes por dia.

   O que este arquivo NÃO é: um cofre. O PIN é uma tranca. Quem tiver o aparelho
   destravado e souber mexer lê o localStorage por baixo dele. A proteção de
   verdade é a senha do próprio aparelho. Isso foi dito ao usuário e ele decidiu
   assim — ver CLAUDE.md § Acesso.
   ========================================================= */

/* ---------------------------------------------------------
   SHA-256 em JavaScript puro.

   Por que não `crypto.subtle`: ele exige contexto seguro, e o build local roda
   em file://, onde não é confiável. Uma função que funciona num build e falha
   no outro produziria PIN que entra num lugar e não entra no outro.
   --------------------------------------------------------- */
function sha256(txt){
  function rotr(n,x){ return (x>>>n) | (x<<(32-n)); }

  const K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
           0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];

  /* texto -> bytes UTF-8 */
  const bytes = [];
  for(let i=0;i<txt.length;i++){
    let c = txt.charCodeAt(i);
    if(c < 0x80) bytes.push(c);
    else if(c < 0x800){ bytes.push(0xc0|(c>>6), 0x80|(c&63)); }
    else if(c < 0xd800 || c >= 0xe000){ bytes.push(0xe0|(c>>12), 0x80|((c>>6)&63), 0x80|(c&63)); }
    else { /* par substituto */
      i++;
      c = 0x10000 + (((c & 0x3ff) << 10) | (txt.charCodeAt(i) & 0x3ff));
      bytes.push(0xf0|(c>>18), 0x80|((c>>12)&63), 0x80|((c>>6)&63), 0x80|(c&63));
    }
  }

  const bits = bytes.length * 8;
  bytes.push(0x80);
  while(bytes.length % 64 !== 56) bytes.push(0);
  for(let i=7;i>=0;i--) bytes.push((bits / Math.pow(2, i*8)) & 0xff);

  const w = new Array(64);
  for(let p=0; p<bytes.length; p+=64){
    for(let i=0;i<16;i++){
      w[i] = (bytes[p+i*4]<<24) | (bytes[p+i*4+1]<<16) | (bytes[p+i*4+2]<<8) | bytes[p+i*4+3];
    }
    for(let i=16;i<64;i++){
      const s0 = rotr(7,w[i-15]) ^ rotr(18,w[i-15]) ^ (w[i-15]>>>3);
      const s1 = rotr(17,w[i-2]) ^ rotr(19,w[i-2]) ^ (w[i-2]>>>10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for(let i=0;i<64;i++){
      const S1 = rotr(6,e) ^ rotr(11,e) ^ rotr(25,e);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
      const S0 = rotr(2,a) ^ rotr(13,a) ^ rotr(22,a);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) | 0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H = [ (H[0]+a)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+d)|0,
          (H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0 ];
  }
  return H.map(x=>((x>>>0).toString(16).padStart(8,'0'))).join('');
}

/* Sal por pessoa: sem ele, dois PINs iguais geram o mesmo hash e olhar o
   arquivo já entrega que as duas pessoas usam o mesmo número. */
function hashPin(pin, sal){ return sha256(sal + '|' + String(pin)); }
function novoSal(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }

/* ---------------------------------------------------------
   ESTADO DA SESSÃO — vive só na memória, some ao fechar o app
   --------------------------------------------------------- */
let pessoaAtiva = null;       // id de quem entrou
let destravadoEm = 0;         // quando destravou, para o tempo de espera

function quemEstaUsando(){ return pessoaAtiva; }

function precisaDestravar(){
  if(!DB.pessoas.length) return false;                 // ainda nem cadastrou
  if(!DB.pessoas.some(p=>p.pinHash)) return false;     // ninguém criou PIN
  if(!pessoaAtiva) return true;

  const modo = aparelho().travarApos;
  if(modo === 'nunca') return false;
  if(modo === 'sempre') return false;   // já entrou nesta sessão; só ao abrir
  const limite = modo === '5min' ? 5*60*1000 : 60*60*1000;
  return (Date.now() - destravadoEm) > limite;
}

function bvAdicionar(){
  if(rascunhoPessoas.length >= 6){ toast('Seis pessoas já é bastante.'); return; }

  rascunhoPessoas.push({nome:'', emoji:EMOJIS_PESSOA[i % EMOJIS_PESSOA.length],

  bvDesenharLista();
}
function bvRemover(i){ rascunhoPessoas.splice(i,1); bvDesenharLista(); }
function bvTrocarEmoji(i){
  const atual = EMOJIS_PESSOA.indexOf(rascunhoPessoas[i].emoji);

function bvConcluir(){
  const nomes = rascunhoPessoas.map(p=>(p.nome||'').trim()).filter(Boolean);
  if(!nomes.length){ alert('Coloque pelo menos um nome.'); return; }

  const repetido = nomes.some((n,i)=> nomes.findIndex(
    o=>o.toLowerCase()===n.toLowerCase()) !== i);
  if(repetido){ alert('Tem dois nomes iguais. Cada pessoa precisa de um nome diferente.'); return; }

  DB.pessoas = rascunhoPessoas
    .filter(p=>(p.nome||'').trim())
    .map(p=>({id: uid(), nome: p.nome.trim(), emoji: p.emoji, cor: p.cor,
              pinHash:'', pinSal:''}));
  DB.config.configurado = true;
  salvarDB();

  /* Este aparelho passa a ser da primeira pessoa por padrão. Ela troca depois
     em Ajustes se o celular for de outra pessoa. */
  mudarAparelho('pessoaPadrao', DB.pessoas[0].id);
  telaCriarPin(DB.pessoas[0].id);
}

/* Traz os dados do Drive para um aparelho novo.
   Precisa sair de um TOQUE: o Safari do iPhone bloqueia o pedido de acesso ao
   Google quando ele parte sozinho, tratando como pop-up. Por isso esta função
   nunca é chamada na abertura — só a partir de um botão. */
async function entrarComGoogle(){
  if(typeof sincronizarDrive !== 'function'){
    alert('A sincronização com o Drive só existe na versão publicada do app.');
    return;
  }
  try{
    await sincronizarDrive();
  }catch(e){ /* o próprio sincronizarDrive já explica a falha */ }

  /* Se veio gente do Drive, o cadastro daqui não é mais necessário: recomeça o
     fluxo, que agora vai cair direto na tela de entrar. */
  if(DB.pessoas.length){
    DB.config.configurado = true;
    salvarDB();
    pessoaEscolhida = null;
    abrirApp();
  } else {
    alert('Não achei dados nessa conta do Google.\n\n'
        + 'Se este é o primeiro aparelho, siga com o cadastro abaixo. '
        + 'Se não, confira se entrou com a mesma conta que vocês usam no app.');
  }
}

/* ---------------------------------------------------------
   2. CRIAR O PIN
   O PIN nunca vem embutido no código: o repositório é público, e um PIN padrão
   no fonte estaria publicado na internet. Cada pessoa cria o dela aqui.
   --------------------------------------------------------- */
function telaCriarPin(pessoaId){
  const p = pessoa(pessoaId);
  if(!p){ iniciarApp(); return; }

  telaCheia(
    '<div style="text-align:center;margin-bottom:24px">'
    + '<div class="av" style="width:64px;height:64px;font-size:30px;margin:0 auto;'
    + 'background:' + p.cor + '26">' + p.emoji + '</div>'
    + '<h1 style="font-size:22px;font-weight:700;margin-top:12px">Crie o PIN de ' + esc(p.nome) + '</h1>'
    + '<p class="mut" style="margin-top:6px">Quatro números, para abrir o app.</p></div>'

    + '<div class="card">'
    +   '<div class="campo"><label>PIN</label>'
    +   '<input id="pin1" type="password" inputmode="numeric" maxlength="8" '
    +   'autocomplete="off" placeholder="••••" style="text-align:center;'
    +   'font-size:26px;letter-spacing:.4em"></div>'
    +   '<div class="campo"><label>Repita</label>'
    +   '<input id="pin2" type="password" inputmode="numeric" maxlength="8" '
    +   'autocomplete="off" placeholder="••••" style="text-align:center;'
    +   'font-size:26px;letter-spacing:.4em"></div>'
    +   '<p id="pinErro" class="ajuda" style="color:var(--neg);display:none"></p>'
    +   '<button class="btn btn-1" style="width:100%;margin-top:6px" '
    +   'onclick="salvarPin(\'' + p.id + '\')">Salvar PIN</button>'
    + '</div>'

    + '<p class="ajuda" style="text-align:center">'
    + 'Esqueceu depois? Outra pessoa da casa destrava com o PIN dela. '
    + 'Se todos esquecerem, dá para reinstalar o app e trazer os dados de volta '
    + 'do Google Drive.</p>'
  );
  setTimeout(function(){ const e=document.getElementById('pin1'); if(e) e.focus(); }, 60);
}

function salvarPin(pessoaId){
  const a = (v('pin1')||'').trim();
  const b = (v('pin2')||'').trim();
  const err = document.getElementById('pinErro');
  function falha(msg){ err.textContent = msg; err.style.display = ''; }

  if(a.length < 4){ falha('Use pelo menos 4 números.'); return; }
  if(!/^\d+$/.test(a)){ falha('Só números.'); return; }
  if(a !== b){ falha('Os dois campos estão diferentes.'); return; }

  const p = pessoa(pessoaId);
  p.pinSal  = novoSal();
  p.pinHash = hashPin(a, p.pinSal);
  salvarDB();

  /* Se houver outra pessoa ainda sem PIN, emenda nela. As duas criam os PINs
     na mesma sentada, que é o momento em que estão juntas. */
  const proxima = DB.pessoas.find(x=>!x.pinHash);
  if(proxima){ telaCriarPin(proxima.id); return; }

  pessoaAtiva = pessoaId;
  destravadoEm = Date.now();
  iniciarApp();
}

        + '</div>'

      : '')
    + '</p>'
  );
  setTimeout(function(){ const e=document.getElementById('pinEntrar'); if(e) e.focus(); }, 60);
}

function escolherPessoa(id){ pessoaEscolhida = id; telaEntrar(); }

function tentarEntrar(){
  const p = pessoa(pessoaEscolhida);
  const err = document.getElementById('entrarErro');
  const pin = (v('pinEntrar')||'').trim();

  if(!p) return;
  if(!p.pinHash){ telaCriarPin(p.id); return; }   // nunca criou PIN

  if(hashPin(pin, p.pinSal) !== p.pinHash){
    err.textContent = 'PIN errado.';
    err.style.display = '';
    const e = document.getElementById('pinEntrar');
    if(e){ e.value = ''; e.focus(); }
    return;
  }

  pessoaAtiva = p.id;
  destravadoEm = Date.now();
  mudarAparelho('pessoaPadrao', p.id);
  iniciarApp();

  /* Sincroniza aproveitando o toque que acabou de acontecer. Só quando este
     aparelho já usou o Drive alguma vez — senão viraria um pedido de permissão
     do Google surgindo do nada, logo na entrada. */
  if(typeof sincronizarDrive === 'function' && typeof meta === 'function'
     && meta().driveFileId && navigator.onLine){
    sincronizarDrive();
  }
}

/* =========================================================
   SINCRONIZAÇÃO ENTRE COMPUTADORES
   Cada registro carrega a hora da última alteração. Ao sincronizar,
   a mesclagem é feita registro a registro — não arquivo contra arquivo.
   Assim, duas pessoas mexendo em coisas diferentes nunca perdem trabalho.
   ========================================================= */

/* O identificador do aparelho vive no CFG_KEY do 02_core.js (aparelho()), que
   NAO sincroniza: "qual celular e este" e desta maquina, nao da casa. */

/* coleções em lista, identificadas por id */
const SYNC_COLECOES = ['pessoas','contas','cartoes','categorias','lancamentos',
                       'compras','recorrentes','metas','aportes'];
/* mapas de dia: finanças não tem nenhum (no RH era o ponto mensal) */
const SYNC_MAPAS_DIA = [];
/* mapas simples: {chave: valor} com hora paralela em _meta.
   orcamentos = "categoriaId_AAAA-MM" -> centavos (regra 7 do CLAUDE.md) */
const SYNC_MAPAS = ['orcamentos'];
/* objetos únicos, com hora própria */
const SYNC_OBJETOS = ['config'];

function dispositivo(){ return aparelho(); }
function nomeDispositivo(){
  return aparelho().nome || 'Aparelho sem nome';
}
function setNomeDispositivo(nome){
  mudarAparelho('nome', (nome||'').trim());
}

function metaVazia(){
  return {tombstones:{}, mapaTs:{}, objetoTs:{}, ultimaSync:null, ultimaEdicao:null, arquivoNome:''};
}
function meta(){
  if(!DB._meta) DB._meta = metaVazia();
  DB._meta.tombstones = DB._meta.tombstones || {};
  DB._meta.mapaTs     = DB._meta.mapaTs     || {};
  DB._meta.objetoTs   = DB._meta.objetoTs   || {};
  return DB._meta;
}

/* ---------- carimbo automático das alterações ----------
   Comparamos o estado atual com uma fotografia do último save.
   O que mudou ganha a hora atual; o que sumiu vira "lápide" (tombstone). */
let _foto = null;

function semCarimbo(o){
  const c = {};
  Object.keys(o||{}).forEach(k=>{ if(k!=='_ts' && k!=='_dev') c[k]=o[k]; });
  return JSON.stringify(c);
}
function tirarFoto(db){
  const f = {colecoes:{}, mapasDia:{}, mapas:{}, objetos:{}};
  SYNC_COLECOES.forEach(nome=>{
    f.colecoes[nome] = {};
    (db[nome]||[]).forEach(r=>{ f.colecoes[nome][r.id] = semCarimbo(r); });
  });
  SYNC_MAPAS_DIA.forEach(nome=>{
    f.mapasDia[nome] = {};
    Object.keys(db[nome]||{}).forEach(k=>{
      const reg = db[nome][k] || {};
      const snap = {};
      /* status + marcador "a confirmar" juntos: confirmar um dia também é uma
         alteração que precisa viajar para o outro computador */
      Object.keys(reg.dias||{}).forEach(iso=>{
        snap[iso] = (reg.dias[iso]||'') + ((reg.auto||{})[iso] ? '~auto' : '');
      });
      f.mapasDia[nome][k] = snap;
    });
  });
  SYNC_MAPAS.forEach(nome=>{ f.mapas[nome] = Object.assign({}, db[nome]||{}); });
  SYNC_OBJETOS.forEach(nome=>{ f.objetos[nome] = semCarimbo(db[nome]); });
  return f;
}

function carimbarAlteracoes(){
  const agora = Date.now();
  const dev = dispositivo().id;
  const m = meta();
  let mudou = false;

  if(!_foto){ _foto = tirarFoto(DB); return false; }

  SYNC_COLECOES.forEach(nome=>{
    const antes = _foto.colecoes[nome] || {};
    const vistos = {};
    (DB[nome]||[]).forEach(r=>{
      if(!r.id) r.id = uid();
      vistos[r.id] = true;
      const atual = semCarimbo(r);
      if(antes[r.id] === undefined || antes[r.id] !== atual){
        r._ts = agora; r._dev = dev; mudou = true;
      }
    });
    Object.keys(antes).forEach(id=>{
      if(!vistos[id]){
        m.tombstones[nome] = m.tombstones[nome] || {};
        m.tombstones[nome][id] = agora;
        mudou = true;
      }
    });
    // registro que voltou a existir cancela a lápide
    if(m.tombstones[nome]) Object.keys(vistos).forEach(id=>{
      if(m.tombstones[nome][id]) delete m.tombstones[nome][id];
    });
  });

  SYNC_MAPAS_DIA.forEach(nome=>{
    const antes = _foto.mapasDia[nome] || {};
    Object.keys(DB[nome]||{}).forEach(chave=>{
      const reg = DB[nome][chave];
      reg.dias = reg.dias || {}; reg.ts = reg.ts || {}; reg.auto = reg.auto || {};
      const antesDias = antes[chave] || {};
      Object.keys(reg.dias).forEach(iso=>{
        const atual = (reg.dias[iso]||'') + (reg.auto[iso] ? '~auto' : '');
        if(antesDias[iso] !== atual){ reg.ts[iso] = agora; mudou = true; }
      });
    });
  });

  SYNC_MAPAS.forEach(nome=>{
    const antes = _foto.mapas[nome] || {};
    m.mapaTs[nome] = m.mapaTs[nome] || {};
    Object.keys(DB[nome]||{}).forEach(chave=>{
      if(antes[chave] !== DB[nome][chave]){
        m.mapaTs[nome][chave] = agora; mudou = true;
      }
    });
  });

  SYNC_OBJETOS.forEach(nome=>{
    if(_foto.objetos[nome] !== semCarimbo(DB[nome])){
      m.objetoTs[nome] = agora; mudou = true;
    }
  });

  if(mudou) m.ultimaEdicao = {dev, nome: nomeDispositivo(), quando: agora};
  return mudou;
}

/* ---------- mesclagem ---------- */
function mesclar(local, remoto){
  const res = {novos:0, atualizados:0, removidos:0, enviados:0, conflitos:0};
  const achados = [];   // conflitos desta mesclagem
  const mLocal  = local._meta  || metaVazia();
  const mRemoto = remoto._meta || metaVazia();
  const ts = r => Number(r && r._ts) || 0;

  SYNC_COLECOES.forEach(nome=>{
    const porId = {};
    /* Linha de base: o _ts que cada registro tinha na última sincronização.
       Sem ela é impossível distinguir "só o outro mexeu" de "os dois mexeram" —
       nos dois casos o remoto chega com hora maior. */
    const base = (mLocal.base && mLocal.base[nome]) || {};

    (local[nome]||[]).forEach(r=> porId[r.id] = {r, origem:'local'});
    (remoto[nome]||[]).forEach(r=>{
      const atual = porId[r.id];
      if(!atual){ porId[r.id] = {r, origem:'remoto'}; res.novos++; return; }

      /* CONFLITO: os dois lados mexeram no MESMO registro desde a última
         sincronização, e o conteúdo ficou diferente. Continua valendo o mais
         recente — nada trava e nada se perde — mas a tela avisa, em vez de
         escolher calada. É o caso raro; o normal é cada um lançar coisas
         diferentes, e aí nem passa por aqui. */
      const tb = Number(base[r.id]) || 0;
      if(ts(atual.r) > tb && ts(r) > tb && semCarimbo(atual.r) !== semCarimbo(r)){
        achados.push({
          colecao: nome, id: r.id, quando: Date.now(),
          meu:  JSON.parse(JSON.stringify(atual.r)),
          dele: JSON.parse(JSON.stringify(r))
        });
        res.conflitos++;
      }

      if(ts(r) > ts(atual.r)){ porId[r.id] = {r, origem:'remoto'}; res.atualizados++; }
      else if(ts(atual.r) > ts(r)) res.enviados++;
    });
    // lápides: apaga se a remoção for mais nova que o registro
    const tomb = Object.assign({}, mLocal.tombstones[nome]||{}, {});
    Object.keys(mRemoto.tombstones[nome]||{}).forEach(id=>{
      const t = mRemoto.tombstones[nome][id];
      if(!tomb[id] || t > tomb[id]) tomb[id] = t;
    });
    Object.keys(tomb).forEach(id=>{
      if(porId[id] && tomb[id] > ts(porId[id].r)){ delete porId[id]; res.removidos++; }
    });
    local[nome] = Object.keys(porId).map(id=>porId[id].r);
    mLocal.tombstones[nome] = tomb;
  });

  SYNC_MAPAS_DIA.forEach(nome=>{
    local[nome] = local[nome] || {};
    Object.keys(remoto[nome]||{}).forEach(chave=>{
      const rr = remoto[nome][chave] || {dias:{}, ts:{}};
      const rl = local[nome][chave] = local[nome][chave] || {dias:{}, ts:{}};
      rl.dias = rl.dias||{}; rl.ts = rl.ts||{}; rl.auto = rl.auto||{};
      Object.keys(rr.dias||{}).forEach(iso=>{
        const tr = Number((rr.ts||{})[iso])||0, tl = Number(rl.ts[iso])||0;
        if(tr > tl){
          rl.dias[iso] = rr.dias[iso]; rl.ts[iso] = tr;
          /* o marcador "a confirmar" viaja junto com o status */
          if((rr.auto||{})[iso]) rl.auto[iso] = true; else delete rl.auto[iso];
          res.atualizados++;
        }
      });
    });
  });

  SYNC_MAPAS.forEach(nome=>{
    local[nome] = local[nome] || {};
    mLocal.mapaTs[nome] = mLocal.mapaTs[nome] || {};
    const tsR = (mRemoto.mapaTs||{})[nome] || {};
    Object.keys(remoto[nome]||{}).forEach(chave=>{
      const tr = Number(tsR[chave])||0, tl = Number(mLocal.mapaTs[nome][chave])||0;
      if(tr > tl){ local[nome][chave] = remoto[nome][chave]; mLocal.mapaTs[nome][chave] = tr; res.atualizados++; }
    });
  });

  SYNC_OBJETOS.forEach(nome=>{
    const tr = Number((mRemoto.objetoTs||{})[nome])||0;
    const tl = Number((mLocal.objetoTs||{})[nome])||0;
    if(tr > tl && remoto[nome]){
      local[nome] = Object.assign({}, defaultDB()[nome], remoto[nome]);
      mLocal.objetoTs[nome] = tr;
      res.atualizados++;
    }
  });

  // quem editou por último, entre os dois lados
  const eL = mLocal.ultimaEdicao, eR = mRemoto.ultimaEdicao;
  mLocal.ultimaEdicao = (!eL || (eR && eR.quando > eL.quando)) ? eR : eL;

  /* Os conflitos ficam guardados até a pessoa resolver. Só os 30 mais recentes:
     lista infinita de aviso vira ruído e ninguém abre. */
  mLocal.conflitos = (mLocal.conflitos || []).concat(achados).slice(-30);

  local._meta = mLocal;
  return res;
}

/* Fotografa o _ts de cada registro DEPOIS de uma sincronização completa.
   É contra esta foto que a próxima mesclagem decide o que é conflito. */
function firmarBase(){
  const m = meta();
  m.base = {};
  SYNC_COLECOES.forEach(nome=>{
    m.base[nome] = {};
    (DB[nome]||[]).forEach(r=>{ m.base[nome][r.id] = Number(r._ts)||0; });
  });
}

function conflitosAbertos(){ return (meta().conflitos || []).length; }

/* A pessoa escolheu qual versão vale. "minha" regrava o registro com hora de
   agora, para que ele viaje e vença no outro aparelho na próxima sincronização.
   "dele" só descarta o aviso: o valor do outro já está valendo desde a mesclagem. */
function resolverConflito(i, escolha){
  const m = meta();
  const c = (m.conflitos || [])[i];
  if(!c) return;

  if(escolha === 'minha'){
    const lista = DB[c.colecao] || [];
    const k = lista.findIndex(r=>r.id === c.id);
    const reg = Object.assign({}, c.meu, {_ts: Date.now(), _dev: dispositivo().id});
    if(k >= 0) lista[k] = reg; else lista.push(reg);
  }

  m.conflitos.splice(i, 1);
  salvarDB();
  renderSync();
  toast(escolha === 'minha' ? 'Mantida a sua versão.' : 'Mantida a versão do outro aparelho.');
}

function descartarConflitos(){
  if(!confirm('Dispensar todos os avisos de conflito?\n\nOs valores continuam como estão — some só o aviso.')) return;
  meta().conflitos = [];
  salvarDB();
  renderSync();
}

/* ---------- pacote de sincronização ---------- */
function pacoteSync(){
  carimbarAlteracoes();
  const p = JSON.parse(JSON.stringify(DB));
  p._formato = 'financas-casal-sync-1';
  p._gravadoPor = {dev: dispositivo().id, nome: nomeDispositivo(), quando: Date.now()};
  return p;
}
function aplicarPacote(texto){
  const remoto = JSON.parse(texto);
  if(!remoto || typeof remoto !== 'object') throw new Error('Arquivo inválido.');
  /* Aceita qualquer arquivo que traga ao menos uma coleção nossa. Conferir só o
     _formato recusaria o pacote de uma versão anterior, que continua válido. */
  if(!remoto.lancamentos && !remoto.contas && !remoto.pessoas){
    throw new Error('Este arquivo não parece ser do Finanças Casal.');
  }
  carimbarAlteracoes();
  const res = mesclar(DB, migrar(Object.assign(defaultDB(), remoto)));
  meta().ultimaSync = Date.now();
  _foto = null;              // força novo carimbo coerente no próximo save
  salvarDB();
  _foto = tirarFoto(DB);
  firmarBase();              // a partir daqui, o que mudar é alteração nova
  return res;
}
function resumoMesclagem(res){
  const p = [];
  if(res.novos)       p.push(`${res.novos} registro(s) novo(s) recebido(s)`);
  if(res.atualizados) p.push(`${res.atualizados} atualização(ões) trazida(s)`);
  if(res.removidos)   p.push(`${res.removidos} exclusão(ões) aplicada(s)`);
  if(res.enviados)    p.push(`${res.enviados} registro(s) seu(s) mais recente(s) mantido(s)`);
  if(res.conflitos)   p.push(`${res.conflitos} lançamento(s) editado(s) nos dois aparelhos — confira abaixo`);
  return p.length ? p.join(' · ') : 'Nada novo — os dois lados já estavam iguais.';
}

/* ---------- transporte A: arquivo direto na pasta do Drive ---------- */
let arquivoSync = null;           // FileSystemFileHandle
function suportaArquivoDireto(){ return typeof window.showSaveFilePicker === 'function'; }

/* O navegador esquece o arquivo escolhido ao recarregar a página. Guardamos o
   "handle" no IndexedDB para reencontrá-lo sozinho. Se o navegador não deixar
   (acontece em algumas configurações de arquivo local), o app só volta a pedir
   o arquivo no primeiro clique — nunca fica travado. */
const IDB_NOME = 'financasCasal', IDB_STORE = 'handles';

function idbAbrir(){
  return new Promise((ok, falha)=>{
    try{
      const req = indexedDB.open(IDB_NOME, 1);
      req.onupgradeneeded = ()=> req.result.createObjectStore(IDB_STORE);
      req.onsuccess = ()=> ok(req.result);
      req.onerror   = ()=> falha(req.error);
    }catch(e){ falha(e); }
  });
}
async function idbGuardarHandle(h){
  try{
    const db = await idbAbrir();
    await new Promise((ok, falha)=>{
      const t = db.transaction(IDB_STORE, 'readwrite');
      t.objectStore(IDB_STORE).put(h, 'arquivoSync');
      t.oncomplete = ok; t.onerror = ()=> falha(t.error);
    });
    db.close();
    return true;
  }catch(e){ return false; }
}
async function idbLerHandle(){
  try{
    const db = await idbAbrir();
    const h = await new Promise((ok, falha)=>{
      const t = db.transaction(IDB_STORE, 'readonly');
      const r = t.objectStore(IDB_STORE).get('arquivoSync');
      r.onsuccess = ()=> ok(r.result || null);
      r.onerror   = ()=> falha(r.error);
    });
    db.close();
    return h;
  }catch(e){ return null; }
}

/* tenta reconectar sozinho ao abrir o app (sem pedir nada ao usuário) */
async function reconectarArquivoSync(){
  if(!suportaArquivoDireto()) return;
  const h = await idbLerHandle();
  if(!h) return;
  arquivoSync = h;
  try{
    const p = await h.queryPermission({mode:'readwrite'});
    arquivoSyncLiberado = (p === 'granted');
  }catch(e){ arquivoSyncLiberado = false; }
  atualizarIndicadorSync();
  if(paginaAtual === 'sync') renderSync();
}
let arquivoSyncLiberado = false;

/* garante permissão de escrita; precisa ser chamada a partir de um clique */
async function garantirPermissao(){
  if(!arquivoSync) return false;
  try{
    let p = await arquivoSync.queryPermission({mode:'readwrite'});
    if(p !== 'granted') p = await arquivoSync.requestPermission({mode:'readwrite'});
    arquivoSyncLiberado = (p === 'granted');
    return arquivoSyncLiberado;
  }catch(e){ return false; }
}

async function escolherArquivoSync(criar){
  try{
    if(criar){
      arquivoSync = await window.showSaveFilePicker({
        suggestedName: 'financas-casal-dados.json',
        types: [{description:'Dados do Finanças Casal', accept:{'application/json':['.json']}}]
      });
    } else {
      const [h] = await window.showOpenFilePicker({
        types: [{description:'Dados do Finanças Casal', accept:{'application/json':['.json']}}]
      });
      arquivoSync = h;
    }
    arquivoSyncLiberado = true;
    meta().arquivoNome = arquivoSync.name;
    const guardou = await idbGuardarHandle(arquivoSync);
    meta().lembraArquivo = guardou;
    salvarDB();
    await sincronizarArquivo();
  }catch(e){
    if(e && e.name === 'AbortError') return;         // usuário cancelou
    alert('Não foi possível usar o arquivo diretamente neste navegador.\n\n'
        + 'Motivo: ' + (e && e.message ? e.message : e) + '\n\n'
        + 'Use o modo manual (botões "Baixar" e "Carregar"), que funciona em qualquer navegador e celular.');
    arquivoSync = null; arquivoSyncLiberado = false;
    renderSync();
  }
}

/* Botão único: conecta se precisar e sincroniza. Nunca fica desabilitado. */
async function sincronizarAgora(){
  if(!suportaArquivoDireto()){
    alert('Este navegador não permite gravar direto no arquivo. Use os botões "Carregar do Drive" e "Baixar para o Drive".');
    return;
  }
  if(!arquivoSync || !(await garantirPermissao())){
    // ainda não conectado nesta sessão — pede o arquivo e já sincroniza
    await escolherArquivoSync(false);
    return;
  }
  await sincronizarArquivo();
}

async function sincronizarArquivo(){
  if(!arquivoSync){ await escolherArquivoSync(false); return; }
  try{
    // 1) lê o que está no Drive e mescla
    let res = {novos:0, atualizados:0, removidos:0, enviados:0};
    try{
      const arq = await arquivoSync.getFile();
      const texto = await arq.text();
      if(texto && texto.trim()) res = aplicarPacote(texto);
    }catch(e){ /* arquivo novo/vazio — segue e grava */ }
    // 2) grava o resultado de volta
    const w = await arquivoSync.createWritable();
    await w.write(JSON.stringify(pacoteSync(), null, 2));
    await w.close();
    meta().ultimaSync = Date.now();
    salvarDB();
    atualizarIndicadorSync();
    if(paginaAtual === 'sync') renderSync();
    toast('Sincronizado com o Drive. ' + resumoMesclagem(res));
  }catch(e){
    alert('Falha ao sincronizar: ' + (e && e.message ? e.message : e)
        + '\n\nSe o arquivo mudou de lugar, clique em "Escolher o arquivo no Drive" para apontar de novo.');
  }
}

/* ---------- transporte B: baixar / carregar (funciona em qualquer aparelho) ---------- */
function baixarSync(){
  const blob = new Blob([JSON.stringify(pacoteSync(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'financas-casal-dados.json'; a.click();
  URL.revokeObjectURL(url);
  meta().ultimaSync = Date.now();
  salvarDB(); renderSync();
  toast('Arquivo gerado — salve-o na pasta do Google Drive, por cima do que já estava lá.');
}
function carregarSync(evt){
  const file = evt.target.files[0];
  evt.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const res = aplicarPacote(e.target.result);
      renderSync();
      alert('Sincronizado com sucesso.\n\n' + resumoMesclagem(res)
        + '\n\nNada foi apagado: os dois lados foram juntados registro a registro.');
    }catch(err){ alert('Não deu para ler o arquivo: ' + err.message); }
  };
  reader.readAsText(file);
}

/* ---------- transporte C: área de transferência ----------
   Para celular e tablet, onde mexer com arquivo é trabalhoso. Entre aparelhos
   Apple da mesma conta a área de transferência é compartilhada, então copiar
   num e colar no outro funciona sem passar por lugar nenhum. */
async function copiarDados(){
  const texto = JSON.stringify(pacoteSync());
  try{
    await navigator.clipboard.writeText(texto);
    meta().ultimaSync = Date.now();
    salvarDB(); atualizarIndicadorSync();
    if(paginaAtual === 'sync') renderSync();
    toast(`Copiado (${Math.round(texto.length/1024)} KB). Cole no outro aparelho.`);
  }catch(e){
    /* navegador recusou copiar sozinho: mostra o texto para copiar à mão */
    const box = document.getElementById('colarBox');
    const area = document.getElementById('colarTexto');
    if(box && area){
      box.style.display = '';
      area.value = texto;
      area.select();
      alert('Seu navegador não deixou copiar sozinho.\n\n'
          + 'O texto já está selecionado na caixa abaixo — copie com Ctrl+C '
          + '(ou toque e segure → Copiar).');
    } else {
      alert('Não foi possível copiar: ' + (e && e.message ? e.message : e));
    }
  }
}

function abrirColar(){
  const box = document.getElementById('colarBox');
  if(!box) return;
  box.style.display = '';
  const area = document.getElementById('colarTexto');
  if(area){ area.value = ''; area.focus(); }
}

function aplicarColado(){
  const area = document.getElementById('colarTexto');
  const texto = (area && area.value || '').trim();
  if(!texto){ alert('Cole o texto antes.'); return; }
  try{
    const res = aplicarPacote(texto);
    document.getElementById('colarBox').style.display = 'none';
    renderSync();
    alert('Juntado com sucesso.\n\n' + resumoMesclagem(res)
        + '\n\nNada foi apagado: os dois lados foram unidos registro a registro.');
  }catch(err){
    alert('Não deu para ler o que você colou: ' + err.message
        + '\n\nConfira se copiou o texto inteiro.');
  }
}

/* Cartão de conflito. Só existe quando os dois aparelhos editaram o MESMO
   lançamento antes de sincronizar — o caso raro. O comum é cada um lançar
   coisas diferentes, e aí a mesclagem junta tudo sem perguntar nada. */
function cartaoConflitos(){
  const lista = meta().conflitos || [];
  if(!lista.length) return '';

  const rotulo = {
    lancamentos:'lançamento', contas:'conta', cartoes:'cartão',
    categorias:'categoria', metas:'meta', aportes:'aporte',
    recorrentes:'conta fixa', compras:'compra', pessoas:'pessoa'
  };

  /* Mostra o que dá para ler de um registro sem saber a coleção dele. */
  function resumo(r){
    const partes = [];
    if(r.descricao) partes.push(esc(r.descricao));
    if(r.nome)      partes.push(esc(r.nome));
    if(r.valor !== undefined) partes.push('<b class="tab">' + fmt(r.valor) + '</b>');
    if(r.data)      partes.push('<span class="fra">' + fmtDiaMes(r.data) + '</span>');
    return partes.join(' · ') || '<span class="fra">registro sem descrição</span>';
  }

  return '<div class="card" style="border:1px solid var(--ala);">'
    + '<h2 style="color:var(--ala)">⚠ Editado nos dois aparelhos</h2>'
    + '<p class="ajuda" style="margin-bottom:16px">'
    + lista.length + ' ' + (lista.length===1?'registro foi editado':'registros foram editados')
    + ' aqui e no outro aparelho antes de sincronizar. '
    + '<b>Está valendo a alteração mais recente</b> — nada se perdeu. '
    + 'Confira e diga qual vale.</p>'
    + lista.map(function(c, i){
        return '<div style="border-top:1px solid var(--borda);padding:14px 0">'
          + '<p class="p mut" style="margin-bottom:8px">'
          + (rotulo[c.colecao] || c.colecao) + '</p>'
          + '<div class="grade g2" style="gap:10px">'
          +   '<div style="background:var(--sup2);border-radius:12px;padding:12px">'
          +     '<p class="pp fra" style="margin-bottom:4px">Neste aparelho</p>'
          +     '<p>' + resumo(c.meu) + '</p>'
          +     '<button class="btn btn-2 btn-p" style="margin-top:10px" '
          +     'onclick="resolverConflito(' + i + ',\'minha\')">Manter esta</button>'
          +   '</div>'
          +   '<div style="background:var(--sup2);border-radius:12px;padding:12px">'
          +     '<p class="pp fra" style="margin-bottom:4px">No outro aparelho <b>(valendo)</b></p>'
          +     '<p>' + resumo(c.dele) + '</p>'
          +     '<button class="btn btn-2 btn-p" style="margin-top:10px" '
          +     'onclick="resolverConflito(' + i + ',\'dele\')">Manter esta</button>'
          +   '</div>'
          + '</div></div>';
      }).join('')
    + '<div style="border-top:1px solid var(--borda);padding-top:14px">'
    + '<button class="btn btn-2 btn-p" onclick="descartarConflitos()">Dispensar todos os avisos</button>'
    + '</div></div>';
}

/* Registros que já existiam antes da sincronização ganham hora ZERO — nunca hora atual.
   Se recebessem a hora de agora, um computador que só ABRIU o sistema poderia sobrescrever
   a edição de verdade feita no outro. */
function backfillCarimbos(){
  const m = meta();
  SYNC_COLECOES.forEach(nome=>{
    (DB[nome]||[]).forEach(r=>{ if(!r._ts) r._ts = 0; });
  });
  SYNC_MAPAS_DIA.forEach(nome=>{
    Object.keys(DB[nome]||{}).forEach(k=>{
      const r = DB[nome][k]; r.dias = r.dias||{}; r.ts = r.ts||{}; r.auto = r.auto||{};
      Object.keys(r.dias).forEach(iso=>{ if(!r.ts[iso]) r.ts[iso] = 0; });
    });
  });
  SYNC_MAPAS.forEach(nome=>{
    m.mapaTs[nome] = m.mapaTs[nome] || {};
    Object.keys(DB[nome]||{}).forEach(k=>{ if(!m.mapaTs[nome][k]) m.mapaTs[nome][k] = 0; });
  });
  SYNC_OBJETOS.forEach(nome=>{ if(!m.objetoTs[nome]) m.objetoTs[nome] = 0; });
}

/* =========================================================
   INDICADOR DE PENDÊNCIA — visível em todas as telas
   É o que impede o usuário de fechar o expediente sem mandar
   o trabalho para o outro computador.
   ========================================================= */
/* Ainda não configurou a sincronização? Então não é "pendência" — é só
   não estar configurado. Sem isso, uma instalação nova já abriria alarmando. */
function syncConfigurada(){
  const m = meta();
  return !!(m.ultimaSync || m.arquivoNome);
}
function pendenteSync(){
  const m = meta();
  if(!syncConfigurada()) return false;
  if(!m.ultimaEdicao) return false;
  return !m.ultimaSync || m.ultimaEdicao.quando > m.ultimaSync;
}
function desdeQuando(ts){
  const min = Math.floor((Date.now() - ts) / 60000);
  if(min < 1)  return 'agora há pouco';
  if(min < 60) return `há ${min} min`;
  const h = Math.floor(min/60);
  if(h < 24)   return `há ${h}h`;
  const d = Math.floor(h/24);
  return d === 1 ? 'ontem' : `há ${d} dias`;
}

/* O botão desaparece quando a sincronização termina: a barra inteira se
   redesenha. Sem um estado no meio, tocar nele parece não ter feito nada — a
   página simplesmente troca de texto, que foi o relatado.

   Aqui ele fica desabilitado e girando enquanto trabalha. Também impede o
   toque duplo de disparar duas sincronizações ao mesmo tempo. */
async function sincronizarDaBarra(botao){
  if(!botao || botao.disabled) return;
  const antes = botao.innerHTML;
  botao.disabled = true;
  botao.innerHTML = '<span class="girando">⟳</span> Sincronizando…';
  try{
    await sincronizarAgora();
  } finally {
    /* Se a barra já se redesenhou, este botão nem está mais na tela. Devolver
       o texto a um elemento solto não faz mal nenhum — só não aparece. */
    botao.disabled = false;
    botao.innerHTML = antes;
  }
}

function atualizarIndicadorSync(){
  const el = document.getElementById('syncIndicador');
  if(!el) return;
  const m = meta();
  if(pendenteSync()){
    el.className = 'sync-ind pendente';
    el.innerHTML = `<span class="pt"></span>
      <span>Alterações não enviadas ao Drive${m.ultimaEdicao?' · última edição '+desdeQuando(m.ultimaEdicao.quando):''}</span>
      <button class="btn btn-1 btn-p" onclick="sincronizarDaBarra(this)">⟳ Sincronizar agora</button>`;
  } else if(syncConfigurada() && m.ultimaSync){
    el.className = 'sync-ind ok';
    el.innerHTML = `<span class="pt"></span><span>Tudo sincronizado com o Drive · ${desdeQuando(m.ultimaSync)}</span>`;
  } else {
    el.className = 'sync-ind neutro';
    el.innerHTML = `<span class="pt"></span>
      <span>Sincronização com o Drive ainda não configurada</span>
      <button class="btn btn-2 btn-p" onclick="irPara('sync')">Configurar</button>`;
  }
}

/* =========================================================
   AJUSTES DE TELA PEQUENA
   Entra nos DOIS builds: o computador não é afetado, porque tudo aqui só
   liga abaixo de 760px de largura.

   Resolve três incômodos relatados em 28/08/2026:
     1. as abas rolavam de lado e escondiam páginas  -> gaveta
     2. a página rolava de lado atrás de botão       -> tabela vira ficha
     3. logo e nome por baixo do relógio do iPhone   -> resolvido no CSS
   ========================================================= */

const TELA_ESTREITA = 760;
function telaEstreita(){ return window.innerWidth <= TELA_ESTREITA; }

/* ---------------------------------------------------------
   GAVETA
   --------------------------------------------------------- */
function abrirGaveta(){
  document.getElementById('app').classList.add('gaveta-aberta');
  /* trava a rolagem do fundo, senão o dedo arrasta a página atrás da gaveta */
  document.body.style.overflow = 'hidden';
}
function fecharGaveta(){
  document.getElementById('app').classList.remove('gaveta-aberta');
  document.body.style.overflow = '';
}
function gavetaAberta(){
  return document.getElementById('app').classList.contains('gaveta-aberta');
}

/* Escolher uma página fecha a gaveta. Envolvemos a função em vez de editá-la
   para não mexer no 02_core.js mais do que o necessário.

   ATENÇÃO ao nome: aqui a navegação chama-se irPara(), não goTo() como no RH.
   Envolver um nome que não existe não dá erro — simplesmente não acontece, e o
   defeito só aparece no celular, com a gaveta ficando aberta por cima da tela
   nova. Foi assim que passou despercebido até 30/08/2026. */
const irParaOriginal = window.irPara;
window.irPara = function(id){
  const r = irParaOriginal.apply(this, arguments);
  if(gavetaAberta()) fecharGaveta();
  return r;
};

/* Voltar no navegador fecha a gaveta em vez de sair do app — é o que o
   usuário espera de aplicativo, e evita perder a tela por engano. */
window.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && gavetaAberta()) fecharGaveta();
});

/* Arrastar a gaveta para a esquerda fecha, como no Facebook.
   Só conta arrasto claramente horizontal, senão atrapalha a rolagem da lista. */
(function arrastarParaFechar(){
  let x0 = null, y0 = null, horizontal = null;
  const alvo = function(){ return document.getElementById('sidebar'); };

  document.addEventListener('touchstart', function(e){
    if(!gavetaAberta() || !e.touches.length) return;
    const s = alvo();
    if(!s || !s.contains(e.target)) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; horizontal = null;
  }, {passive:true});

  document.addEventListener('touchmove', function(e){
    if(x0 === null || !e.touches.length) return;
    const dx = e.touches[0].clientX - x0;
    const dy = e.touches[0].clientY - y0;
    if(horizontal === null){
      if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;   // ainda não deu para saber
      horizontal = Math.abs(dx) > Math.abs(dy) * 1.4;
    }
    if(!horizontal || dx > 0) return;
    const s = alvo();
    if(s){ s.style.transition = 'none'; s.style.transform = 'translateX(' + dx + 'px)'; }
  }, {passive:true});

  document.addEventListener('touchend', function(e){
    if(x0 === null) return;
    const s = alvo();
    const dx = (e.changedTouches && e.changedTouches.length)
             ? e.changedTouches[0].clientX - x0 : 0;
    if(s){ s.style.transition = ''; s.style.transform = ''; }
    if(horizontal && dx < -60) fecharGaveta();
    x0 = y0 = horizontal = null;
  }, {passive:true});
})();

/* ---------------------------------------------------------
   TABELA VIRA FICHA
   Percorre as tabelas recém-desenhadas e copia o texto do <th> para o
   data-rotulo de cada <td> da mesma coluna. O CSS usa esse rótulo para
   empilhar a linha em forma de ficha. Feito aqui, uma vez só, em vez de
   espalhado por 03_func.js, 04_*, 05_*, 06_* — que são de outra janela.
   --------------------------------------------------------- */
function prepararTabelas(){
  const raiz = document.getElementById('content');
  if(!raiz) return;

  /* Caixas de contagem ("Trabalharam", "Faltaram", "Sem lançamento",
     "A confirmar") em duas colunas e menores. Uma embaixo da outra ocupava meia
     tela para mostrar quatro números. Marcamos aqui, por JS, em vez de usar
     :has() no CSS — :has() é recente e não quero depender dele no iPhone. */
  raiz.querySelectorAll('.grid').forEach(function(g){
    if(g.dataset.kpiMarcado === '1') return;
    g.dataset.kpiMarcado = '1';
    if(g.querySelector(':scope > .kpi')) g.classList.add('grid-kpi');
  });

  raiz.querySelectorAll('table').forEach(function(t){
    if(t.dataset.prontaMobile === '1') return;
    t.dataset.prontaMobile = '1';

    /* A tela pediu explicitamente para continuar tabela — é o caso da lista de
       lançar o dia, que foi enxugada para caber (nome numa linha, cargo
       abreviado, botões só com a inicial). Empilhar ali só alongaria. */
    if(t.classList.contains('nao-empilha')){ marcarRolavel(t); return; }

    const ths = t.querySelectorAll('thead th');

    /* Sem cabeçalho não há rótulo para mostrar; empilhar viraria uma pilha de
       valores soltos, pior que rolar. Deixa como está. */
    if(!ths.length){ marcarRolavel(t); return; }

    /* Célula mesclada quebra a conta de coluna por posição. Não arriscamos. */
    let mesclada = false;
    t.querySelectorAll('td, th').forEach(function(c){
      if(c.colSpan > 1 || c.rowSpan > 1) mesclada = true;
    });
    if(mesclada){ marcarRolavel(t); return; }

    const rotulos = Array.prototype.map.call(ths, function(th){
      return (th.textContent || '').trim();
    });

    /* Poucas colunas já cabem na tela; empilhar só deixaria mais comprido. */
    if(rotulos.length <= 2){ marcarRolavel(t); return; }

    t.querySelectorAll('tbody tr').forEach(function(tr){
      const tds = tr.children;
      if(tds.length !== rotulos.length) return;
      for(let i = 0; i < tds.length; i++){
        if(!tds[i].hasAttribute('data-rotulo')){
          tds[i].setAttribute('data-rotulo', rotulos[i]);
        }
      }
    });
    t.classList.add('empilha');
  });
}

/* A tabela que não empilhou continua rolando dentro da caixa. Marcamos a caixa
   para o CSS mostrar "arraste de lado" — só quando ela realmente transborda,
   senão o aviso mente. */
function marcarRolavel(t){
  const caixa = t.closest('.table-wrap');
  if(!caixa) return;
  caixa.classList.toggle('rolavel', caixa.scrollWidth > caixa.clientWidth + 4);
}

/* Roda depois de cada desenho de tela. Aqui a função chama-se desenhar(). */
const desenharOriginal = window.desenhar;
window.desenhar = function(){
  const r = desenharOriginal.apply(this, arguments);
  try{ if(telaEstreita()) prepararTabelas(); }catch(e){ console.warn('prepararTabelas:', e); }
  return r;
};

/* Envolver o desenhar() não basta: muitas telas se redesenham por conta
   própria (desenharCartoes(), desenharAjustes(), desenharLancamentos()...)
   chamadas direto de um onclick, sem passar pelo desenhar(). Quando isso
   acontece, a tabela nova nasce sem o tratamento e volta a rolar de lado.

   Tentei um MutationObserver primeiro e ele não pegou os redesenhos de forma
   confiável. Isto aqui é determinístico: envolve TODA função global cujo nome
   começa com "desenhar". Nada de timing, nada de observador — se a tela se
   redesenhou, foi por uma dessas funções.

   Vale para as telas que ainda nem existem: qualquer desenhar* nova entra
   junto, desde que declarada antes deste arquivo (ele é o último do build.sh). */
(function envolverDesenhos(){
  Object.getOwnPropertyNames(window)
    .filter(function(nome){
      /* desenharPainel, desenharCartoes... e a renderSync, que veio do RH com
         o nome antigo e continua sendo chamada assim pelo 09b_drive.js. */
      return (/^desenhar[A-Z]/.test(nome) || nome === 'renderSync')
        && typeof window[nome] === 'function';
    })
    .forEach(function(nome){
      const original = window[nome];
      if(original.__ajustadoMobile) return;      // não envolver duas vezes
      const envolvida = function(){
        const r = original.apply(this, arguments);
        try{ if(telaEstreita()) prepararTabelas(); }
        catch(e){ console.warn('prepararTabelas em ' + nome + ':', e); }
        return r;
      };
      envolvida.__ajustadoMobile = true;
      window[nome] = envolvida;
    });
})();

/* Girar o aparelho ou redimensionar a janela muda o jogo: o que era estreito
   vira largo. Redesenha para as tabelas voltarem à forma certa. */
let larguraAnterior = window.innerWidth;
window.addEventListener('resize', function(){
  const eraEstreita = larguraAnterior <= TELA_ESTREITA;
  const agoraEstreita = telaEstreita();
  larguraAnterior = window.innerWidth;
  if(eraEstreita === agoraEstreita) return;
  if(!agoraEstreita && gavetaAberta()) fecharGaveta();
  /* desenhar(), não render(): o nome do RH não existe aqui, e dentro de um
     try/catch a chamada morta não deixava rastro — girar o iPad nunca
     redesenhava as tabelas. */
  try{ desenhar(); }catch(e){ console.warn('redesenho ao girar:', e); }
});

/* =========================================================
   SINCRONIZAÇÃO AUTOMÁTICA COM O GOOGLE DRIVE
   Só entra no build do GitHub Pages (build-github.sh). O app dos PCs não usa:
   lá o transporte é o arquivo direto na pasta do Drive, que é melhor.

   POR QUE ISTO EXISTE
   Herdado do sistema de RH, onde em 27/08/2026 o que foi lançado pelo iPhone não
   chegou ao Drive. A causa não foi descuido: o iOS NUNCA sobrescreve arquivo,
   ele cria cópia. O arquivo de dados virou "dados (1).json" e o computador
   continuou lendo o antigo. Nenhuma disciplina de uso resolve isso — por isso o
   celular grava pela API do Drive, e não salvando arquivo na pasta.

   COMO ESTE ARQUIVO SE ENCAIXA
   Ele NÃO altera o 09_sync.js. Toda a lógica de junção — mesclar(),
   pacoteSync(), aplicarPacote() — é reaproveitada como está; é ela que a
   bateria de testes cobre. Aqui só existe um TRANSPORTE novo: outro jeito de
   buscar e gravar o mesmo pacote. A tela ganha um cartão por cima, envolvendo
   a renderSync original, em vez de editá-la.
   ========================================================= */
(function(){

  /* O ID do cliente é público de propósito: aplicativo que roda no navegador não
     tem onde guardar segredo. Quem protege o acesso é a lista de origens
     autorizadas no console do Google — só o endereço do GitHub Pages desta casa
     consegue pedir token com este ID. Não existe "chave secreta" aqui.

     VAZIO = a sincronização automática pelo Drive ainda não foi configurada. O
     app inteiro continua funcionando; só este cartão fica desligado, e a tela
     explica como ligar. Foi feito assim para o app poder ser publicado e usado
     antes de o dono terminar a papelada no console do Google. */
  const CLIENT_ID = '222924197737-3311n3pr1p3r8ng11lf37jshha5epl57.apps.googleusercontent.com';

  /* drive.file é o menor escopo que resolve: o app só enxerga o arquivo que ele
     mesmo criou. Não dá para listar, ler nem apagar mais nada do Drive. */
  const ESCOPO = 'https://www.googleapis.com/auth/drive.file';

  const NOME_ARQUIVO = 'financas-casal-dados.json';
  const API    = 'https://www.googleapis.com/drive/v3';
  const UPLOAD = 'https://www.googleapis.com/upload/drive/v3';

  let tokenClient = null;
  let token       = null;      // vive só nesta sessão, nunca no localStorage
  let tokenAte    = 0;
  let gisPronto   = false;
  let sincronizando = false;

  /* ---------------------------------------------------------
     Carregar a biblioteca do Google
     --------------------------------------------------------- */
  (function carregarGIS(){
    /* Sem ID configurado não há o que pedir ao Google — não carrega nada. */
    if(!CLIENT_ID) return;
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = function(){
      gisPronto = true;
      if(paginaAtual === 'sync') renderSync();
    };
    s.onerror = function(){
      gisPronto = false;
      if(paginaAtual === 'sync') renderSync();
    };
    document.head.appendChild(s);
  })();

  function driveConfigurado(){ return !!CLIENT_ID; }
  function driveDisponivel(){
    return driveConfigurado() && gisPronto && window.google
        && google.accounts && google.accounts.oauth2;
  }
  function tokenValido(){
    return !!token && Date.now() < tokenAte;
  }
  /* "conectado" = já usou o Drive neste aparelho alguma vez */
  function driveJaUsado(){
    return !!meta().driveFileId;
  }

  /* ---------------------------------------------------------
     Token de acesso
     O Safari do iPhone corta a renovação silenciosa, então o pedido de token
     PRECISA sair de um toque do usuário — senão o iOS bloqueia como popup.
     Por isso nunca chamamos isto sozinho, só a partir de um botão.
     --------------------------------------------------------- */
  function pedirToken(forcarConsentimento){
    return new Promise(function(ok, falha){
      if(!driveDisponivel()){
        falha(new Error('A biblioteca do Google ainda não carregou. '
                      + 'Confira a internet e tente de novo.'));
        return;
      }
      if(!tokenClient){
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: ESCOPO,
          callback: function(){}      // trocado a cada pedido, logo abaixo
        });
      }
      tokenClient.callback = function(resp){
        if(resp && resp.error){
          falha(new Error(resp.error_description || resp.error));
          return;
        }
        token = resp.access_token;
        /* desconta 60s de folga para não estourar no meio de uma gravação */
        tokenAte = Date.now() + ((Number(resp.expires_in) || 3600) - 60) * 1000;
        ok(token);
      };
      try{
        tokenClient.requestAccessToken({prompt: forcarConsentimento ? 'consent' : ''});
      }catch(e){ falha(e); }
    });
  }

  async function garantirToken(){
    if(tokenValido()) return token;
    return await pedirToken(false);
  }

  /* ---------------------------------------------------------
     Conversa com o Drive
     --------------------------------------------------------- */
  async function chamar(url, opcoes){
    opcoes = opcoes || {};
    opcoes.headers = Object.assign({}, opcoes.headers || {},
                                   {Authorization: 'Bearer ' + token});
    const r = await fetch(url, opcoes);
    if(r.status === 401){
      token = null; tokenAte = 0;
      throw new Error('O acesso ao Google expirou. Toque em "Conectar ao Drive" '
                    + 'de novo — leva um segundo.');
    }
    if(!r.ok){
      let detalhe = '';
      try{
        const j = await r.json();
        detalhe = (j && j.error && j.error.message) ? j.error.message : '';
      }catch(e){}
      throw new Error('Drive respondeu ' + r.status + (detalhe ? ': ' + detalhe : ''));
    }
    return r;
  }

  /* Acha o arquivo que este app já criou, ou cria pela primeira vez.
     Com o escopo drive.file esta busca só enxerga arquivos do próprio app —
     ela não varre o Drive do usuário. */
  async function acharOuCriarArquivo(){
    const m = meta();

    if(m.driveFileId){
      try{
        await chamar(API + '/files/' + m.driveFileId + '?fields=id,trashed');
        return m.driveFileId;
      }catch(e){
        /* 401 tem que subir: é expiração de acesso, não arquivo sumido */
        if(/expirou/.test(e.message)) throw e;
        /* apagado ou na lixeira — esquece e procura de novo */
        m.driveFileId = '';
      }
    }

    const q = "name='" + NOME_ARQUIVO + "' and trashed=false";
    const r = await chamar(API + '/files?q=' + encodeURIComponent(q)
                         + '&fields=files(id,modifiedTime)&orderBy=modifiedTime desc');
    const j = await r.json();
    if(j.files && j.files.length){
      m.driveFileId = j.files[0].id;
      salvarDB();
      return m.driveFileId;
    }

    /* ---- TRAVA CONTRA CRIAR ARQUIVO VAZIO ----
       Aconteceu de verdade em 27/08/2026 e vale a pena entender:

       O escopo drive.file só enxerga arquivos que ESTE app criou. O
       financas-casal-dados.json que já existia na pasta foi criado pelo app do PC,
       então a busca acima não acha nada — e não tem como achar. Sem esta trava,
       um iPhone recém-instalado (vazio) criava um segundo arquivo, também
       vazio, e o dono ficava com dois arquivos de mesmo nome no Drive achando
       que tinha perdido tudo.

       Regra: só criamos o arquivo se este aparelho tiver alguma coisa para
       colocar dentro dele. Aparelho vazio recebe dados, nunca semeia. */
    const temAlgo = (DB.lancamentos && DB.lancamentos.length)
                 || (DB.contas && DB.contas.length)
                 || (DB.cartoes && DB.cartoes.length);
    if(!temAlgo){
      throw new Error(
        'Este aparelho ainda está vazio — sem lançamento, conta ou cartão.\n\n'
      + 'Por segurança não vou criar o arquivo no Drive agora: ele nasceria '
      + 'vazio e vocês ficariam com dois arquivos de mesmo nome, sem saber qual '
      + 'é o bom.\n\n'
      + 'Traga os dados para cá primeiro, de um destes jeitos:\n\n'
      + '• No outro aparelho toque em "Copiar meus dados", e aqui em "Colar de '
      + 'outro aparelho"; ou\n'
      + '• Use "⬆ Carregar do Drive" e escolha o financas-casal-dados.json.\n\n'
      + 'Depois disso volte aqui e conecte — aí o arquivo nasce completo.');
    }

    /* primeira vez: cria o arquivo com o que existe neste aparelho */
    const limite = '-------financascasal' + Date.now();
    const corpo =
        '--' + limite + '\r\n'
      + 'Content-Type: application/json; charset=UTF-8\r\n\r\n'
      + JSON.stringify({name: NOME_ARQUIVO, mimeType: 'application/json'}) + '\r\n'
      + '--' + limite + '\r\n'
      + 'Content-Type: application/json\r\n\r\n'
      + JSON.stringify(pacoteSync(), null, 2) + '\r\n'
      + '--' + limite + '--';

    const c = await chamar(UPLOAD + '/files?uploadType=multipart&fields=id', {
      method: 'POST',
      headers: {'Content-Type': 'multipart/related; boundary=' + limite},
      body: corpo
    });
    const cj = await c.json();
    m.driveFileId = cj.id;
    salvarDB();

    /* Dizer ONDE o arquivo caiu. A API cria na raiz do Drive, e sem este aviso
       o usuário procura na pasta do projeto, não acha, e acha que falhou. */
    alert('Pronto — criei o arquivo de dados no seu Google Drive.\n\n'
        + 'Ele nasceu na RAIZ do Drive, com o nome ' + NOME_ARQUIVO + '. '
        + 'Quando puder, no computador, MOVA ele para dentro da pasta '
        + '"Finanças Casal", junto com o resto.\n\n'
        + 'Mova, não copie: copiar cria outro arquivo e este aparelho perde o '
        + 'acesso a ele. Movido, continua funcionando normalmente.');

    return m.driveFileId;
  }

  async function lerArquivo(id){
    const r = await chamar(API + '/files/' + id + '?alt=media');
    return await r.text();
  }

  async function gravarArquivo(id, texto){
    await chamar(UPLOAD + '/files/' + id + '?uploadType=media', {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: texto
    });
  }

  /* ---------------------------------------------------------
     O ciclo — igual ao do arquivo direto: lê, junta, grava de volta
     --------------------------------------------------------- */
  async function sincronizarDrive(){
    if(sincronizando) return;
    if(!navigator.onLine){
      alert('Sem internet agora.\n\n'
          + 'Pode trabalhar normalmente — o que você lançar fica guardado no '
          + 'aparelho. Sincronize quando pegar sinal.');
      return;
    }
    sincronizando = true;
    pintarBotoes(true);
    try{
      await garantirToken();
      const id = await acharOuCriarArquivo();

      let res = {novos:0, atualizados:0, removidos:0, enviados:0};
      const texto = await lerArquivo(id);
      if(texto && texto.trim()) res = aplicarPacote(texto);

      await gravarArquivo(id, JSON.stringify(pacoteSync(), null, 2));

      meta().ultimaSync = Date.now();
      meta().arquivoNome = NOME_ARQUIVO;
      salvarDB();
      atualizarIndicadorSync();
      if(paginaAtual === 'sync') renderSync();
      toast('Sincronizado com o Drive. ' + resumoMesclagem(res));
    }catch(e){
      alert('Não deu para sincronizar com o Drive.\n\n'
          + (e && e.message ? e.message : e)
          + '\n\nO que você lançou continua guardado neste aparelho — nada se '
          + 'perdeu. Dá para tentar de novo, ou usar "Copiar meus dados" para '
          + 'passar por outro caminho.');
    }finally{
      sincronizando = false;
      pintarBotoes(false);
      if(paginaAtual === 'sync') renderSync();
    }
  }

  async function desconectarDrive(){
    if(!confirm('Desconectar este aparelho do Google Drive?\n\n'
              + 'Seus dados continuam aqui. Só a sincronização automática para '
              + 'de funcionar até você conectar de novo.')) return;
    try{
      if(token && driveDisponivel()) google.accounts.oauth2.revoke(token, function(){});
    }catch(e){}
    token = null; tokenAte = 0;
    meta().driveFileId = '';
    salvarDB();
    if(paginaAtual === 'sync') renderSync();
    toast('Desconectado do Drive.');
  }

  function pintarBotoes(ocupado){
    const b = document.getElementById('btnDrive');
    if(!b) return;
    b.disabled = ocupado;
    b.textContent = ocupado ? 'Sincronizando...'
                            : (driveJaUsado() ? '⟳ Sincronizar com o Drive'
                                              : 'Conectar ao Drive e sincronizar');
  }

  /* ---------------------------------------------------------
     Tela — um cartão inserido no topo da Sincronizar, sem tocar na renderSync
     --------------------------------------------------------- */
  function cartaoDrive(){
    const m = meta();
    const usado = driveJaUsado();
    const ultima = m.ultimaSync
      ? new Date(m.ultimaSync).toLocaleString('pt-BR') : 'nunca';

    if(!driveConfigurado()){
      return '<div class="card" style="border-left:4px solid var(--ac)">'
           + '<h2>Sincronização automática com o Drive</h2>'
           + '<p class="ajuda">Ainda não configurada. Enquanto isso, os modos '
           + 'abaixo funcionam: dá para passar os dados de um aparelho para o '
           + 'outro copiando e colando, ou pelo arquivo.<br><br>'
           + 'Para ligar a sincronização automática é preciso criar um '
           + '<b>ID de cliente do Google</b> e colocá-lo no código do app. '
           + 'Depois disso, os aparelhos passam a se atualizar sozinhos.</p></div>';
    }

    if(!driveDisponivel()){
      return '<div class="card" style="border-left:4px solid var(--ala)">'
           + '<h2>Sincronização automática com o Drive</h2>'
           + '<p class="ajuda">Não consegui carregar a biblioteca do Google — '
           + 'normalmente é falta de internet. Ela volta sozinha quando você '
           + 'abrir o app com sinal.<br><br>'
           + 'Enquanto isso, os modos manuais abaixo continuam funcionando '
           + 'igual.</p></div>';
    }

    return '<div class="card" style="border-left:4px solid '
         + (pendenteSync() ? 'var(--ala)' : 'var(--pos)') + ';">'
      + '<h2>Sincronização automática com o Drive</h2>'
      + '<p class="ajuda" style="margin-bottom:14px;font-size:13px;color:var(--mut);">'
      + (usado
          ? 'Este aparelho grava direto no <b>' + esc(NOME_ARQUIVO) + '</b> do Drive. '
            + 'Última sincronização: <b>' + esc(ultima) + '</b>.'
          : 'Toque no botão para ligar este aparelho ao Drive. O Google vai pedir '
            + 'sua permissão uma vez.<br>O app enxerga <b>só o arquivo de dados '
            + 'do sistema</b> — nada mais do seu Drive.<br><br>'
            + '<b>Se este aparelho ainda estiver vazio</b>, traga os dados antes '
            + '(pelo "Colar dados de outro aparelho" ou pelo "Carregar do Drive" '
            + 'aqui embaixo). Aparelho vazio não pode ser o primeiro a gravar, '
            + 'senão o arquivo nasce vazio.')
      + '</p>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;">'
      + '<button class="btn btn-1" id="btnDrive" style="font-size:14px;padding:11px 20px;" '
      + 'onclick="sincronizarDrive()">'
      + (usado ? '⟳ Sincronizar com o Drive' : 'Conectar ao Drive e sincronizar')
      + '</button>'
      + (usado ? '<button class="btn btn-2" onclick="desconectarDrive()">Desconectar</button>' : '')
      + '</div>'
      + '<p class="ajuda" style="margin-top:12px;">'
      + 'Faz tudo de uma vez: lê o que está no Drive, junta com o que está aqui '
      + 'e grava de volta — <b>no mesmo arquivo</b>, sem criar cópia.'
      + (usado ? '<br>De vez em quando o Google pede para reconectar. É o Safari '
               + 'expirando o acesso, não erro — é só tocar no botão de novo.' : '')
      + '</p></div>';
  }

  /* envolve a renderSync original em vez de alterá-la */
  const renderSyncOriginal = window.renderSync;
  window.renderSync = function(){
    renderSyncOriginal.apply(this, arguments);
    if(paginaAtual !== 'sync') return;
    const c = document.getElementById('content');
    if(!c || document.getElementById('btnDrive')) return;
    c.insertAdjacentHTML('afterbegin', cartaoDrive());
  };

  /* o botão da faixa de aviso, no topo de todas as telas, passa a usar o Drive
     quando ele estiver em uso neste aparelho */
  const sincronizarAgoraOriginal = window.sincronizarAgora;
  window.sincronizarAgora = async function(){
    if(driveJaUsado() || !suportaArquivoDireto()){
      await sincronizarDrive();
      return;
    }
    return await sincronizarAgoraOriginal.apply(this, arguments);
  };

  window.sincronizarDrive  = sincronizarDrive;
  window.desconectarDrive  = desconectarDrive;

})();
/* =========================================================
   ADAPTAÇÕES DA VERSÃO PUBLICADA NO GITHUB PAGES (celular e tablet)
   Só entra no build-github.sh — o app local (financas-casal.html) não usa
   este arquivo, porque no PC ele é aberto direto do disco.

   Endereço: https://marianambs.github.io/financas-casal/

   Faz três coisas:
   1. Registra o service worker, que é o que permite o app ABRIR SEM INTERNET.
      Sem ele, na obra sem sinal a tela fica em branco.
   2. Avisa quando existe versão nova publicada, com botão para atualizar.
      Versões diferentes calculam diferente — não dá para ficar atrasado calado.
   3. No iPhone/iPad, insiste para instalar na Tela de Início. É isso que
      livra o app da regra dos 7 dias do Safari, que APAGA os dados.
   ========================================================= */
(function(){

  /* ---------------------------------------------------------
     1. SERVICE WORKER — o app passa a abrir offline
     --------------------------------------------------------- */
  let swRegistro = null;
  let recarregando = false;

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').then(function(reg){
        swRegistro = reg;

        /* já existe uma versão nova parada esperando (aconteceu numa aba anterior) */
        if(reg.waiting && navigator.serviceWorker.controller) mostrarBarraAtualizar(reg.waiting);

        /* uma versão nova começou a ser baixada agora */
        reg.addEventListener('updatefound', function(){
          const novo = reg.installing;
          if(!novo) return;
          novo.addEventListener('statechange', function(){
            /* "installed" com controller significa ATUALIZAÇÃO, não primeira instalação */
            if(novo.state === 'installed' && navigator.serviceWorker.controller){
              mostrarBarraAtualizar(novo);
            }
          });
        });

        /* procura versão nova ao voltar para o app (não só ao abrir do zero) */
        document.addEventListener('visibilitychange', function(){
          if(document.visibilityState === 'visible') reg.update().catch(function(){});
        });
      }).catch(function(e){
        console.warn('service worker não registrou:', e);
      });

      /* quando o worker novo assume, recarrega uma única vez */
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(recarregando) return;
        recarregando = true;
        window.location.reload();
      });
    });
  }

  function mostrarBarraAtualizar(worker){
    if(document.getElementById('barraAtualizar')) return;
    const el = document.createElement('div');
    el.id = 'barraAtualizar';
    el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:300;'
                     + 'background:#1c4fd8;color:#fff;padding:13px 16px;'
                     + 'padding-bottom:calc(13px + env(safe-area-inset-bottom));'
                     + 'font-size:13px;font-weight:600;display:flex;align-items:center;'
                     + 'gap:12px;box-shadow:0 -4px 16px rgba(0,0,0,.22);';
    el.innerHTML = '<span style="flex:1;line-height:1.45;">Existe uma versão nova do sistema.'
                 + '<br><span style="font-weight:400;opacity:.85;">'
                 + 'Atualize antes de lançar — versões diferentes calculam diferente.</span></span>';

    const btn = document.createElement('button');
    btn.textContent = 'Atualizar';
    btn.style.cssText = 'background:#fff;color:#1c4fd8;border:none;border-radius:8px;'
                      + 'padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;'
                      + 'flex-shrink:0;';
    btn.onclick = function(){
      btn.disabled = true;
      btn.textContent = 'Atualizando...';
      worker.postMessage({tipo: 'ASSUMIR_AGORA'});
    };
    el.appendChild(btn);

    const dep = document.createElement('button');
    dep.textContent = 'Depois';
    dep.style.cssText = 'background:none;color:#c7d4f7;border:none;font-size:12.5px;'
                      + 'cursor:pointer;flex-shrink:0;';
    dep.onclick = function(){ el.remove(); };
    el.appendChild(dep);

    document.body.appendChild(el);
  }

  /* ---------------------------------------------------------
     2. INSTALAR NA TELA DE INÍCIO — proteção contra a regra dos 7 dias
     --------------------------------------------------------- */
  const ehIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
             || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const instalado = window.navigator.standalone === true
             || window.matchMedia('(display-mode: standalone)').matches;

  if(!instalado){
    const mostrar = function(){
      const main = document.getElementById('main');
      if(!main || document.getElementById('avisoInstalar')) return;

      /* Vai DEPOIS do cabeçalho, nunca antes. No celular o #topbar é a barra do
         app, com o recuo da área segura do iPhone; um aviso acima dele roubava
         esse recuo e empurrava tudo por baixo do relógio. */
      const ancora = document.getElementById('syncIndicador') || main.firstChild;

      const el = document.createElement('div');
      el.id = 'avisoInstalar';
      el.style.cssText = 'background:#fdf3e2;color:#8a5a00;border-bottom:2px solid #e39b00;'
                       + 'padding:11px 16px;font-size:12.5px;line-height:1.6;font-weight:600;';

      if(ehIOS){
        el.innerHTML = 'Instale o app na Tela de Início: toque em <b>Compartilhar</b> '
                     + '(o quadrado com a seta para cima) e depois em '
                     + '<b>Adicionar à Tela de Início</b>.<br>'
                     + '<span style="font-weight:400;">Enquanto ficar só no Safari, o iPhone '
                     + '<b>apaga os dados deste app</b> depois de 7 dias sem uso — e ele '
                     + 'só funciona offline depois de instalado.</span>';
      } else {
        el.innerHTML = 'Instale o app no aparelho pelo menu do navegador '
                     + '(<b>Adicionar à tela inicial</b>).<br>'
                     + '<span style="font-weight:400;">Instalado, ele abre sem internet '
                     + '— é o que faz funcionar na obra sem sinal.</span>';
      }
      main.insertBefore(el, ancora);
    };
    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', mostrar);
    } else {
      mostrar();
    }
  }

  /* ---------------------------------------------------------
     3. MANIFEST — para o Android/Chrome oferecer a instalação.
     O manifesto em si vai embutido como data URI, mas os ÍCONES
     apontam para os PNG publicados ao lado do index.html.
     No iPhone o manifest é ignorado — lá quem manda é o link de
     apple-touch-icon que está estático no <head>.
     --------------------------------------------------------- */
  (function(){
    if(document.querySelector('link[rel="manifest"]')) return;
    const mf = {
      name: 'Finanças Casal',
      short_name: 'Finanças',
      start_url: './',
      scope: './',
      display: 'standalone',
      background_color: '#F6F3ED',
      theme_color: '#7C5CBF',
      lang: 'pt-BR',
      /* maskable além de any: o Android recorta o ícone em círculo ou
         quadrado conforme o launcher, e sem esta dica ele desenha o nosso
         dentro de um quadrado branco. */
      /* Endereço ABSOLUTO. O manifesto é servido de um blob:, e caminho
         relativo dentro dele seria resolvido contra o blob — que não tem
         pasta. new URL(..., location.href) resolve contra a página. */
      icons: [
        {src: new URL('icone-512.png', location.href).href,
         sizes: '512x512', type: 'image/png', purpose: 'any'},
        {src: new URL('icone-512.png', location.href).href,
         sizes: '512x512', type: 'image/png', purpose: 'maskable'},
        {src: new URL('icone-180.png', location.href).href,
         sizes: '180x180', type: 'image/png', purpose: 'any'}
      ]
    };
    const blob = new Blob([JSON.stringify(mf)], {type: 'application/manifest+json'});
    const l = document.createElement('link');
    l.rel = 'manifest';
    l.href = URL.createObjectURL(blob);
    document.head.appendChild(l);
  })();

})();
</script>
