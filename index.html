  abrirModal(
    '<h2>Compra parcelada já em andamento</h2>'
    + '<p class="ajuda" style="margin-bottom:16px">Para compras feitas antes de vocês '
    + 'começarem a usar o app. As parcelas que faltam entram na projeção e no orçamento '
    + 'dos meses certos; as já pagas não entram em lugar nenhum.</p>'
    + '<div class="campo"><label>Descrição</label>'
    + '<input id="ppDesc" placeholder="Notebook, geladeira…"></div>'
    + '<div class="campo"><label>Cartão</label><select id="ppCartao">'
    + DB.cartoes.map(function(c){
        return '<option value="' + c.id + '">' + esc(c.nome) + '</option>';
      }).join('') + '</select></div>'
    + '<div class="grade g2" style="gap:12px">'
    +   '<div class="campo"><label>Valor da parcela</label>'
    +   '<input id="ppParcela" inputmode="decimal" placeholder="0,00"></div>'
    +   '<div class="campo"><label>Total de parcelas</label>'
    +   '<input id="ppTotal" type="number" min="2" max="60" value="10"></div>'
    + '</div>'
    + '<div class="campo"><label>Quantas já foram pagas</label>'
    + '<input id="ppPagas" type="number" min="0" max="59" value="0">'
    + '<p class="ajuda">Se já pagou 4 de 10, o app cria só as 6 que faltam.</p></div>'
    + '<div class="campo"><label>Categoria</label><select id="ppCat">'
    + '<option value="">Sem categoria</option>'
    + DB.categorias.filter(function(c){ return c.tipo === 'saida'; })
        .map(function(c){ return '<option value="' + c.id + '">' + esc(c.nome) + '</option>'; }).join('')
    + '</select></div>'
    + seletorDono('ppPessoa', quemEstaUsando(), 'De quem')
    + '<div class="modal-acoes">'
    + '<button class="btn btn-2" onclick="fecharModal()">Cancelar</button>'
    + '<button class="btn btn-1" onclick="salvarParcelada()">Cadastrar</button></div>');
}

function salvarParcelada(){
  const desc = (v('ppDesc')||'').trim();
  const parcela = lerDinheiro(v('ppParcela'));
  const total = Number(v('ppTotal'));
  const pagas = Number(v('ppPagas'));

  if(!desc){ alert('Descreva a compra.'); return; }
  if(!parcela || parcela <= 0){ alert('Valor da parcela inválido.'); return; }
  if(!Number.isInteger(total) || total < 2){ alert('O total de parcelas precisa ser 2 ou mais.'); return; }
  if(!Number.isInteger(pagas) || pagas < 0 || pagas >= total){
    alert('As já pagas precisam ser menos que o total.'); return;
  }

  const ct = cartao(v('ppCartao'));

  /* A data da compra é reconstruída para trás: se já pagou 4 parcelas, a compra
     foi uns 4 meses atrás. Assim a primeira parcela que falta cai no mês certo. */
  const mesPrimeira = mesMais(mesAtual(), -pagas);
  const dataCompra = diaDoMes(mesPrimeira, Math.max(1, ct.diaFechamento - 1));

  gravarParcelado({
    cartaoId: ct.id, total: parcela * total, parcelas: total,
    descricao: desc, data: dataCompra,
    categoriaId: v('ppCat') || '', pessoaId: v('ppPessoa') || '', jaPagas: pagas
  });

  salvarDB(); fecharModal(); desenhar();
  toast((total - pagas) + ' parcelas criadas.');
}

/* Quanto de cada uma das próximas faturas já está tomado. */
function blocoProximasFaturas(){
  const meses = [];
  for(let i=1;i<=6;i++) meses.push(mesMais(mesVisivel, i));

  const valores = meses.map(function(m){
    return DB.cartoes.reduce(function(s,ct){ return s + faturaDoMes(ct.id, m); }, 0);
  });
  const maior = Math.max.apply(null, valores.concat([1]));
  if(valores.every(function(x){ return x === 0; })){
    return '<div class="card"><h2>Próximas faturas</h2>'
      + '<p class="ajuda">Nenhuma parcela caindo nos próximos meses.</p></div>';
  }

  return '<div class="card"><h2>Próximas faturas já comprometidas</h2>'
    + meses.map(function(m, i){
        return '<div style="padding:9px 0">'
          + '<div class="lin p" style="margin-bottom:6px">'
          + '<span class="mut">' + nomeMes(m) + '</span>'
          + '<span class="tab" style="font-weight:500">' + $(valores[i]) + '</span></div>'
          + '<div class="trilho trilho-p"><div style="width:'
          + (valores[i]/maior*100) + '%;background:var(--ac)"></div></div></div>';
      }).join('')
    + '</div>';
}
/* =========================================================

/* Contas fixas que ainda não viraram lançamento neste mês. Materializar é o que
   transforma a previsão em lançamento de verdade, com data e status de pago. */
function blocoLancarFixas(){
  const ym = mesVisivel;
  const jaTem = {};
  DB.lancamentos.forEach(function(l){
    if(l.recorrenteId && (l.mesComp || mesDe(l.data)) === ym) jaTem[l.recorrenteId] = true;
  });

  const faltando = DB.recorrentes.filter(function(r){
    if(!r.ativo || jaTem[r.id]) return false;
    const quando = diaDoMes(ym, r.dia);
    if(r.inicio && quando < r.inicio) return false;
    if(r.fim && quando > r.fim) return false;
    return true;
  });

  if(!faltando.length) return '';

  return '<div class="card" style="border:1px solid var(--ac)">'
    + '<div class="lin" style="flex-wrap:wrap;gap:12px">'
    + '<p style="flex:1;min-width:200px"><b>' + faltando.length + '</b> '
    + (faltando.length===1 ? 'conta fixa ainda não foi lançada' : 'contas fixas ainda não foram lançadas')
    + ' em ' + nomeMes(ym) + '.</p>'
    + '<button class="btn btn-1" onclick="lancarFixas()">Lançar agora</button></div>'
    + '<p class="ajuda">Elas entram como <b>previsto</b>. Marque como pago conforme forem saindo.</p>'
    + '</div>';
}

function lancarFixas(){
  const ym = mesVisivel;
  const jaTem = {};
  DB.lancamentos.forEach(function(l){
    if(l.recorrenteId && (l.mesComp || mesDe(l.data)) === ym) jaTem[l.recorrenteId] = true;
  });

  let n = 0;
  DB.recorrentes.forEach(function(r){
    if(!r.ativo || jaTem[r.id]) return;
    const quando = diaDoMes(ym, r.dia);
    if(r.inicio && quando < r.inicio) return;
    if(r.fim && quando > r.fim) return;

    DB.lancamentos.push(novoLancamento({
      data: quando, descricao: r.descricao, valor: r.valor, tipo: r.tipo,
      pessoaId: r.pessoaId || '', categoriaId: r.categoriaId || '',
      alvo: r.alvo || (DB.contas.length ? 'conta:' + DB.contas[0].id : ''),
      pago: false, recorrenteId: r.id
    }));
    n++;
  });

  salvarDB(); desenhar();
  toast(n + ' conta(s) fixa(s) lançada(s) como previsto.');
}
/* =========================================================
   INVESTIMENTOS — reserva, metas e o que já foi guardado
   ========================================================= */

const TIPOS_META = {reserva:'Reserva de emergência', objetivo:'Objetivo', aplicacao:'Investimento'};
const ICONE_META = {reserva:'🛟', objetivo:'🎯', aplicacao:'📈'};

function guardadoNaMeta(metaId){
  return DB.aportes.filter(function(a){ return a.metaId === metaId; })
                   .reduce(function(s,a){ return s + a.valor; }, 0);
}

/* Gasto essencial médio dos meses que tiveram movimento. É contra ele que a
   reserva é medida — "quantos meses vocês aguentam". */
function gastoEssencialMedio(){
  const porMes = {};
  DB.lancamentos.forEach(function(l){
    if(l.tipo !== 'saida') return;
    const cat = categoria(l.categoriaId);
    if(!cat || cat.grupo !== 'essencial') return;
    const m = l.mesComp || mesDe(l.data);
    porMes[m] = (porMes[m] || 0) + l.valor;
  });
  const meses = Object.keys(porMes).filter(function(m){ return porMes[m] > 0; });
  if(!meses.length) return null;
  return Math.round(meses.reduce(function(s,m){ return s + porMes[m]; }, 0) / meses.length);
}

function desenharInvestimentos(){
  const c = document.getElementById('content');
  const pat = patrimonio();
  const guardado = pat.reserva + pat.guardado;
  const essencial = gastoEssencialMedio();
  const cobre = (essencial && essencial > 0) ? pat.reserva / essencial : null;

  const precisaPorMes = DB.metas.reduce(function(s,m){
    if(!m.prazo) return s;
    const falta = Math.max(m.alvo - guardadoNaMeta(m.id), 0);
    const meses = Math.max(mesesEntre(mesAtual(), mesDe(m.prazo)), 0);
    return s + (meses > 0 ? Math.ceil(falta / meses) : falta);
  }, 0);

  c.innerHTML =
    '<div class="grade g3">'
  +   '<div class="card"><p class="p mut">Total guardado</p>'
  +     '<p class="n-m tab inv">' + $(guardado) + '</p>'
  +     '<p class="ajuda">Reserva ' + $(pat.reserva) + ' · outras metas ' + $(pat.guardado) + '</p></div>'
  +   '<div class="card"><p class="p mut">Guardado neste mês</p>'
  +     '<p class="n-m tab ' + (pat.doMes>=0?'pos':'neg') + '">'
  +     (pat.doMes>0?'+':'') + $(pat.doMes) + '</p>'
  +     '<p class="ajuda">' + (precisaPorMes
        ? 'As metas com prazo pedem ' + $(precisaPorMes) + ' por mês'
        : 'Nenhuma meta com prazo definido') + '</p></div>'
  +   '<div class="card"><p class="p mut">A reserva cobre</p>'
  +     '<p class="n-m tab">' + (cobre === null ? '—' : cobre.toFixed(1).replace('.',',') + ' meses') + '</p>'
  +     '<p class="ajuda">' + (essencial === null
        ? 'Lance alguns gastos essenciais para o cálculo aparecer.'
        : 'Seus gastos essenciais são ' + $(essencial) + ' por mês. O ideal é cobrir de 3 a 6.')
  +     '</p></div>'
  + '</div>'

  + (guardado ? blocoOndeGuardado(guardado) : '')

  + '<div class="card">'
  + '<h2>Metas<span class="aux" onclick="editarMeta()">+ Nova meta</span></h2>'
  + (DB.metas.length
    ? DB.metas.map(cartaoMeta).join('')
    : '<p class="ajuda">Nenhuma meta ainda. Comecem pela reserva de emergência: somem os '
      + 'gastos essenciais de um mês e multipliquem por três — é o colchão que evita voltar '
      + 'para o cartão quando algo dá errado.'
      + (essencial ? '<br><br>No caso de vocês, daria cerca de <b>' + fmt(essencial*3) + '</b>.' : '')
      + '</p>')
  + '</div>';
}

function blocoOndeGuardado(total){
  const comSaldo = DB.metas.map(function(m){
    return {m:m, v:guardadoNaMeta(m.id)};
  }).filter(function(x){ return x.v > 0; })
    .sort(function(a,b){ return b.v - a.v; });

  if(!comSaldo.length) return '';

  return '<div class="card"><h2>Onde está guardado</h2>'
    + comSaldo.map(function(x, i){
        const dono = pessoa(x.m.pessoaId);
        return '<div style="display:flex;gap:12px;align-items:center;padding:11px 0'
          + (i===0?'':';border-top:1px solid var(--borda)') + '">'
          + '<span class="ic-t" style="background:' + x.m.cor + '1f">'
          + (ICONE_META[x.m.tipo]||'🎯') + '</span>'
          + '<div style="flex:1;min-width:0">'
          +   '<p style="font-weight:500">' + esc(x.m.nome)
          +   (dono ? '<span class="fra"> · ' + esc(dono.nome) + '</span>' : '') + '</p>'
          +   '<p class="pp fra">' + Math.round(x.v/total*100) + '% do que vocês guardaram</p>'
          + '</div>'
          + '<span class="tab" style="font-weight:650">' + $(x.v) + '</span></div>';
      }).join('')
    + '</div>';
}

function cartaoMeta(m){
  const guardado = guardadoNaMeta(m.id);
  const parte = m.alvo > 0 ? Math.min(guardado / m.alvo, 1) : 0;
  const pronta = guardado >= m.alvo;
  const falta = Math.max(m.alvo - guardado, 0);
  const dono = pessoa(m.pessoaId);

  let prazoTxt = '';
  if(m.prazo){
    const meses = mesesEntre(mesAtual(), mesDe(m.prazo));
    prazoTxt = meses <= 0 ? ' · prazo é este mês'
      : ' · ' + meses + (meses===1 ? ' mês restante' : ' meses restantes');
  }

  let dica = '';
  if(!pronta){
    const meses = m.prazo ? Math.max(mesesEntre(mesAtual(), mesDe(m.prazo)), 0) : 0;
    dica = meses > 0
      ? 'Guardem <b class="tab">' + fmt(Math.ceil(falta/meses)) + '</b> por mês para chegar no prazo.'
      : 'Faltam <b class="tab">' + fmt(falta) + '</b>.';
  }

  return '<div style="padding:16px 0;border-top:1px solid var(--borda)">'
  + '<div class="lin" style="align-items:flex-start">'
  +   '<div style="min-width:0">'
  +     '<p style="font-weight:650">' + esc(m.nome) + '</p>'
  +     '<p class="pp fra">' + (dono ? esc(dono.nome) : 'Da casa') + ' · '
  +     (TIPOS_META[m.tipo]||m.tipo) + prazoTxt + '</p>'
  +   '</div>'
  +   (pronta
      ? '<span class="chip chip-pos">concluída</span>'
      : '<span class="tab" style="font-weight:650">' + Math.round(parte*100) + '%</span>')
  + '</div>'
  + '<div class="trilho" style="margin-top:12px"><div style="width:' + (parte*100)
  + '%;background:' + m.cor + '"></div></div>'
  + '<div class="lin p tab" style="margin-top:7px">'
  +   '<span style="font-weight:500;color:' + m.cor + '">' + $(guardado) + '</span>'
  +   '<span class="mut">de ' + $(m.alvo) + '</span>'
  + '</div>'
  + (dica ? '<p class="ajuda">' + dica + '</p>' : '')
  + '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">'
  +   '<button class="btn btn-2 btn-p" onclick="aportar(\'' + m.id + '\')">Guardar dinheiro</button>'
  +   '<button class="btn btn-2 btn-p" onclick="editarMeta(\'' + m.id + '\')">Editar</button>'
  +   '<button class="btn btn-x btn-p" onclick="removerMeta(\'' + m.id + '\')">Excluir</button>'
  + '</div></div>';
}

function editarMeta(id){
  const m = id ? meta(id)
    : {id:'', nome:'', tipo:'objetivo', alvo:0, prazo:'', pessoaId:'', cor:'#0e9f6e'};
  abrirModal(
    '<h2>' + (id ? 'Editar ' + esc(m.nome) : 'Nova meta') + '</h2>'
    + '<div class="campo"><label>Nome</label>'
    + '<input id="mNome" value="' + esc(m.nome) + '" placeholder="Reserva, viagem, notebook…"></div>'
    + '<div class="campo"><label>Tipo</label><select id="mTipo">'
    + Object.keys(TIPOS_META).map(function(k){
        return '<option value="' + k + '"' + (m.tipo===k?' selected':'') + '>'
             + TIPOS_META[k] + '</option>';
      }).join('') + '</select>'
    + '<p class="ajuda">A <b>reserva de emergência</b> é medida contra os seus gastos '
    + 'essenciais — por isso ela tem um tipo próprio.</p></div>'
    + '<div class="grade g2" style="gap:12px">'
    +   '<div class="campo"><label>Quanto querem juntar</label>'
    +   '<input id="mAlvo" inputmode="decimal" value="' + (m.alvo?fmtSimples(m.alvo):'')
    +   '" placeholder="0,00"></div>'
    +   '<div class="campo"><label>Prazo <span class="fra">(opcional)</span></label>'
    +   '<input id="mPrazo" type="date" value="' + esc(m.prazo) + '"></div>'
    + '</div>'
    + seletorDono('mPessoa', m.pessoaId)
    + '<div class="campo"><label>Cor</label>'
    + escolhedor('mCor', ['#0e9f6e','#4f46e5','#0694a2','#ec4899','#f59e0b','#8b5cf6'], m.cor, 'cor')
    + '</div>'
    + acoesModal('salvarMeta(\'' + (id||'') + '\')'));
}

function salvarMeta(id){
  const nome = (v('mNome')||'').trim();
  const alvo = lerDinheiro(v('mAlvo'));
  if(!nome){ alert('Dê um nome à meta.'); return; }
  if(!alvo || alvo <= 0){ alert('Informe quanto vocês querem juntar.'); return; }

  const dados = {
    nome: nome, tipo: v('mTipo'), alvo: alvo, prazo: v('mPrazo') || '',
    pessoaId: v('mPessoa') || '', cor: escolhido('mCor') || '#0e9f6e'
  };
  if(id) Object.assign(meta(id), dados);
  else DB.metas.push(Object.assign({id:uid()}, dados));
  salvarDB(); fecharModal(); desenhar();
}

function removerMeta(id){
  const m = meta(id);
  const n = DB.aportes.filter(function(a){ return a.metaId === id; }).length;
  if(!confirm('Excluir "' + m.nome + '"?'
    + (n ? '\n\nOs ' + n + ' aportes dela também somem do total guardado.' : ''))) return;
  DB.aportes = DB.aportes.filter(function(a){ return a.metaId !== id; });
  DB.metas   = DB.metas.filter(function(x){ return x.id !== id; });
  salvarDB(); desenhar();
}

/**
 * Guardar dinheiro numa meta.
 * Se uma conta for escolhida, o valor também sai dela como TRANSFER — porque
 * guardar não é gastar: sai do caixa disponível mas continua sendo da casa
 * (regra 6 e 8 do CLAUDE.md).
 */
function aportar(metaId){
  const m = meta(metaId);
  abrirModal(
    '<h2>Guardar em ' + esc(m.nome) + '</h2>'
    + '<div class="grade g2" style="gap:12px">'
    +   '<div class="campo"><label>Valor</label>'
    +   '<input id="apValor" inputmode="decimal" placeholder="0,00"></div>'
    +   '<div class="campo"><label>Data</label>'
    +   '<input id="apData" type="date" value="' + hojeISO() + '"></div>'
    + '</div>'
    + '<div class="campo"><label>Tirar de</label><select id="apConta">'
    + '<option value="">Não descontar de nenhuma conta</option>'
    + DB.contas.map(function(c){
        return '<option value="' + c.id + '">' + esc(c.nome) + '</option>';
      }).join('') + '</select>'
    + '<p class="ajuda">Escolher uma conta tira o valor do saldo dela. '
    + '<b>Guardar não conta como gasto do mês.</b></p></div>'
    + '<label style="display:flex;align-items:center;gap:9px;font-weight:400;margin-bottom:8px">'
    + '<input type="checkbox" id="apResgate" style="width:auto;min-height:0"> '
    + 'É um resgate (tirar da meta)</label>'
    + acoesModal('salvarAporte(\'' + metaId + '\')'));
}

function salvarAporte(metaId){
  const valor = lerDinheiro(v('apValor'));
  if(!valor || valor <= 0){ alert('Valor inválido.'); return; }

  const resgate = marcado('apResgate');
  const data = v('apData') || hojeISO();
  const contaId = v('apConta');
  const m = meta(metaId);

  DB.aportes.push({
    id: uid(), metaId: metaId, data: data,
    valor: resgate ? -valor : valor,
    nota: resgate ? 'Resgate' : ''
  });

  if(contaId){
    DB.lancamentos.push(novoLancamento({
      data: data,
      descricao: (resgate ? 'Resgate: ' : 'Guardado: ') + m.nome,
      valor: valor,
      /* Os dois são transferência: mexem no saldo, mas não são receita nem gasto. */
      tipo: resgate ? 'transf_entra' : 'transf',
      pessoaId: m.pessoaId || quemEstaUsando() || '',
      alvo: 'conta:' + contaId, pago: true, nota: 'Meta: ' + m.nome
    }));
  }

  salvarDB(); fecharModal(); desenhar();
  toast(resgate ? 'Resgate registrado.' : 'Guardado ' + fmt(valor) + '.');
}
/* =========================================================

const CORES = ['#4f46e5','#0ea5e9','#0e9f6e','#f59e0b','#e02424','#ec4899','#8b5cf6','#64748b'];
const ICONES_CAT = ['•','🛒','🥬','🥐','🍔','🏠','💡','⛽','🚗','🏥','💊','📱','🐈','🐕',
                    '🎉','🏋️','🛍️','📺','🎓','💼','💰','📈','🏦','⚠️','✈️','🌧️','🎁','💇','🔧'];
const TIPOS_CONTA = {corrente:'Conta corrente', dinheiro:'Dinheiro',
                     poupanca:'Poupança', investimento:'Investimento'};
const GRUPOS_SAIDA = {essencial:'Essencial', superfluo:'Supérfluo',

let abaAjustes = 'cadastros';

function desenharAjustes(){

      }).join('')

function salvarCartao(id){
  const nome = (v('kNome')||'').trim();
  if(!nome){ alert('Dê um nome ao cartão.'); return; }

  const limitar = function(x, padrao){
    const n = Number(x);
    return (Number.isInteger(n) && n>=1 && n<=31) ? n : padrao;
  };
  const fecha = limitar(v('kFecha'), 28);
  const vence = limitar(v('kVence'), 5);

  const dados = {
    nome: nome, diaFechamento: fecha, diaVencimento: vence,
    limite: lerDinheiro(v('kLimite')) || 0,
    donoId: v('kDono') || '', cor: escolhido('kCor') || '#8b5cf6'
  };

  if(!id){
    DB.cartoes.push(Object.assign({id:uid()}, dados));
    salvarDB(); fecharModal(); desenhar();
    return;
  }

  const ct = cartao(id);
  const mudouCiclo = ct.diaFechamento !== fecha || ct.diaVencimento !== vence;
  Object.assign(ct, dados);
  salvarDB();
  fecharModal();

  /* A ARMADILHA (regra 4 do CLAUDE.md): os lançamentos já gravados guardam o
     mesFatura calculado pela regra ANTIGA. Corrigir o cadastro não conserta o
     passado, e o erro não aparece na tela — só num total que para de bater. */
  const afetados = DB.lancamentos.filter(function(l){ return l.alvo === 'cartao:' + id; });
  if(mudouCiclo && afetados.length){
    perguntarRecalculo(ct, afetados.length);
  } else {
    desenhar();
  }
}

function perguntarRecalculo(ct, quantos){
  abrirModal(
    '<h2>Recalcular as faturas?</h2>'
    + '<p>Você mudou o ciclo do <b>' + esc(ct.nome) + '</b>. Existem <b>' + quantos
    + ' lançamentos</b> nesse cartão que foram calculados pela regra antiga.</p>'
    + '<p class="ajuda" style="margin-top:12px">'
    + '<b>Recalcular</b> é o certo quando você está corrigindo um cadastro errado.<br>'
    + '<b>Deixar como está</b> é o certo quando o banco realmente mudou a data agora — '
    + 'aí o passado estava correto e só o futuro muda.</p>'
    + '<div class="modal-acoes">'
    + '<button class="btn btn-2" onclick="fecharModal(); desenhar()">Deixar como está</button>'
    + '<button class="btn btn-1" onclick="recalcularFaturas(\'' + ct.id + '\')">Recalcular</button>'
    + '</div>');
}

function recalcularFaturas(cartaoId){
  const ct = cartao(cartaoId);
  let n = 0;
  DB.lancamentos.forEach(function(l){
    if(l.alvo !== 'cartao:' + cartaoId) return;
    const antes = l.mesFatura;
    /* Parcela usa a data do vencimento dela como data; recalcular a partir daí
       daria voltas. O que importa é reencaixar pela data original da compra. */
    const baseData = l.compraId
      ? (DB.compras.filter(function(c){ return c.id === l.compraId; })[0] || {}).dataCompra || l.data
      : l.data;
    const primeira = faturaDaCompra(baseData, ct.diaFechamento, ct.diaVencimento);
    l.mesFatura = l.parcelaN ? mesMais(primeira, l.parcelaN - 1) : primeira;
    l.mesComp = l.mesFatura;
    if(l.parcelaN) l.data = diaDoMes(l.mesFatura, ct.diaVencimento);
    if(antes !== l.mesFatura) n++;
  });
  salvarDB(); fecharModal(); desenhar();
  toast(n ? n + ' lançamento(s) mudaram de fatura.' : 'Nenhum lançamento precisou mudar.');
}

function removerCartao(id){
  const ct = cartao(id);
  const quantos = DB.lancamentos.filter(function(l){ return l.alvo === 'cartao:'+id; }).length;
  if(quantos){
    alert('Não dá para excluir "' + ct.nome + '": existem ' + quantos + ' lançamentos nele.\n\n'
        + 'Excluir apagaria o histórico e as parcelas em aberto.');

function escolher(id, valor){
  document.getElementById(id).value = valor;
  const ops = document.getElementById(id + '_ops');
  Array.prototype.forEach.call(ops.children, function(b){
    const meu = b.textContent || b.style.background;
    const bate = (b.textContent === valor) || (b.style.background === valor)
              || (b.style.backgroundColor && corIgual(b.style.backgroundColor, valor));
    b.style.border = bate
      ? (b.textContent ? '2px solid var(--ac)' : '3px solid var(--txt)')
      : '2px solid transparent';
  });
}
/* O navegador devolve a cor como "rgb(79, 70, 229)"; comparar com o hex direto
   nunca bate. */
function corIgual(rgb, hex){
  const m = String(rgb).match(/\d+/g);
  if(!m || m.length < 3) return false;
  const h = '#' + m.slice(0,3).map(function(n){
    return Number(n).toString(16).padStart(2,'0');
  }).join('');
  return h.toLowerCase() === String(hex).toLowerCase();
}

/* =========================================================
   PRIMEIRO USO E ACESSO

   Entrar escolhe QUEM está usando — não existe seletor separado de "lançando
   como". Um toque a menos, várias vezes por dia.

   O que este arquivo NÃO é: um cofre. O PIN é uma tranca. Quem tiver o aparelho
   destravado e souber mexer lê o localStorage por baixo dele. A proteção de
   verdade é a senha do próprio aparelho. Isso foi dito ao usuário e ele decidiu
   assim — ver CLAUDE.md § Acesso.
   ========================================================= */

/* ---------------------------------------------------------
   SHA-256 em JavaScript puro.

   Por que não `crypto.subtle`: ele exige contexto seguro, e o build local roda
   em file://, onde não é confiável. Uma função que funciona num build e falha
   no outro produziria PIN que entra num lugar e não entra no outro.
   --------------------------------------------------------- */
function sha256(txt){
  function rotr(n,x){ return (x>>>n) | (x<<(32-n)); }

  const K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
           0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];

  /* texto -> bytes UTF-8 */
  const bytes = [];
  for(let i=0;i<txt.length;i++){
    let c = txt.charCodeAt(i);
    if(c < 0x80) bytes.push(c);
    else if(c < 0x800){ bytes.push(0xc0|(c>>6), 0x80|(c&63)); }
    else if(c < 0xd800 || c >= 0xe000){ bytes.push(0xe0|(c>>12), 0x80|((c>>6)&63), 0x80|(c&63)); }
    else { /* par substituto */
      i++;
      c = 0x10000 + (((c & 0x3ff) << 10) | (txt.charCodeAt(i) & 0x3ff));
      bytes.push(0xf0|(c>>18), 0x80|((c>>12)&63), 0x80|((c>>6)&63), 0x80|(c&63));
    }
  }

  const bits = bytes.length * 8;
  bytes.push(0x80);
  while(bytes.length % 64 !== 56) bytes.push(0);
  for(let i=7;i>=0;i--) bytes.push((bits / Math.pow(2, i*8)) & 0xff);

  const w = new Array(64);
  for(let p=0; p<bytes.length; p+=64){
    for(let i=0;i<16;i++){
      w[i] = (bytes[p+i*4]<<24) | (bytes[p+i*4+1]<<16) | (bytes[p+i*4+2]<<8) | bytes[p+i*4+3];
    }
    for(let i=16;i<64;i++){
      const s0 = rotr(7,w[i-15]) ^ rotr(18,w[i-15]) ^ (w[i-15]>>>3);
      const s1 = rotr(17,w[i-2]) ^ rotr(19,w[i-2]) ^ (w[i-2]>>>10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for(let i=0;i<64;i++){
      const S1 = rotr(6,e) ^ rotr(11,e) ^ rotr(25,e);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
      const S0 = rotr(2,a) ^ rotr(13,a) ^ rotr(22,a);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) | 0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H = [ (H[0]+a)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+d)|0,
          (H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0 ];
  }
  return H.map(x=>((x>>>0).toString(16).padStart(8,'0'))).join('');
}

/* Sal por pessoa: sem ele, dois PINs iguais geram o mesmo hash e olhar o
   arquivo já entrega que as duas pessoas usam o mesmo número. */
function hashPin(pin, sal){ return sha256(sal + '|' + String(pin)); }

  if(!DB.pessoas.length) return false;                 // ainda nem cadastrou
  if(!DB.pessoas.some(p=>p.pinHash)) return false;     // ninguém criou PIN
  if(!pessoaAtiva) return true;

  const modo = aparelho().travarApos;
  if(modo === 'nunca') return false;
  if(modo === 'sempre') return false;   // já entrou nesta sessão; só ao abrir
  const limite = modo === '5min' ? 5*60*1000 : 60*60*1000;
  return (Date.now() - destravadoEm) > limite;
}

  el.innerHTML = rascunhoPessoas.map(function(p, i){

      + '<div style="flex:0 0 auto">'
      +   '<label>Ícone</label>'
      +   '<button class="btn btn-2" style="width:52px;font-size:20px;padding:0" '
      +   'onclick="bvTrocarEmoji(' + i + ')" title="Trocar ícone">' + p.emoji + '</button>'
      + '</div>'
      + '<div style="flex:1;min-width:0">'
      +   '<label>Nome</label>'

function bvAdicionar(){
  if(rascunhoPessoas.length >= 6){ toast('Seis pessoas já é bastante.'); return; }
  const i = rascunhoPessoas.length;
  rascunhoPessoas.push({nome:'', emoji:EMOJIS_PESSOA[i % EMOJIS_PESSOA.length],
                        cor:CORES_PESSOA[i % CORES_PESSOA.length]});
  bvDesenharLista();
}
function bvRemover(i){ rascunhoPessoas.splice(i,1); bvDesenharLista(); }
function bvTrocarEmoji(i){
  const atual = EMOJIS_PESSOA.indexOf(rascunhoPessoas[i].emoji);
  rascunhoPessoas[i].emoji = EMOJIS_PESSOA[(atual + 1) % EMOJIS_PESSOA.length];
  bvDesenharLista();
}

function bvConcluir(){
  const nomes = rascunhoPessoas.map(p=>(p.nome||'').trim()).filter(Boolean);
  if(!nomes.length){ alert('Coloque pelo menos um nome.'); return; }

  const repetido = nomes.some((n,i)=> nomes.findIndex(
    o=>o.toLowerCase()===n.toLowerCase()) !== i);
  if(repetido){ alert('Tem dois nomes iguais. Cada pessoa precisa de um nome diferente.'); return; }

  DB.pessoas = rascunhoPessoas
    .filter(p=>(p.nome||'').trim())
    .map(p=>({id: uid(), nome: p.nome.trim(), emoji: p.emoji, cor: p.cor,
              pinHash:'', pinSal:''}));
  DB.config.configurado = true;
  salvarDB();

  /* Este aparelho passa a ser da primeira pessoa por padrão. Ela troca depois
     em Ajustes se o celular for de outra pessoa. */
  mudarAparelho('pessoaPadrao', DB.pessoas[0].id);
  telaCriarPin(DB.pessoas[0].id);
}

/* Traz os dados do Drive para um aparelho novo.
   Precisa sair de um TOQUE: o Safari do iPhone bloqueia o pedido de acesso ao
   Google quando ele parte sozinho, tratando como pop-up. Por isso esta função
   nunca é chamada na abertura — só a partir de um botão. */
async function entrarComGoogle(){
  if(typeof sincronizarDrive !== 'function'){
    alert('A sincronização com o Drive só existe na versão publicada do app.');
    return;
  }
  try{
    await sincronizarDrive();
  }catch(e){ /* o próprio sincronizarDrive já explica a falha */ }

  /* Se veio gente do Drive, o cadastro daqui não é mais necessário: recomeça o
     fluxo, que agora vai cair direto na tela de entrar. */
  if(DB.pessoas.length){
    DB.config.configurado = true;
    salvarDB();
    pessoaEscolhida = null;
    abrirApp();
  } else {
    alert('Não achei dados nessa conta do Google.\n\n'
        + 'Se este é o primeiro aparelho, siga com o cadastro abaixo. '
        + 'Se não, confira se entrou com a mesma conta que vocês usam no app.');
  }
}

/* ---------------------------------------------------------
   2. CRIAR O PIN
   O PIN nunca vem embutido no código: o repositório é público, e um PIN padrão
   no fonte estaria publicado na internet. Cada pessoa cria o dela aqui.
   --------------------------------------------------------- */
function telaCriarPin(pessoaId){
  const p = pessoa(pessoaId);
  if(!p){ iniciarApp(); return; }

  telaCheia(
    '<div style="text-align:center;margin-bottom:24px">'
    + '<div class="av" style="width:64px;height:64px;font-size:30px;margin:0 auto;'
    + 'background:' + p.cor + '26">' + p.emoji + '</div>'
    + '<h1 style="font-size:22px;font-weight:700;margin-top:12px">Crie o PIN de ' + esc(p.nome) + '</h1>'
    + '<p class="mut" style="margin-top:6px">Quatro números, para abrir o app.</p></div>'

    + '<div class="card">'
    +   '<div class="campo"><label>PIN</label>'
    +   '<input id="pin1" type="password" inputmode="numeric" maxlength="8" '
    +   'autocomplete="off" placeholder="••••" style="text-align:center;'
    +   'font-size:26px;letter-spacing:.4em"></div>'
    +   '<div class="campo"><label>Repita</label>'
    +   '<input id="pin2" type="password" inputmode="numeric" maxlength="8" '
    +   'autocomplete="off" placeholder="••••" style="text-align:center;'
    +   'font-size:26px;letter-spacing:.4em"></div>'
    +   '<p id="pinErro" class="ajuda" style="color:var(--neg);display:none"></p>'
    +   '<button class="btn btn-1" style="width:100%;margin-top:6px" '
    +   'onclick="salvarPin(\'' + p.id + '\')">Salvar PIN</button>'
    + '</div>'

    + '<p class="ajuda" style="text-align:center">'
    + 'Esqueceu depois? Outra pessoa da casa destrava com o PIN dela. '
    + 'Se todos esquecerem, dá para reinstalar o app e trazer os dados de volta '
    + 'do Google Drive.</p>'
  );
  setTimeout(function(){ const e=document.getElementById('pin1'); if(e) e.focus(); }, 60);
}

function salvarPin(pessoaId){
  const a = (v('pin1')||'').trim();
  const b = (v('pin2')||'').trim();
  const err = document.getElementById('pinErro');
  function falha(msg){ err.textContent = msg; err.style.display = ''; }

  if(a.length < 4){ falha('Use pelo menos 4 números.'); return; }
  if(!/^\d+$/.test(a)){ falha('Só números.'); return; }
  if(a !== b){ falha('Os dois campos estão diferentes.'); return; }

  const p = pessoa(pessoaId);
  p.pinSal  = novoSal();
  p.pinHash = hashPin(a, p.pinSal);
  salvarDB();

  /* Se houver outra pessoa ainda sem PIN, emenda nela. As duas criam os PINs
     na mesma sentada, que é o momento em que estão juntas. */
  const proxima = DB.pessoas.find(x=>!x.pinHash);
  if(proxima){ telaCriarPin(proxima.id); return; }

  pessoaAtiva = pessoaId;
  destravadoEm = Date.now();
  iniciarApp();
}

function escolherPessoa(id){ pessoaEscolhida = id; telaEntrar(); }

function tentarEntrar(){
  const p = pessoa(pessoaEscolhida);
  const err = document.getElementById('entrarErro');
  const pin = (v('pinEntrar')||'').trim();

  if(!p) return;
  if(!p.pinHash){ telaCriarPin(p.id); return; }   // nunca criou PIN

  if(hashPin(pin, p.pinSal) !== p.pinHash){
    err.textContent = 'PIN errado.';
    err.style.display = '';
    const e = document.getElementById('pinEntrar');
    if(e){ e.value = ''; e.focus(); }
    return;
  }

  pessoaAtiva = p.id;
  destravadoEm = Date.now();
  mudarAparelho('pessoaPadrao', p.id);
  iniciarApp();

  /* Sincroniza aproveitando o toque que acabou de acontecer. Só quando este
     aparelho já usou o Drive alguma vez — senão viraria um pedido de permissão
     do Google surgindo do nada, logo na entrada. */
  if(typeof sincronizarDrive === 'function' && typeof meta === 'function'
     && meta().driveFileId && navigator.onLine){
    sincronizarDrive();
  }
}

function destravarComOutro(){

  const err = document.getElementById('destravaErro');

    err.textContent = 'PIN errado.';
    err.style.display = '';
    return;

  /* Zera o PIN de quem esqueceu e manda criar outro. Não mostramos o PIN antigo
     em lugar nenhum — nem ele está guardado, só o hash. */
  const eu = pessoa(pessoaEscolhida);
  eu.pinHash = ''; eu.pinSal = '';
  salvarDB();
  telaCriarPin(eu.id);
}

function iniciarApp(){
  fecharTelaCheia();
  /* Sem PIN o app não passa pela tela de entrar, e quem abriu pela primeira vez
     não descobre sozinho que dá para trocar de pessoa. */
  if(temVariasPessoas() && !DB.pessoas.some(function(p){ return p.pinHash; })
     && !aparelho().viuTrocaPessoa){
    mudarAparelho('viuTrocaPessoa', true);
    setTimeout(function(){
      toast('Toque no seu nome, no menu, para trocar quem está lançando.');
    }, 900);
  }

     de quem não quis tranca. */
  if(!pessoaAtiva && DB.pessoas.length) pessoaAtiva = aparelho().pessoaPadrao || DB.pessoas[0].id;

  desenhar();
}

function assumirPessoa(id){
  if(!pessoa(id)) return;
  pessoaAtiva = id;
  mudarAparelho('pessoaPadrao', id);
  fecharModal();
  atualizarRodape();
  desenhar();
  toast('Lançando como ' + pessoa(id).nome + '.');

/* Volta para a tela de entrar. Só faz sentido quando existe PIN — sem PIN não
   haveria como voltar a entrar. */
function bloquearApp(){
  fecharModal();
  pessoaAtiva = null;
  destravadoEm = 0;
  pessoaEscolhida = null;
  telaEntrar();
}

function abrirApp(){
  if(!DB.config.configurado || !DB.pessoas.length){ telaBoasVindas(); return; }
  if(DB.pessoas.some(p=>!p.pinHash) && !pessoaAtiva){
    const semPin = DB.pessoas.find(p=>!p.pinHash);
    telaCriarPin(semPin.id);
    return;
  }
  if(precisaDestravar()){ telaEntrar(); return; }
  iniciarApp();
}

document.addEventListener('DOMContentLoaded', abrirApp);
/* =========================================================
   SINCRONIZAÇÃO ENTRE COMPUTADORES
   Cada registro carrega a hora da última alteração. Ao sincronizar,
   a mesclagem é feita registro a registro — não arquivo contra arquivo.
   Assim, duas pessoas mexendo em coisas diferentes nunca perdem trabalho.
   ========================================================= */

/* O identificador do aparelho vive no CFG_KEY do 02_core.js (aparelho()), que
   NAO sincroniza: "qual celular e este" e desta maquina, nao da casa. */

/* coleções em lista, identificadas por id */
const SYNC_COLECOES = ['pessoas','contas','cartoes','categorias','lancamentos',
                       'compras','recorrentes','metas','aportes'];
/* mapas de dia: finanças não tem nenhum (no RH era o ponto mensal) */
const SYNC_MAPAS_DIA = [];
/* mapas simples: {chave: valor} com hora paralela em _meta.
   orcamentos = "categoriaId_AAAA-MM" -> centavos (regra 7 do CLAUDE.md) */
const SYNC_MAPAS = ['orcamentos'];
/* objetos únicos, com hora própria */
const SYNC_OBJETOS = ['config'];

function dispositivo(){ return aparelho(); }
function nomeDispositivo(){
  return aparelho().nome || 'Aparelho sem nome';
}
function setNomeDispositivo(nome){
  mudarAparelho('nome', (nome||'').trim());
}

function metaVazia(){
  return {tombstones:{}, mapaTs:{}, objetoTs:{}, ultimaSync:null, ultimaEdicao:null, arquivoNome:''};
}
function meta(){
  if(!DB._meta) DB._meta = metaVazia();
  DB._meta.tombstones = DB._meta.tombstones || {};
  DB._meta.mapaTs     = DB._meta.mapaTs     || {};
  DB._meta.objetoTs   = DB._meta.objetoTs   || {};
  return DB._meta;
}

/* ---------- carimbo automático das alterações ----------
   Comparamos o estado atual com uma fotografia do último save.
   O que mudou ganha a hora atual; o que sumiu vira "lápide" (tombstone). */
let _foto = null;

function semCarimbo(o){
  const c = {};
  Object.keys(o||{}).forEach(k=>{ if(k!=='_ts' && k!=='_dev') c[k]=o[k]; });
  return JSON.stringify(c);
}
function tirarFoto(db){
  const f = {colecoes:{}, mapasDia:{}, mapas:{}, objetos:{}};
  SYNC_COLECOES.forEach(nome=>{
    f.colecoes[nome] = {};
    (db[nome]||[]).forEach(r=>{ f.colecoes[nome][r.id] = semCarimbo(r); });
  });
  SYNC_MAPAS_DIA.forEach(nome=>{
    f.mapasDia[nome] = {};
    Object.keys(db[nome]||{}).forEach(k=>{
      const reg = db[nome][k] || {};
      const snap = {};
      /* status + marcador "a confirmar" juntos: confirmar um dia também é uma
         alteração que precisa viajar para o outro computador */
      Object.keys(reg.dias||{}).forEach(iso=>{
        snap[iso] = (reg.dias[iso]||'') + ((reg.auto||{})[iso] ? '~auto' : '');
      });
      f.mapasDia[nome][k] = snap;
    });
  });
  SYNC_MAPAS.forEach(nome=>{ f.mapas[nome] = Object.assign({}, db[nome]||{}); });
  SYNC_OBJETOS.forEach(nome=>{ f.objetos[nome] = semCarimbo(db[nome]); });
  return f;
}

function carimbarAlteracoes(){
  const agora = Date.now();
  const dev = dispositivo().id;
  const m = meta();
  let mudou = false;

  if(!_foto){ _foto = tirarFoto(DB); return false; }

  SYNC_COLECOES.forEach(nome=>{
    const antes = _foto.colecoes[nome] || {};
    const vistos = {};
    (DB[nome]||[]).forEach(r=>{
      if(!r.id) r.id = uid();
      vistos[r.id] = true;
      const atual = semCarimbo(r);
      if(antes[r.id] === undefined || antes[r.id] !== atual){
        r._ts = agora; r._dev = dev; mudou = true;
      }
    });
    Object.keys(antes).forEach(id=>{
      if(!vistos[id]){
        m.tombstones[nome] = m.tombstones[nome] || {};
        m.tombstones[nome][id] = agora;
        mudou = true;
      }
    });
    // registro que voltou a existir cancela a lápide
    if(m.tombstones[nome]) Object.keys(vistos).forEach(id=>{
      if(m.tombstones[nome][id]) delete m.tombstones[nome][id];
    });
  });

  SYNC_MAPAS_DIA.forEach(nome=>{
    const antes = _foto.mapasDia[nome] || {};
    Object.keys(DB[nome]||{}).forEach(chave=>{
      const reg = DB[nome][chave];
      reg.dias = reg.dias || {}; reg.ts = reg.ts || {}; reg.auto = reg.auto || {};
      const antesDias = antes[chave] || {};
      Object.keys(reg.dias).forEach(iso=>{
        const atual = (reg.dias[iso]||'') + (reg.auto[iso] ? '~auto' : '');
        if(antesDias[iso] !== atual){ reg.ts[iso] = agora; mudou = true; }
      });
    });
  });

  SYNC_MAPAS.forEach(nome=>{
    const antes = _foto.mapas[nome] || {};
    m.mapaTs[nome] = m.mapaTs[nome] || {};
    Object.keys(DB[nome]||{}).forEach(chave=>{
      if(antes[chave] !== DB[nome][chave]){
        m.mapaTs[nome][chave] = agora; mudou = true;
      }
    });
  });

  SYNC_OBJETOS.forEach(nome=>{
    if(_foto.objetos[nome] !== semCarimbo(DB[nome])){
      m.objetoTs[nome] = agora; mudou = true;
    }
  });

  if(mudou) m.ultimaEdicao = {dev, nome: nomeDispositivo(), quando: agora};
  return mudou;
}

/* ---------- mesclagem ---------- */
function mesclar(local, remoto){
  const res = {novos:0, atualizados:0, removidos:0, enviados:0, conflitos:0};
  const achados = [];   // conflitos desta mesclagem
  const mLocal  = local._meta  || metaVazia();
  const mRemoto = remoto._meta || metaVazia();
  const ts = r => Number(r && r._ts) || 0;

  SYNC_COLECOES.forEach(nome=>{
    const porId = {};
    /* Linha de base: o _ts que cada registro tinha na última sincronização.
       Sem ela é impossível distinguir "só o outro mexeu" de "os dois mexeram" —
       nos dois casos o remoto chega com hora maior. */
    const base = (mLocal.base && mLocal.base[nome]) || {};

    (local[nome]||[]).forEach(r=> porId[r.id] = {r, origem:'local'});
    (remoto[nome]||[]).forEach(r=>{
      const atual = porId[r.id];
      if(!atual){ porId[r.id] = {r, origem:'remoto'}; res.novos++; return; }

      /* CONFLITO: os dois lados mexeram no MESMO registro desde a última
         sincronização, e o conteúdo ficou diferente. Continua valendo o mais
         recente — nada trava e nada se perde — mas a tela avisa, em vez de
         escolher calada. É o caso raro; o normal é cada um lançar coisas
         diferentes, e aí nem passa por aqui. */
      const tb = Number(base[r.id]) || 0;
      if(ts(atual.r) > tb && ts(r) > tb && semCarimbo(atual.r) !== semCarimbo(r)){
        achados.push({
          colecao: nome, id: r.id, quando: Date.now(),
          meu:  JSON.parse(JSON.stringify(atual.r)),
          dele: JSON.parse(JSON.stringify(r))
        });
        res.conflitos++;
      }

      if(ts(r) > ts(atual.r)){ porId[r.id] = {r, origem:'remoto'}; res.atualizados++; }
      else if(ts(atual.r) > ts(r)) res.enviados++;
    });
    // lápides: apaga se a remoção for mais nova que o registro
    const tomb = Object.assign({}, mLocal.tombstones[nome]||{}, {});
    Object.keys(mRemoto.tombstones[nome]||{}).forEach(id=>{
      const t = mRemoto.tombstones[nome][id];
      if(!tomb[id] || t > tomb[id]) tomb[id] = t;
    });
    Object.keys(tomb).forEach(id=>{
      if(porId[id] && tomb[id] > ts(porId[id].r)){ delete porId[id]; res.removidos++; }
    });
    local[nome] = Object.keys(porId).map(id=>porId[id].r);
    mLocal.tombstones[nome] = tomb;
  });

  SYNC_MAPAS_DIA.forEach(nome=>{
    local[nome] = local[nome] || {};
    Object.keys(remoto[nome]||{}).forEach(chave=>{
      const rr = remoto[nome][chave] || {dias:{}, ts:{}};
      const rl = local[nome][chave] = local[nome][chave] || {dias:{}, ts:{}};
      rl.dias = rl.dias||{}; rl.ts = rl.ts||{}; rl.auto = rl.auto||{};
      Object.keys(rr.dias||{}).forEach(iso=>{
        const tr = Number((rr.ts||{})[iso])||0, tl = Number(rl.ts[iso])||0;
        if(tr > tl){
          rl.dias[iso] = rr.dias[iso]; rl.ts[iso] = tr;
          /* o marcador "a confirmar" viaja junto com o status */
          if((rr.auto||{})[iso]) rl.auto[iso] = true; else delete rl.auto[iso];
          res.atualizados++;
        }
      });
    });
  });

  SYNC_MAPAS.forEach(nome=>{
    local[nome] = local[nome] || {};
    mLocal.mapaTs[nome] = mLocal.mapaTs[nome] || {};
    const tsR = (mRemoto.mapaTs||{})[nome] || {};
    Object.keys(remoto[nome]||{}).forEach(chave=>{
      const tr = Number(tsR[chave])||0, tl = Number(mLocal.mapaTs[nome][chave])||0;
      if(tr > tl){ local[nome][chave] = remoto[nome][chave]; mLocal.mapaTs[nome][chave] = tr; res.atualizados++; }
    });
  });

  SYNC_OBJETOS.forEach(nome=>{
    const tr = Number((mRemoto.objetoTs||{})[nome])||0;
    const tl = Number((mLocal.objetoTs||{})[nome])||0;
    if(tr > tl && remoto[nome]){
      local[nome] = Object.assign({}, defaultDB()[nome], remoto[nome]);
      mLocal.objetoTs[nome] = tr;
      res.atualizados++;
    }
  });

  // quem editou por último, entre os dois lados
  const eL = mLocal.ultimaEdicao, eR = mRemoto.ultimaEdicao;
  mLocal.ultimaEdicao = (!eL || (eR && eR.quando > eL.quando)) ? eR : eL;

  /* Os conflitos ficam guardados até a pessoa resolver. Só os 30 mais recentes:
     lista infinita de aviso vira ruído e ninguém abre. */
  mLocal.conflitos = (mLocal.conflitos || []).concat(achados).slice(-30);

  local._meta = mLocal;
  return res;
}

/* Fotografa o _ts de cada registro DEPOIS de uma sincronização completa.
   É contra esta foto que a próxima mesclagem decide o que é conflito. */
function firmarBase(){
  const m = meta();
  m.base = {};
  SYNC_COLECOES.forEach(nome=>{
    m.base[nome] = {};
    (DB[nome]||[]).forEach(r=>{ m.base[nome][r.id] = Number(r._ts)||0; });
  });
}

function conflitosAbertos(){ return (meta().conflitos || []).length; }

/* A pessoa escolheu qual versão vale. "minha" regrava o registro com hora de
   agora, para que ele viaje e vença no outro aparelho na próxima sincronização.
   "dele" só descarta o aviso: o valor do outro já está valendo desde a mesclagem. */
function resolverConflito(i, escolha){
  const m = meta();
  const c = (m.conflitos || [])[i];
  if(!c) return;

  if(escolha === 'minha'){
    const lista = DB[c.colecao] || [];
    const k = lista.findIndex(r=>r.id === c.id);
    const reg = Object.assign({}, c.meu, {_ts: Date.now(), _dev: dispositivo().id});
    if(k >= 0) lista[k] = reg; else lista.push(reg);
  }

  m.conflitos.splice(i, 1);
  salvarDB();
  renderSync();
  toast(escolha === 'minha' ? 'Mantida a sua versão.' : 'Mantida a versão do outro aparelho.');
}

function descartarConflitos(){
  if(!confirm('Dispensar todos os avisos de conflito?\n\nOs valores continuam como estão — some só o aviso.')) return;
  meta().conflitos = [];
  salvarDB();
  renderSync();
}

/* ---------- pacote de sincronização ---------- */
function pacoteSync(){
  carimbarAlteracoes();
  const p = JSON.parse(JSON.stringify(DB));
  p._formato = 'financas-casal-sync-1';
  p._gravadoPor = {dev: dispositivo().id, nome: nomeDispositivo(), quando: Date.now()};
  return p;
}
function aplicarPacote(texto){
  const remoto = JSON.parse(texto);
  if(!remoto || typeof remoto !== 'object') throw new Error('Arquivo inválido.');
  /* Aceita qualquer arquivo que traga ao menos uma coleção nossa. Conferir só o
     _formato recusaria o pacote de uma versão anterior, que continua válido. */
  if(!remoto.lancamentos && !remoto.contas && !remoto.pessoas){
    throw new Error('Este arquivo não parece ser do Finanças Casal.');
  }
  carimbarAlteracoes();
  const res = mesclar(DB, migrar(Object.assign(defaultDB(), remoto)));
  meta().ultimaSync = Date.now();
  _foto = null;              // força novo carimbo coerente no próximo save
  salvarDB();
  _foto = tirarFoto(DB);
  firmarBase();              // a partir daqui, o que mudar é alteração nova
  return res;
}
function resumoMesclagem(res){
  const p = [];
  if(res.novos)       p.push(`${res.novos} registro(s) novo(s) recebido(s)`);
  if(res.atualizados) p.push(`${res.atualizados} atualização(ões) trazida(s)`);
  if(res.removidos)   p.push(`${res.removidos} exclusão(ões) aplicada(s)`);
  if(res.enviados)    p.push(`${res.enviados} registro(s) seu(s) mais recente(s) mantido(s)`);
  if(res.conflitos)   p.push(`${res.conflitos} lançamento(s) editado(s) nos dois aparelhos — confira abaixo`);
  return p.length ? p.join(' · ') : 'Nada novo — os dois lados já estavam iguais.';
}

/* ---------- transporte A: arquivo direto na pasta do Drive ---------- */
let arquivoSync = null;           // FileSystemFileHandle
function suportaArquivoDireto(){ return typeof window.showSaveFilePicker === 'function'; }

/* O navegador esquece o arquivo escolhido ao recarregar a página. Guardamos o
   "handle" no IndexedDB para reencontrá-lo sozinho. Se o navegador não deixar
   (acontece em algumas configurações de arquivo local), o app só volta a pedir
   o arquivo no primeiro clique — nunca fica travado. */
const IDB_NOME = 'financasCasal', IDB_STORE = 'handles';

function idbAbrir(){
  return new Promise((ok, falha)=>{
    try{
      const req = indexedDB.open(IDB_NOME, 1);
      req.onupgradeneeded = ()=> req.result.createObjectStore(IDB_STORE);
      req.onsuccess = ()=> ok(req.result);
      req.onerror   = ()=> falha(req.error);
    }catch(e){ falha(e); }
  });
}
async function idbGuardarHandle(h){
  try{
    const db = await idbAbrir();
    await new Promise((ok, falha)=>{
      const t = db.transaction(IDB_STORE, 'readwrite');
      t.objectStore(IDB_STORE).put(h, 'arquivoSync');
      t.oncomplete = ok; t.onerror = ()=> falha(t.error);
    });
    db.close();
    return true;
  }catch(e){ return false; }
}
async function idbLerHandle(){
  try{
    const db = await idbAbrir();
    const h = await new Promise((ok, falha)=>{
      const t = db.transaction(IDB_STORE, 'readonly');
      const r = t.objectStore(IDB_STORE).get('arquivoSync');
      r.onsuccess = ()=> ok(r.result || null);
      r.onerror   = ()=> falha(r.error);
    });
    db.close();
    return h;
  }catch(e){ return null; }
}

/* tenta reconectar sozinho ao abrir o app (sem pedir nada ao usuário) */
async function reconectarArquivoSync(){
  if(!suportaArquivoDireto()) return;
  const h = await idbLerHandle();
  if(!h) return;
  arquivoSync = h;
  try{
    const p = await h.queryPermission({mode:'readwrite'});
    arquivoSyncLiberado = (p === 'granted');
  }catch(e){ arquivoSyncLiberado = false; }
  atualizarIndicadorSync();
  if(paginaAtual === 'sync') renderSync();
}
let arquivoSyncLiberado = false;

/* garante permissão de escrita; precisa ser chamada a partir de um clique */
async function garantirPermissao(){
  if(!arquivoSync) return false;
  try{
    let p = await arquivoSync.queryPermission({mode:'readwrite'});
    if(p !== 'granted') p = await arquivoSync.requestPermission({mode:'readwrite'});
    arquivoSyncLiberado = (p === 'granted');
    return arquivoSyncLiberado;
  }catch(e){ return false; }
}

async function escolherArquivoSync(criar){
  try{
    if(criar){
      arquivoSync = await window.showSaveFilePicker({
        suggestedName: 'financas-casal-dados.json',
        types: [{description:'Dados do Finanças Casal', accept:{'application/json':['.json']}}]
      });
    } else {
      const [h] = await window.showOpenFilePicker({
        types: [{description:'Dados do Finanças Casal', accept:{'application/json':['.json']}}]
      });
      arquivoSync = h;
    }
    arquivoSyncLiberado = true;
    meta().arquivoNome = arquivoSync.name;
    const guardou = await idbGuardarHandle(arquivoSync);
    meta().lembraArquivo = guardou;
    salvarDB();
    await sincronizarArquivo();
  }catch(e){
    if(e && e.name === 'AbortError') return;         // usuário cancelou
    alert('Não foi possível usar o arquivo diretamente neste navegador.\n\n'
        + 'Motivo: ' + (e && e.message ? e.message : e) + '\n\n'
        + 'Use o modo manual (botões "Baixar" e "Carregar"), que funciona em qualquer navegador e celular.');
    arquivoSync = null; arquivoSyncLiberado = false;
    renderSync();
  }
}

/* Botão único: conecta se precisar e sincroniza. Nunca fica desabilitado. */
async function sincronizarAgora(){
  if(!suportaArquivoDireto()){
    alert('Este navegador não permite gravar direto no arquivo. Use os botões "Carregar do Drive" e "Baixar para o Drive".');
    return;
  }
  if(!arquivoSync || !(await garantirPermissao())){
    // ainda não conectado nesta sessão — pede o arquivo e já sincroniza
    await escolherArquivoSync(false);
    return;
  }
  await sincronizarArquivo();
}

async function sincronizarArquivo(){
  if(!arquivoSync){ await escolherArquivoSync(false); return; }
  try{
    // 1) lê o que está no Drive e mescla
    let res = {novos:0, atualizados:0, removidos:0, enviados:0};
    try{
      const arq = await arquivoSync.getFile();
      const texto = await arq.text();
      if(texto && texto.trim()) res = aplicarPacote(texto);
    }catch(e){ /* arquivo novo/vazio — segue e grava */ }
    // 2) grava o resultado de volta
    const w = await arquivoSync.createWritable();
    await w.write(JSON.stringify(pacoteSync(), null, 2));
    await w.close();
    meta().ultimaSync = Date.now();
    salvarDB();
    atualizarIndicadorSync();
    if(paginaAtual === 'sync') renderSync();
    toast('Sincronizado com o Drive. ' + resumoMesclagem(res));
  }catch(e){
    alert('Falha ao sincronizar: ' + (e && e.message ? e.message : e)
        + '\n\nSe o arquivo mudou de lugar, clique em "Escolher o arquivo no Drive" para apontar de novo.');
  }
}

/* ---------- transporte B: baixar / carregar (funciona em qualquer aparelho) ---------- */
function baixarSync(){
  const blob = new Blob([JSON.stringify(pacoteSync(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'financas-casal-dados.json'; a.click();
  URL.revokeObjectURL(url);
  meta().ultimaSync = Date.now();
  salvarDB(); renderSync();
  toast('Arquivo gerado — salve-o na pasta do Google Drive, por cima do que já estava lá.');
}
function carregarSync(evt){
  const file = evt.target.files[0];
  evt.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const res = aplicarPacote(e.target.result);
      renderSync();
      alert('Sincronizado com sucesso.\n\n' + resumoMesclagem(res)
        + '\n\nNada foi apagado: os dois lados foram juntados registro a registro.');
    }catch(err){ alert('Não deu para ler o arquivo: ' + err.message); }
  };
  reader.readAsText(file);
}

/* ---------- transporte C: área de transferência ----------
   Para celular e tablet, onde mexer com arquivo é trabalhoso. Entre aparelhos
   Apple da mesma conta a área de transferência é compartilhada, então copiar
   num e colar no outro funciona sem passar por lugar nenhum. */
async function copiarDados(){
  const texto = JSON.stringify(pacoteSync());
  try{
    await navigator.clipboard.writeText(texto);
    meta().ultimaSync = Date.now();
    salvarDB(); atualizarIndicadorSync();
    if(paginaAtual === 'sync') renderSync();
    toast(`Copiado (${Math.round(texto.length/1024)} KB). Cole no outro aparelho.`);
  }catch(e){
    /* navegador recusou copiar sozinho: mostra o texto para copiar à mão */
    const box = document.getElementById('colarBox');
    const area = document.getElementById('colarTexto');
    if(box && area){
      box.style.display = '';
      area.value = texto;
      area.select();
      alert('Seu navegador não deixou copiar sozinho.\n\n'
          + 'O texto já está selecionado na caixa abaixo — copie com Ctrl+C '
          + '(ou toque e segure → Copiar).');
    } else {
      alert('Não foi possível copiar: ' + (e && e.message ? e.message : e));
    }
  }
}

function abrirColar(){
  const box = document.getElementById('colarBox');
  if(!box) return;
  box.style.display = '';
  const area = document.getElementById('colarTexto');
  if(area){ area.value = ''; area.focus(); }
}

function aplicarColado(){
  const area = document.getElementById('colarTexto');
  const texto = (area && area.value || '').trim();
  if(!texto){ alert('Cole o texto antes.'); return; }
  try{
    const res = aplicarPacote(texto);
    document.getElementById('colarBox').style.display = 'none';
    renderSync();
    alert('Juntado com sucesso.\n\n' + resumoMesclagem(res)
        + '\n\nNada foi apagado: os dois lados foram unidos registro a registro.');
  }catch(err){
    alert('Não deu para ler o que você colou: ' + err.message
        + '\n\nConfira se copiou o texto inteiro.');
  }
}

/* ---------- tela ---------- */

/* Cartão de conflito. Só existe quando os dois aparelhos editaram o MESMO
   lançamento antes de sincronizar — o caso raro. O comum é cada um lançar
   coisas diferentes, e aí a mesclagem junta tudo sem perguntar nada. */
function cartaoConflitos(){
  const lista = meta().conflitos || [];
  if(!lista.length) return '';

  const rotulo = {
    lancamentos:'lançamento', contas:'conta', cartoes:'cartão',
    categorias:'categoria', metas:'meta', aportes:'aporte',
    recorrentes:'conta fixa', compras:'compra', pessoas:'pessoa'
  };

  /* Mostra o que dá para ler de um registro sem saber a coleção dele. */
  function resumo(r){
    const partes = [];
    if(r.descricao) partes.push(esc(r.descricao));
    if(r.nome)      partes.push(esc(r.nome));
    if(r.valor !== undefined) partes.push('<b class="tab">' + fmt(r.valor) + '</b>');
    if(r.data)      partes.push('<span class="fra">' + fmtDiaMes(r.data) + '</span>');
    return partes.join(' · ') || '<span class="fra">registro sem descrição</span>';
  }

  return '<div class="card" style="border:1px solid var(--ala);">'
    + '<h2 style="color:var(--ala)">⚠ Editado nos dois aparelhos</h2>'
    + '<p class="ajuda" style="margin-bottom:16px">'
    + lista.length + ' ' + (lista.length===1?'registro foi editado':'registros foram editados')
    + ' aqui e no outro aparelho antes de sincronizar. '
    + '<b>Está valendo a alteração mais recente</b> — nada se perdeu. '
    + 'Confira e diga qual vale.</p>'
    + lista.map(function(c, i){
        return '<div style="border-top:1px solid var(--borda);padding:14px 0">'
          + '<p class="p mut" style="margin-bottom:8px">'
          + (rotulo[c.colecao] || c.colecao) + '</p>'
          + '<div class="grade g2" style="gap:10px">'
          +   '<div style="background:var(--sup2);border-radius:12px;padding:12px">'
          +     '<p class="pp fra" style="margin-bottom:4px">Neste aparelho</p>'
          +     '<p>' + resumo(c.meu) + '</p>'
          +     '<button class="btn btn-2 btn-p" style="margin-top:10px" '

/* Registros que já existiam antes da sincronização ganham hora ZERO — nunca hora atual.
   Se recebessem a hora de agora, um computador que só ABRIU o sistema poderia sobrescrever
   a edição de verdade feita no outro. */
function backfillCarimbos(){
  const m = meta();
  SYNC_COLECOES.forEach(nome=>{
    (DB[nome]||[]).forEach(r=>{ if(!r._ts) r._ts = 0; });
  });
  SYNC_MAPAS_DIA.forEach(nome=>{
    Object.keys(DB[nome]||{}).forEach(k=>{
      const r = DB[nome][k]; r.dias = r.dias||{}; r.ts = r.ts||{}; r.auto = r.auto||{};
      Object.keys(r.dias).forEach(iso=>{ if(!r.ts[iso]) r.ts[iso] = 0; });
    });
  });
  SYNC_MAPAS.forEach(nome=>{
    m.mapaTs[nome] = m.mapaTs[nome] || {};
    Object.keys(DB[nome]||{}).forEach(k=>{ if(!m.mapaTs[nome][k]) m.mapaTs[nome][k] = 0; });
  });
  SYNC_OBJETOS.forEach(nome=>{ if(!m.objetoTs[nome]) m.objetoTs[nome] = 0; });
}

/* =========================================================
   INDICADOR DE PENDÊNCIA — visível em todas as telas
   É o que impede o usuário de fechar o expediente sem mandar
   o trabalho para o outro computador.
   ========================================================= */
/* Ainda não configurou a sincronização? Então não é "pendência" — é só
   não estar configurado. Sem isso, uma instalação nova já abriria alarmando. */
function syncConfigurada(){
  const m = meta();
  return !!(m.ultimaSync || m.arquivoNome);
}
function pendenteSync(){
  const m = meta();
  if(!syncConfigurada()) return false;
  if(!m.ultimaEdicao) return false;
  return !m.ultimaSync || m.ultimaEdicao.quando > m.ultimaSync;
}
function desdeQuando(ts){
  const min = Math.floor((Date.now() - ts) / 60000);
  if(min < 1)  return 'agora há pouco';
  if(min < 60) return `há ${min} min`;
  const h = Math.floor(min/60);
  if(h < 24)   return `há ${h}h`;
  const d = Math.floor(h/24);
  return d === 1 ? 'ontem' : `há ${d} dias`;
}

function atualizarIndicadorSync(){
  const el = document.getElementById('syncIndicador');
  if(!el) return;
  const m = meta();
  if(pendenteSync()){
    el.className = 'sync-ind pendente';
    el.innerHTML = `<span class="pt"></span>
      <span>Alterações não enviadas ao Drive${m.ultimaEdicao?' · última edição '+desdeQuando(m.ultimaEdicao.quando):''}</span>
      <button class="btn btn-primary btn-sm" onclick="sincronizarAgora()">⟳ Sincronizar agora</button>`;
  } else if(syncConfigurada() && m.ultimaSync){
    el.className = 'sync-ind ok';
    el.innerHTML = `<span class="pt"></span><span>Tudo sincronizado com o Drive · ${desdeQuando(m.ultimaSync)}</span>`;
  } else {
    el.className = 'sync-ind neutro';
    el.innerHTML = `<span class="pt"></span>
      <span>Sincronização com o Drive ainda não configurada</span>
      <button class="btn btn-secondary btn-sm" onclick="goTo('sync')">Configurar</button>`;
  }
}

/* =========================================================
   AJUSTES DE TELA PEQUENA
   Entra nos DOIS builds: o computador não é afetado, porque tudo aqui só
   liga abaixo de 760px de largura.

   Resolve três incômodos relatados em 28/08/2026:
     1. as abas rolavam de lado e escondiam páginas  -> gaveta
     2. a página rolava de lado atrás de botão       -> tabela vira ficha
     3. logo e nome por baixo do relógio do iPhone   -> resolvido no CSS
