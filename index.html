<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Finanças</title>

<!-- iPhone e iPad: adicionado à Tela de Início, o app sai do Safari e fica ISENTO
     da regra que apaga o armazenamento após 7 dias sem uso. Sem esta meta, os
     lançamentos somem do aparelho. Não remover. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7C5CBF">

<!-- ÍCONE DA TELA DE INÍCIO.
     Estes dois links precisam estar AQUI, no HTML servido. Criados por
     JavaScript o Safari os ignora, e a Tela de Início cai na inicial do
     título — foi o "F" que apareceu no iPhone.
     E precisam apontar para ARQUIVO, não data: URI: o iOS aceita data URI em
     apple-touch-icon de forma inconstante.
     Os PNG são gerados pelo build.sh ao lado do HTML. Se faltarem, o navegador
     ignora o link em silêncio, sem quebrar nada. -->
<link rel="apple-touch-icon" sizes="180x180" href="icone-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icone-512.png">

<style>
/* =========================================================
   SISTEMA VISUAL
   Toda cor é variável — o modo escuro é uma troca de valores, não uma
   reescrita. Corpo em 16px porque o app é usado no iPad, e 14px obriga a
   aproximar o rosto. Todo alvo clicável tem 44px de altura (--tap), que é o
   mínimo confortável para o dedo.
   ========================================================= */
/* =========================================================
   PALETA "PAPEL" — trocada em 02/09/2026 a pedido do Maycon, que achou o
   app anterior (índigo/vidro) pouco acolhedor. Fundo cor de papel, tinta
   escura, e cada área de dinheiro tem sua cor: violeta é a marca, verde é
   o que sobra, tijolo é o que preocupa, âmbar é atenção, ouro é investimento.
   Os NOMES das variáveis não mudaram — só o valor — então nenhum componente
   precisou ser reescrito para herdar a paleta nova.
   ========================================================= */
:root{
  --bg:#F6F3ED; --sup:#ffffff; --sup2:#EFEAE0; --sup3:#E7E1D3;
  --borda:#E4DFD3; --borda2:#D2CBB9;
  --txt:#211F2B; --mut:#6B6F7A; --fra:#98958A;

  --ac:#7C5CBF; --ac2:#6A4CAE; --ac-fr:#EFE9FA;
  --pos:#2F7E6E; --pos-fr:#E4F3EE;
  --neg:#BD4B3C; --neg-fr:#FBE8E4;
  --ala:#C57A2E; --ala-fr:#FBEEDD;
  --inv:#B08A22; --inv-fr:#F6EFD8;

  /* Duas cores fixas para a barra lateral: ela fica escura sempre, nos dois
     temas — é a marca do app, não muda com o modo claro/escuro do aparelho. */
  --barra-bg:#211E2A; --barra-texto:#C7C2D6; --barra-fraco:#847E96;
  --barra-ativo:rgba(255,255,255,.12); --barra-hover:rgba(255,255,255,.07);
  --barra-realce:#B9A3E8;

  --serif:ui-serif,Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua','Times New Roman',serif;

  --som:0 1px 2px rgba(33,31,43,.05), 0 10px 26px -14px rgba(33,31,43,.20);
  --r:22px; --r2:16px;
  --tap:44px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#18161F; --sup:#211F29; --sup2:#292734; --sup3:#343048;
  --borda:#343048; --borda2:#453f5c;
  --txt:#ECE8F5; --mut:#A79FC0; --fra:#726c8a;

  --ac:#A78BFA; --ac2:#c4b5fd; --ac-fr:#2E2645;
  --pos:#4FBF9F; --pos-fr:#153A30;
  --neg:#E8796A; --neg-fr:#3A2019;
  --ala:#E0A053; --ala-fr:#3A2C14;
  --inv:#D9BE55; --inv-fr:#39310f;

  --barra-bg:#0F0D16; --barra-texto:#C7C2D6; --barra-fraco:#7A7590;
  --barra-ativo:rgba(255,255,255,.10); --barra-hover:rgba(255,255,255,.06);
  --barra-realce:#C4B5FD;

  --som:0 2px 4px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.4);
}}

*{box-sizing:border-box;margin:0;padding:0;border-color:var(--borda);}
/* -webkit-text-size-adjust: impede o Safari de inflar o texto sozinho ao virar
   o aparelho. touch-action:manipulation: mata o zoom por TOQUE DUPLO, que num
   app de lista se dispara sem querer o tempo todo. Os dois juntos deixam a tela
   parada onde deveria estar.

   O zoom por pinça continua funcionando de propósito: é o único que a pessoa
   pede, e o iOS não deixa desligar de qualquer forma. */
html{-webkit-text-size-adjust:100%;touch-action:manipulation;}
html,body{max-width:100%;overflow-x:hidden;}
body{
  background:var(--bg); color:var(--txt);
  font:400 16px/1.55 ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--borda2);border-radius:6px;}

/* Dinheiro usa largura de dígito fixa. Sem isso a coluna de valores fica
   serrilhada, porque o "1" é mais estreito que o "8". */
.tab{font-variant-numeric:tabular-nums;font-feature-settings:'tnum';}

/* ---------------------------------------------------------- LAYOUT */
#app{display:flex;min-height:100vh;}
/* A barra lateral fica ESCURA sempre, nos dois temas — é a marca do app,
   igual ao modelo que o Maycon trouxe. Por isso usa as variáveis --barra-*,
   que não mudam dentro do media query de modo escuro. */
#sidebar{
  width:248px;flex-shrink:0;background:var(--barra-bg);
  border-right:1px solid var(--barra-bg);
  display:flex;flex-direction:column;
}
#sidebar .marca{
  display:flex;align-items:baseline;gap:9px;padding:20px 18px 18px;
  border-bottom:1px solid rgba(255,255,255,.08);
  font-family:var(--serif);font-size:19px;font-weight:600;
  letter-spacing:-.01em;color:#fff;
}
#sidebar .marca em{font-style:normal;color:var(--barra-realce);}
#sidebar .marca .ponto{
  display:inline-flex;width:12px;height:12px;border-radius:50%;overflow:hidden;flex:none;
}
#sidebar .marca .ponto span{width:50%;height:100%;}
#sidebar nav{flex:1;overflow-y:auto;padding:10px 12px;}
.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:none;color:var(--barra-texto);
  min-height:var(--tap);padding:0 14px;border-radius:12px;
  font-weight:500;font-size:15px;font-family:inherit;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.navbtn+.navbtn{margin-top:3px;}
.navbtn.ativo{background:var(--barra-ativo);color:#fff;font-weight:650;}
.navbtn .ico{width:20px;height:20px;flex-shrink:0;opacity:.75;}
.navbtn.ativo .ico{opacity:1;color:var(--barra-realce);}
.navbtn .rot{min-width:0;overflow:hidden;text-overflow:ellipsis;}
#sidebar .pe{padding:12px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--barra-fraco);}
/* Quem está lançando agora. É botão, não rótulo: no celular do casal um pega o
   aparelho do outro o tempo todo, e trocar precisa ser um toque. */
#quemSou{
  display:flex;align-items:center;gap:9px;width:100%;
  min-height:var(--tap);padding:0 12px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;
  font-weight:600;font-size:14px;font-family:inherit;color:#fff;cursor:pointer;
  text-align:left;-webkit-tap-highlight-color:transparent;
}
#quemSou .rot{font-size:10px;font-weight:400;color:var(--barra-fraco);display:block;line-height:1;}
#quemSou .seta{margin-left:auto;color:var(--barra-fraco);font-size:11px;}
#versaoApp{margin-top:8px;padding-left:2px;}

#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  background:var(--sup);border-bottom:1px solid var(--borda);
  padding:14px 24px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:5;
}
#topbar h1{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.01em;}
#topbar .sub{font-size:12.5px;color:var(--mut);margin-top:1px;}
#topbar .tit{min-width:0;flex:1;}
#content{padding:24px 26px 56px;flex:1;min-width:0;}

/* botões da gaveta: escondidos no computador, onde a lateral é fixa */
#btnMenu,#btnFecharGaveta,#gavetaFundo{display:none;}

/* ---------------------------------------------------------- COMPONENTES */
.card{
  background:var(--sup);border:1px solid var(--borda);
  border-radius:var(--r);box-shadow:var(--som);
  padding:22px;margin-bottom:20px;
}
.card h2{
  font-family:var(--serif);
  font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  color:var(--fra);margin-bottom:14px;
}
.card h2 .aux{float:right;text-transform:none;letter-spacing:0;font-weight:600;
              font-size:13px;color:var(--ac);cursor:pointer;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:var(--tap);padding:0 18px;border-radius:12px;border:1px solid transparent;
  font-weight:650;font-size:15px;font-family:inherit;cursor:pointer;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;transition:filter .12s,background .12s;
}
.btn-1{background:var(--ac);color:#fff;}
.btn-2{background:transparent;color:var(--mut);border-color:var(--borda2);}
.btn-x{background:transparent;color:var(--neg);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
/* botão de linha de lista — menor, mas ainda alcançável pelo dedo */
.btn-p{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px;}

/* =========================================================
   RESPOSTA AO TOQUE E AO MOUSE

   Botão que não se mexe parece botão que não funcionou. No celular é pior:
   não há cursor para mudar de forma nem som de clique — o único aviso de que
   o toque pegou é o próprio botão reagir.

   Discreto de propósito: 3% de encolhida e um escurecimento leve. Dá para o
   olho registrar e não vira brinquedo.
   ========================================================= */
button,.btn,.navbtn,#quemSou{
  transition:transform .09s ease, filter .14s ease, background .14s ease,
             border-color .14s ease, box-shadow .14s ease;
}

/* PRESSIONADO — vale para o dedo e para o mouse.
   No toque o :active acende já no encostar do dedo, antes do clique: é isso
   que faz a ação parecer imediata mesmo quando a tela demora a trocar. */
button:active,.btn:active,.navbtn:active,#quemSou:active{
  transform:scale(.97);
  filter:brightness(.93);
}
.btn:disabled:active{transform:none;filter:none;}

/* SÓ ONDE EXISTE PONTEIRO DE VERDADE.
   Sem este cerco o :hover COLA no celular: depois do toque o botão fica aceso
   até se tocar em outro lugar, e parece que continua selecionado. */
@media (hover:hover) and (pointer:fine){
  .navbtn:hover{background:var(--barra-hover);color:#fff;}
  #quemSou:hover{border-color:var(--barra-realce);}
  .btn-1:hover{filter:brightness(1.08);}
  .btn-2:hover{background:var(--sup2);color:var(--txt);}
  .btn-x:hover{background:var(--neg-fr);}
  /* o leve levantar que dá relevo no PC — e o afundar ao clicar */
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(0) scale(.97);}
  .btn:disabled:hover{transform:none;filter:none;}
}

/* Enquanto algo está em curso. */
@keyframes girar{to{transform:rotate(360deg);}}
.girando{display:inline-block;animation:girar .9s linear infinite;}

/* Quem pediu menos movimento no aparelho recebe menos movimento. */
@media (prefers-reduced-motion:reduce){
  button,.btn,.navbtn,#quemSou{transition:none;}
  button:active,.btn:active,.navbtn:active,#quemSou:active{transform:none;}
  .btn:hover{transform:none;}
  .girando{animation:none;}
}

label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:5px;}
input,select,textarea{
  width:100%;min-height:var(--tap);
  background:var(--sup);border:1px solid var(--borda2);border-radius:12px;
  padding:9px 14px;color:var(--txt);
  /* 16px NÃO é escolha estética: abaixo disso o Safari do iPhone e do iPad dá
     zoom ao focar o campo, e não volta sozinho — a tela fica torta até a pessoa
     pinçar de volta. Não há viewport que evite: o iOS ignora user-scalable=no.

     E vai em propriedades SEPARADAS de propósito. Escrito como atalho
     (font:400 16px inherit) o navegador descarta tudo, porque "inherit" não
     vale como família dentro do atalho — era exatamente o defeito daqui. */
  font-weight:400;
  font-size:16px;
  font-family:inherit;
}
textarea{min-height:80px;line-height:1.5;}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--ac);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--ac) 18%, transparent);
}
input::placeholder{color:var(--fra);}
.campo{margin-bottom:14px;}

.chip{
  display:inline-flex;align-items:center;gap:5px;border-radius:999px;
  padding:5px 11px;font-size:13px;font-weight:600;
  background:var(--sup2);color:var(--mut);
}
.chip-ac{background:var(--ac-fr);color:var(--ac);}
.chip-pos{background:var(--pos-fr);color:var(--pos);}
.chip-neg{background:var(--neg-fr);color:var(--neg);}
.chip-ala{background:var(--ala-fr);color:var(--ala);}

/* quadradinho colorido com o emoji da categoria */
.ic-t{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  font-size:18px;flex:none;line-height:1;
}
.av{
  width:30px;height:30px;border-radius:999px;display:grid;place-items:center;
  font-size:15px;flex:none;line-height:1;
}

.trilho{height:10px;border-radius:999px;background:var(--sup2);overflow:hidden;}
.trilho>div{height:100%;border-radius:999px;transition:width .4s;}
.trilho-p{height:7px;}

/* números */
.n-g{font-size:clamp(38px,7vw,58px);font-weight:700;letter-spacing:-.03em;line-height:1.05;}
.n-m{font-size:32px;font-weight:700;letter-spacing:-.025em;line-height:1.1;}
.n-s{font-size:24px;font-weight:650;letter-spacing:-.02em;line-height:1.2;}

.lin{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.mut{color:var(--mut);} .fra{color:var(--fra);}
.pos{color:var(--pos);} .neg{color:var(--neg);} .inv{color:var(--inv);}
.p{font-size:13px;} .pp{font-size:12px;}
.ajuda{font-size:12.5px;color:var(--fra);line-height:1.6;margin-top:6px;}

.grade{display:grid;gap:18px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr);}}
/* Item de grid nasce com min-width:auto, e um número comprido
   ("R$ 1.234.567,89") empurra a coluna além do 1fr, alargando a linha inteira. */
.grade>*{min-width:0;}

/* cartão de destaque do painel: onde mora o saldo */
.heroi{
  border-radius:var(--r);padding:28px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#6A4CAE 0%,#7C5CBF 55%,#9B7ED1 100%);
  box-shadow:0 10px 30px rgba(124,92,191,.28);margin-bottom:20px;
}
/* brilho difuso; sem ele o gradiente fica chapado em tela grande */
.heroi::after{
  content:'';position:absolute;inset:auto -20% -60% auto;width:70%;aspect-ratio:1;
  background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%);
  pointer-events:none;
}
.heroi .rot{font-size:14px;font-weight:500;opacity:.85;}
.heroi .sub{margin-top:10px;font-size:14px;opacity:.9;max-width:46ch;}
.bolso{
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);
  border-radius:12px;padding:9px 13px;backdrop-filter:blur(4px);
}
.bolsos{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;position:relative;}

/* faixas de aviso no topo do conteúdo */
.faixa{padding:11px 26px;font-size:13px;font-weight:600;line-height:1.55;
       border-bottom:1px solid var(--borda);}
.faixa-erro{background:var(--neg-fr);color:var(--neg);border-bottom-color:var(--neg);}
.faixa-ala{background:var(--ala-fr);color:var(--ala);border-bottom-color:var(--ala);}

.aviso{
  display:flex;gap:14px;align-items:flex-start;padding:18px 20px;
  border-radius:var(--r);border:1px solid var(--neg);background:var(--neg-fr);
  margin-bottom:20px;
}
.aviso.ala{border-color:var(--ala);background:var(--ala-fr);}
.aviso .ic{font-size:22px;line-height:1;flex:none;}

table{width:100%;border-collapse:collapse;font-size:15px;}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;
   padding:12px 16px;border-bottom:1px solid var(--borda);white-space:nowrap;}
td{padding:13px 16px;border-bottom:1px solid var(--borda);}
tr:last-child td{border-bottom:none;}
.dir{text-align:right;}
.rolar{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.vazio{padding:30px;text-align:center;color:var(--fra);font-size:14px;}

/* z-index 200: ACIMA da gaveta (120). Sem isto o pop-up nasce atrás dela no
   celular, que foi exatamente o defeito relatado. Ordem das camadas do app:
   gaveta 110/120 · modal 200 · aviso 300 · tela de acesso 400. */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,18,.55);z-index:200;
          display:flex;align-items:center;justify-content:center;
          overflow-y:auto;
          padding:calc(20px + env(safe-area-inset-top)) 14px
                  calc(20px + env(safe-area-inset-bottom));}
/* margin:auto centraliza o que é curto e continua deixando rolar o que é longo —
   align-items:center sozinho cortaria o topo de um modal mais alto que a tela. */
.modal{background:var(--sup);border-radius:var(--r);max-width:640px;width:100%;
       padding:24px;margin:auto;}
.modal.largo{max-width:900px;}
.modal h2{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:16px;text-transform:none;
          letter-spacing:0;color:var(--txt);}
.modal-acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;
             border-top:1px solid var(--borda);padding-top:16px;}

.toast{position:fixed;bottom:22px;right:22px;background:var(--txt);color:var(--bg);
       padding:13px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:300;
       box-shadow:0 8px 24px rgba(0,0,0,.25);}
@media(max-width:760px){.toast{left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));}}

/* faixa de estado da sincronização — aparece em todas as telas */
.sync-ind{display:flex;align-items:center;gap:10px;padding:10px 26px;
          font-size:13px;font-weight:600;border-bottom:1px solid var(--borda);}
.sync-ind .pt{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.sync-ind button{margin-left:auto;}
.sync-ind.pendente{background:var(--ala-fr);color:var(--ala);border-bottom-color:var(--ala);}
.sync-ind.pendente .pt{background:var(--ala);box-shadow:0 0 0 3px color-mix(in srgb,var(--ala) 25%,transparent);}
.sync-ind.ok{background:var(--pos-fr);color:var(--pos);border-bottom-color:var(--pos);}
.sync-ind.ok .pt{background:var(--pos);}
.sync-ind.neutro{background:var(--ac-fr);color:var(--ac);border-bottom-color:var(--ac);}
.sync-ind.neutro .pt{background:var(--ac);}

/* =========================================================
   CELULAR E TABLET
   Três problemas resolvidos aqui, todos herdados do RH:
   1. logo e título passavam POR BAIXO do relógio do iPhone -> safe-area
   2. as abas rolavam de lado e escondiam páginas -> gaveta
   3. a página rolava de lado atrás de botão -> tabela vira ficha
   ========================================================= */
@media(max-width:900px){
  #app{flex-direction:column;}

  /* cabeçalho escuro de propósito: no iPhone o relógio e a bateria são
     desenhados em BRANCO por cima da página. Sobre barra clara eles somem. */
  #topbar{
    background:var(--ac);border-bottom:none;padding:10px 14px;
    padding-top:calc(10px + env(safe-area-inset-top));
    padding-left:calc(14px + env(safe-area-inset-left));
    padding-right:calc(14px + env(safe-area-inset-right));
  }
  #topbar h1{color:#fff;font-size:17px;}
  #topbar .sub{color:rgba(255,255,255,.8);font-size:12px;}
  #topbar h1,#topbar .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  #btnMenu{
    display:flex;align-items:center;justify-content:center;
    width:40px;height:40px;flex-shrink:0;
    background:rgba(255,255,255,.18);border:none;border-radius:11px;color:#fff;
    cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;
  }
  #btnMenu svg{width:22px;height:22px;}

  /* a barra lateral vira gaveta */
  #sidebar{
    position:fixed;top:0;left:0;bottom:0;z-index:120;
    width:84%;max-width:320px;
    transform:translateX(-102%);transition:transform .22s ease-out;
    box-shadow:2px 0 22px rgba(0,0,0,.34);border-right:none;

/* ---------------------------------------------------------
   BANCO

function defaultDB(){

    /* Ninguém vem cadastrado. O app serve para um casal, para uma pessoa só ou
       para mais gente da casa — quem usa se cadastra no primeiro uso.

     valor:       12345          SEMPRE em centavos, SEMPRE positivo
     tipo:        'saida' | 'entrada' | 'transf' | 'transf_entra'
     pessoaId:    'p_mari' | ''  vazio = do casal

     alvo:        'conta:x' | 'cartao:y'
     mesFatura:   'AAAA-MM'      só para cartão; em qual fatura caiu
     mesComp:     'AAAA-MM'      MÊS DE COMPETÊNCIA — ver regra 3 do CLAUDE.md
     pago:        true | false   false = previsto, ainda não saiu
     compraId, parcelaN, parcelaDe    quando faz parte de um parcelamento
     recorrenteId                     quando veio de uma conta fixa

   } */

/* Sugestões iniciais. Vieram das planilhas do casal, com duas correções:

/* Completa o que faltar num banco vindo de versão anterior ou de outro aparelho.
   Nunca apaga o que já existe — só preenche buraco. */
function migrar(db){
  const base = defaultDB();
  ['contas','cartoes','categorias','lancamentos','compras',
   'recorrentes','metas','aportes','pessoas'].forEach(k=>{
    db[k] = db[k] || base[k];
  });
  db.orcamentos = db.orcamentos || {};
  db.config = Object.assign({}, base.config, db.config||{});
  db._meta  = Object.assign({}, base._meta,  db._meta||{});
  db._meta.tombstones = db._meta.tombstones || {};
  db._meta.mapaTs     = db._meta.mapaTs     || {};
  db._meta.objetoTs   = db._meta.objetoTs   || {};
  db._meta.base       = db._meta.base       || {};
  db._meta.conflitos  = db._meta.conflitos  || [];

  /* Lançamento antigo sem mês de competência: calcula agora. Sem isso ele
     sumiria de todas as telas de mês, que é como o campo é consultado. */
  db.lancamentos.forEach(l=>{
    if(!l.mesComp) l.mesComp = l.mesFatura || (l.data||'').slice(0,7);
  });
  return db;
}

let DB = carregarDB();

function carregarDB(){
  try{
    const cru = localStorage.getItem(DB_KEY);
    if(!cru) return defaultDB();
    return migrar(Object.assign(defaultDB(), JSON.parse(cru)));
  }catch(e){
    console.error('Falha ao carregar; começando banco novo.', e);
    return defaultDB();
  }
}

/* Navegador que bloqueia armazenamento: o app continua funcionando na sessão e
   avisa, em vez de quebrar a tela inteira. */

  catch(e){ /* módulo de sync ainda não carregado */ }

/* ---------------------------------------------------------
   PREFERÊNCIAS DO APARELHO — não sincronizam, de propósito
   "Qual celular é este" e "quem costuma lançar aqui" são desta máquina.
   Se viajassem, o celular da Mari passaria a lançar como Mayky.
   --------------------------------------------------------- */
function aparelho(){
  let a = null;
  try{ a = JSON.parse(localStorage.getItem(CFG_KEY)||'null'); }catch(e){}
  if(!a || !a.id){
    a = {id: uid(), nome:'', pessoaPadrao:'', travarApos:'sempre', esconderValores:false};
    salvarAparelho(a);
  }
  if(a.travarApos === undefined) a.travarApos = 'sempre';
  return a;
}
function salvarAparelho(a){
  try{ localStorage.setItem(CFG_KEY, JSON.stringify(a)); }catch(e){}
}
function mudarAparelho(campo, valor){
  const a = aparelho(); a[campo] = valor; salvarAparelho(a);
}

/* ---------------------------------------------------------
   IDENTIDADE
   --------------------------------------------------------- */
function uid(){
  return 'id' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
}

/* ---------------------------------------------------------
   DINHEIRO — sempre inteiro em centavos (regra 1)
   --------------------------------------------------------- */

/* 123456 -> "R$ 1.234,56" */
function fmt(centavos){
  return ((Number(centavos)||0) / 100)
    .toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
/* 123456 -> "R$ 1.235" — para rótulo de gráfico, onde espaço é curto */
function fmtCurto(centavos){
  return 'R$ ' + Math.round((Number(centavos)||0)/100).toLocaleString('pt-BR');
}
/* 123456 -> "1.234,56" — para dentro de campo de digitação */
function fmtSimples(centavos){
  return ((Number(centavos)||0)/100).toLocaleString('pt-BR',
    {minimumFractionDigits:2, maximumFractionDigits:2});
}

/* Com o "esconder valores" ligado, todo dinheiro da tela vira •••.
   É esta função que as telas usam, nunca a fmt() direto. */
function $(centavos){
  return aparelho().esconderValores ? '•••••' : fmt(centavos);
}

/**
 * Converte o que a pessoa digitou em centavos.
 * Aceita os dois formatos que um brasileiro usa: "1.234,56" e "1234.56".
 * Devolve null quando não dá para interpretar.
 */
function lerDinheiro(texto){
  const cru = String(texto==null?'':texto).trim().replace(/[R$\s]/gi,'');
  if(!cru) return null;

  const temVirgula = cru.indexOf(',') >= 0;
  const temPonto   = cru.indexOf('.') >= 0;
  let n;

  if(temVirgula && temPonto){
    /* "1.234,56" — ponto é milhar, vírgula é decimal */
    n = cru.replace(/\./g,'').replace(',','.');
  } else if(temVirgula){
    n = cru.replace(',','.');
  } else if(temPonto){
    /* Ambíguo: "1.234" pode ser mil-duzentos ou um-e-pouco.
       Se depois do último ponto sobram 3 dígitos, é separador de milhar. */
    const p = cru.split('.');
    n = (p[p.length-1].length === 3 && p.length >= 2) ? p.join('') : cru;
  } else {
    n = cru;
  }

  const v = Number(n);
  if(!isFinite(v)) return null;
  return Math.round(v * 100);
}

/** Divide um total em N parcelas sem perder centavo: a sobra vai na primeira. */
function dividirParcelas(total, n){
  total = Number(total)||0;
  n = Math.max(1, Math.floor(n)||1);
  const base = Math.floor(total / n);
  const sobra = total - base * n;
  const r = [];
  for(let i=0;i<n;i++) r.push(i===0 ? base + sobra : base);
  return r;
}

/* ---------------------------------------------------------
   DATAS
   Chave de mês é "AAAA-MM": ordena como texto igual à cronologia e não sofre
   com fuso horário, que é a origem clássica do "lançamento caiu no mês errado".
   --------------------------------------------------------- */
function hojeISO(){
  const d = new Date();
  return d.getFullYear() + '-'
       + String(d.getMonth()+1).padStart(2,'0') + '-'
       + String(d.getDate()).padStart(2,'0');
}
function mesAtual(){ return hojeISO().slice(0,7); }
function mesDe(iso){ return (iso||'').slice(0,7); }

/** "2026-08" + 5 -> "2027-01" (aceita negativo) */
function mesMais(ym, n){
  let [y,m] = ym.split('-').map(Number);
  const t = y*12 + (m-1) + n;
  return Math.floor(t/12) + '-' + String((t%12)+1).padStart(2,'0');
}
/** ("2026-08","2027-02") -> 6 */
function mesesEntre(de, ate){
  const [ay,am] = de.split('-').map(Number);
  const [by,bm] = ate.split('-').map(Number);
  return (by*12+bm) - (ay*12+am);
}
/** "2026-08" -> "Agosto de 2026" */
function nomeMes(ym){
  const [y,m] = ym.split('-').map(Number);
  return MESES[m-1] + ' de ' + y;
}
/** "2026-08" -> "ago/26" */
function nomeMesCurto(ym){
  const [y,m] = ym.split('-').map(Number);
  return MESES_CURTO[m-1] + '/' + String(y).slice(2);
}
function diasNoMes(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
/** Encaixa um dia que pode não existir: vencimento 31 em fevereiro vira 28. */
function diaDoMes(ym, dia){
  const ult = diasNoMes(ym);
  return ym + '-' + String(Math.min(Math.max(dia,1), ult)).padStart(2,'0');
}
/** "2026-08-26" -> "26 de ago" */
function fmtDiaMes(iso){
  if(!iso) return '—';
  const [,m,d] = iso.split('-');
  return Number(d) + ' de ' + MESES_CURTO[Number(m)-1];
}
/** "2026-08-26" -> "26/08/2026" */
function fmtData(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return d + '/' + m + '/' + y;
}
function somarDias(iso, n){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d + n);
  return dt.getFullYear() + '-'
       + String(dt.getMonth()+1).padStart(2,'0') + '-'
       + String(dt.getDate()).padStart(2,'0');
}

/* ---------------------------------------------------------
   FATURA — regra 4 do CLAUDE.md
   --------------------------------------------------------- */

/**
 * Em qual fatura uma compra cai.
 *
 * A fatura fecha no dia `fechamento`. Compra DEPOIS disso já entra no ciclo
 * seguinte. A fatura é identificada pelo mês do VENCIMENTO, que é como o banco
 * fala — "a fatura de maio" é a que vence em maio.
 *
 * Cartão que fecha 28 e vence 5:
 *   compra 20/abr -> fecha 28/abr -> vence 5/mai -> "2026-05"
 *   compra 29/abr -> fecha 28/mai -> vence 5/jun -> "2026-06"
 */
function faturaDaCompra(iso, fechamento, vencimento){
  const [y,m,d] = iso.split('-').map(Number);
  let ano = y, mes = m - 1;                       // mes 0-11 para facilitar a conta

  if(d > fechamento) mes += 1;                    // passou do fechamento
  if(vencimento <= fechamento) mes += 1;          // vence no mês seguinte ao fechamento

  ano += Math.floor(mes/12);
  mes = ((mes % 12) + 12) % 12;
  return ano + '-' + String(mes+1).padStart(2,'0');
}

/** Data em que a fatura de um mês vence de verdade. */
function vencimentoDaFatura(ym, diaVencimento){
  return diaDoMes(ym, diaVencimento);
}

/**
 * MÊS DE COMPETÊNCIA — regra 3, a mais importante do app.
 * O gasto pertence ao mês em que o dinheiro SAI, não ao mês da compra.
 *   débito/dinheiro/pix -> mês da data
 *   crédito             -> mês da fatura
 */
function competencia(lanc){
  if(lanc.mesFatura) return lanc.mesFatura;
  return mesDe(lanc.data);
}

/* ---------------------------------------------------------
   ATALHOS DE DOMÍNIO
   --------------------------------------------------------- */
function pessoa(id){   return DB.pessoas.find(p=>p.id===id) || null; }
function conta(id){    return DB.contas.find(c=>c.id===id) || null; }
function cartao(id){   return DB.cartoes.find(c=>c.id===id) || null; }
function categoria(id){return DB.categorias.find(c=>c.id===id) || null; }
function meta(id){     return DB.metas.find(m=>m.id===id) || null; }

function nomePessoa(id){ const p = pessoa(id); return p ? p.nome : 'Da casa'; }
function iconePessoa(id){ const p = pessoa(id); return p ? p.emoji : '🏠'; }

/* Usando sozinho, "quem gastou" não informa nada: tudo é da mesma pessoa.
   As telas consultam isto para esconder o painel por pessoa, o filtro e o
   seletor "de quem é" — em vez de mostrar um gráfico de uma fatia só. */
function temVariasPessoas(){ return DB.pessoas.length > 1; }

/** "conta:x" / "cartao:y" -> o nome que aparece na lista */
function nomeAlvo(alvo){
  if(!alvo) return '';
  const [tipo,id] = alvo.split(':');
  const o = tipo === 'cartao' ? cartao(id) : conta(id);
  return o ? o.nome : '';
}
function alvoEhCartao(alvo){ return String(alvo||'').indexOf('cartao:') === 0; }
function idDoAlvo(alvo){ return String(alvo||'').split(':')[1] || ''; }

/** Orçamento de uma categoria num mês. null = sem teto naquele mês. */
function orcamentoDe(categoriaId, ym){
  const v = DB.orcamentos[categoriaId + '_' + ym];
  return (v === undefined || v === null || v === '') ? null : Number(v);
}
function definirOrcamento(categoriaId, ym, centavos){
  const chave = categoriaId + '_' + ym;
  if(centavos === null) delete DB.orcamentos[chave];
  else DB.orcamentos[chave] = centavos;
}

/* ---------------------------------------------------------
   TEXTO E TELA
   --------------------------------------------------------- */
function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function toast(msg){
  const raiz = document.getElementById('toastRoot');
  if(!raiz) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  raiz.appendChild(el);
  setTimeout(()=>el.remove(), 2800);
}

function abrirModal(html, largo){
  /* No celular a gaveta fica aberta por cima do que a pessoa acabou de pedir.
     Fechar aqui cobre todo modal do app, inclusive os que ainda não existem. */
  try{ if(typeof fecharGaveta === 'function') fecharGaveta(); }catch(e){}

  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this) fecharModal()">'
    + '<div class="modal' + (largo?' largo':'') + '">' + html + '</div></div>';

  /* fecharGaveta() destravou a rolagem do body; sem travar de novo, o fundo
     rola atrás do modal quando o dedo passa da borda dele. */
  document.body.style.overflow = 'hidden';
}
function fecharModal(){
  document.getElementById('modalRoot').innerHTML = '';
  document.body.style.overflow = '';
}

/* ---------------------------------------------------------
   CÓPIA DE SEGURANÇA
   Diferente da sincronização: restaurar SUBSTITUI tudo, não junta.
   --------------------------------------------------------- */
function exportarBackup(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'financas-casal-backup-' + hojeISO() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup exportado. Guarde numa subpasta do Drive.');
}

function importarBackup(evt){
  const arq = evt.target.files[0];
  evt.target.value = '';
  if(!arq) return;

  const leitor = new FileReader();
  leitor.onload = function(e){
    try{
      const dados = JSON.parse(e.target.result);
      if(!confirm('Restaurar este backup vai SUBSTITUIR tudo que está neste aparelho.\n\n'
                + 'Não é sincronização: o que estiver aqui e não estiver no backup se perde.\n\n'
                + 'Continuar?')) return;
      DB = migrar(Object.assign(defaultDB(), dados));
      /* Zera a foto: sem isso o próximo salvamento compararia o banco novo com
         a fotografia do banco antigo e carimbaria tudo como alteração de agora,
         atropelando o outro aparelho na sincronização seguinte. */
      try{ _foto = null; }catch(err){}
      salvarDB();
      toast('Backup restaurado.');
      desenhar();
    }catch(err){
      alert('Arquivo inválido: ' + err.message);
    }
  };
  leitor.readAsText(arq);
}
/* =========================================================
   LANÇAR
   Um lançamento é feito no formulário "Lançar em detalhe": tipo, valor, data,
   onde pagou, categoria, de quem. Ver a escolha na tela vale mais do que a
   pressa de digitar uma frase — sobretudo porque errar a categoria ou o cartão
   estraga o orçamento do mês inteiro, e em silêncio.
   ========================================================= */

/* ---------------------------------------------------------
   GRAVAR
   --------------------------------------------------------- */

/* Preenche mesFatura e mesComp de um lançamento a partir do alvo.
   É AQUI que a regra 3 do CLAUDE.md acontece: crédito compete no mês da fatura,
   o resto no mês da data. */
function carimbarCompetencia(l){
  if(alvoEhCartao(l.alvo)){
    /* Se o mês da fatura já veio pronto, respeita. É o caso das parcelas: a
       data delas É o dia do vencimento da própria fatura, então recalcular a
       partir dessa data empurraria cada uma um ciclo para a frente. Uma compra
       em 6x apareceria de outubro a março em vez de setembro a fevereiro — e
       sem dar erro em tela nenhuma. */
    if(!l.mesFatura){
      const c = cartao(idDoAlvo(l.alvo));
      l.mesFatura = c ? faturaDaCompra(l.data, c.diaFechamento, c.diaVencimento) : mesDe(l.data);
    }
  } else {
    l.mesFatura = '';
  }
  l.mesComp = l.mesFatura || mesDe(l.data);
  return l;
}

function novoLancamento(dados){
  return carimbarCompetencia(Object.assign({
    id: uid(), data: hojeISO(), descricao: '', valor: 0, tipo: 'saida',
    pessoaId: '', categoriaId: '', alvo: '', mesFatura: '', mesComp: '',
    pago: true, nota: ''
  }, dados));
}

/**
 * Grava uma compra parcelada: UM lançamento por parcela, cada um na fatura do
 * seu mês. São registros separados de propósito — é o que faz a mesclagem
 * funcionar quando os dois lançam ao mesmo tempo (regra 5 do CLAUDE.md).
 *
 * `jaPagas` existe para compra que começou antes do app: cria só o que falta.
 */
function gravarParcelado(d){
  const c = cartao(d.cartaoId);
  if(!c) return;

  const valores = dividirParcelas(d.total, d.parcelas);
  const primeira = faturaDaCompra(d.data, c.diaFechamento, c.diaVencimento);
  const jaPagas = Math.max(0, Math.min(d.jaPagas || 0, d.parcelas - 1));

  const compraId = uid();
  DB.compras.push({
    id: compraId, cartaoId: c.id, categoriaId: d.categoriaId || '',
    descricao: d.descricao, total: d.total, parcelas: d.parcelas,
    jaPagas: jaPagas, dataCompra: d.data
  });

  for(let i = jaPagas; i < d.parcelas; i++){
    const mesFatura = mesMais(primeira, i);
    DB.lancamentos.push(novoLancamento({
      /* A parcela "acontece" no vencimento da fatura dela, não na data da
         compra — assim cai no mês certo de toda tela. */
      data: diaDoMes(mesFatura, c.diaVencimento),
      descricao: d.descricao + ' (' + (i+1) + '/' + d.parcelas + ')',
      valor: valores[i], tipo: 'saida',
      pessoaId: d.pessoaId || '', categoriaId: d.categoriaId || '',
      alvo: 'cartao:' + c.id, mesFatura: mesFatura, pago: false,
      compraId: compraId, parcelaN: i+1, parcelaDe: d.parcelas
    }));
  }
}

/**
 * Reescreve uma compra parcelada que JÁ EXISTE — para quando o número de
 * parcelas, o valor ou a data foram digitados errado.
 *
 * NÃO é apagar e criar de novo. As parcelas que continuam existindo mantêm o
 * MESMO id. Isso é o que importa para a sincronização: ela trabalha registro a
 * registro, e id novo chegaria no aparelho do outro como "apagou uma parcela e
 * criou outra" em vez de "corrigiu esta".
 *
 * O `pago` só sobrevive quando o mês da fatura NÃO mudou. Se a parcela 5 saiu
 * de agosto para setembro, ela não pode continuar marcada como paga — a fatura
 * de setembro ainda nem venceu. Guardar o `pago` pelo número da parcela, sem
 * olhar o mês, seria a forma silenciosa de sumir com uma dívida.
 */
function regravarParcelada(compraId, d){
  const compra = DB.compras.filter(function(c){ return c.id === compraId; })[0];
  if(!compra) return 0;
  const c = cartao(d.cartaoId);
  if(!c) return 0;

  /* Parcela JÁ PAGA — pela fatura ou adiantada — é história fechada: o dinheiro
     saiu de verdade. Refazê-la desfaria um pagamento que aconteceu, e reduzir o
     total de parcelas a apagaria junto com o registro do que já foi gasto.
     Ela fica congelada: nem sai da lista, nem é recriada. */
  function congelar(l){ return !!(l.adiantadoDe || l.pago); }

  const antigas = {}, congelada = {};
  DB.lancamentos.forEach(function(l){
    if(l.compraId !== compraId) return;
    if(congelar(l)) congelada[l.parcelaN] = true;
    else            antigas[l.parcelaN] = l;
  });
  DB.lancamentos = DB.lancamentos.filter(function(l){
    return l.compraId !== compraId || congelar(l);
  });

  const valores  = dividirParcelas(d.total, d.parcelas);
  const primeira = faturaDaCompra(d.data, c.diaFechamento, c.diaVencimento);
  const jaPagas  = Math.max(0, Math.min(d.jaPagas || 0, d.parcelas - 1));

  for(let i = jaPagas; i < d.parcelas; i++){
    if(congelada[i+1]) continue;          /* já foi paga, não se mexe */
    const mesFatura = mesMais(primeira, i);
    const velha = antigas[i+1];
    DB.lancamentos.push(novoLancamento({
      id: velha ? velha.id : uid(),
      data: diaDoMes(mesFatura, c.diaVencimento),
      descricao: d.descricao + ' (' + (i+1) + '/' + d.parcelas + ')',
      valor: valores[i], tipo: 'saida',
      pessoaId: d.pessoaId || '', categoriaId: d.categoriaId || '',
      alvo: 'cartao:' + c.id, mesFatura: mesFatura,
      pago: !!(velha && velha.pago && velha.mesFatura === mesFatura),
      compraId: compraId, parcelaN: i+1, parcelaDe: d.parcelas
    }));
  }

  compra.cartaoId    = c.id;
  compra.categoriaId = d.categoriaId || '';
  compra.descricao   = d.descricao;
  compra.total       = d.total;
  compra.parcelas    = d.parcelas;
  compra.jaPagas     = jaPagas;
  compra.dataCompra  = d.data;

  return d.parcelas - jaPagas;
}

/* Apagar uma parcela sozinha deixaria a compra pela metade e a dívida errada.
   Então apagar qualquer parcela apaga a compra inteira. */
function excluirLancamento(id){
  const l = DB.lancamentos.filter(function(x){ return x.id === id; })[0];
  if(!l) return;

  if(l.transferenciaId){
    const outra = DB.lancamentos.filter(function(x){
      return x.transferenciaId === l.transferenciaId && x.id !== l.id;
    })[0];
    if(!confirm('Excluir esta transferência?\n\n'
              + 'Os dois lados somem juntos — o que saiu e o que entrou.')) return;
    DB.lancamentos = DB.lancamentos.filter(function(x){
      return x.transferenciaId !== l.transferenciaId;
    });
    salvarDB(); desenhar();
    toast('Transferência excluída.');
    return;
  }

  /* Apagar o pagamento sem desfazer a quitação deixaria as compras marcadas
     como pagas e a dívida sumida da tela — dinheiro devido que não aparece. */
  if(l.faturaCartaoId){
    if(!confirm('Excluir o pagamento da fatura de ' + nomeMes(l.faturaMes) + '?\n\n'
              + 'A fatura volta a contar o que ficar faltando.')) return;

    const cid = l.faturaCartaoId, fm = l.faturaMes;
    DB.lancamentos = DB.lancamentos.filter(function(x){ return x.id !== id; });

    /* Pode haver outro pagamento parcial que ainda cubra tudo. */
    if(pagoDaFatura(cid, fm) < faturaDoMes(cid, fm)){
      DB.lancamentos.forEach(function(x){
        if(x.alvo === 'cartao:' + cid && x.mesFatura === fm) x.pago = false;
      });
    }
    salvarDB(); desenhar();
    toast('Pagamento excluído.');
    return;
  }

  if(l.compraId){
    const compra = DB.compras.filter(function(c){ return c.id === l.compraId; })[0];
    const quantas = DB.lancamentos.filter(function(x){ return x.compraId === l.compraId; }).length;
    if(!confirm('Este lançamento é uma parcela de "' + (compra ? compra.descricao : l.descricao) + '".\n\n'
              + 'Excluir vai apagar as ' + quantas + ' parcelas que ainda existem.\n\nContinuar?')) return;
    DB.lancamentos = DB.lancamentos.filter(function(x){ return x.compraId !== l.compraId; });
    DB.compras     = DB.compras.filter(function(c){ return c.id !== l.compraId; });
  } else {
    if(!confirm('Excluir "' + l.descricao + '"?')) return;
    DB.lancamentos = DB.lancamentos.filter(function(x){ return x.id !== id; });
  }

  salvarDB();
  desenhar();
  toast('Excluído.');
}

function alternarPago(id){
  const l = DB.lancamentos.filter(function(x){ return x.id === id; })[0];
  if(!l) return;
  l.pago = !l.pago;
  salvarDB();
  desenhar();
}

function barraRapida(){
