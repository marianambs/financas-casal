<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Finanças</title>

<!-- iPhone e iPad: adicionado à Tela de Início, o app sai do Safari e fica ISENTO
     da regra que apaga o armazenamento após 7 dias sem uso. Sem esta meta, os
     lançamentos somem do aparelho. Não remover. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4f46e5">

<style>
/* =========================================================
   SISTEMA VISUAL
   Toda cor é variável — o modo escuro é uma troca de valores, não uma
   reescrita. Corpo em 16px porque o app é usado no iPad, e 14px obriga a
   aproximar o rosto. Todo alvo clicável tem 44px de altura (--tap), que é o
   mínimo confortável para o dedo.
   ========================================================= */
:root{
  --bg:#f4f6fb; --sup:#ffffff; --sup2:#eef1f7; --sup3:#e5e9f2;
  --borda:#dfe4ee; --borda2:#c6cede;
  --txt:#111827; --mut:#5b6678; --fra:#98a2b3;

  --ac:#4f46e5; --ac2:#7c3aed; --ac-fr:#eceafe;
  --pos:#0e9f6e; --pos-fr:#e7f7f1;
  --neg:#e02424; --neg-fr:#fdecec;
  --ala:#c27803; --ala-fr:#fdf6e3;
  --inv:#0694a2; --inv-fr:#e0f5f7;

  --som:0 2px 4px rgba(17,24,39,.04), 0 8px 24px rgba(17,24,39,.06);
  --r:20px; --r2:14px;
  --tap:44px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#080b12; --sup:#111725; --sup2:#1a2233; --sup3:#232c40;
  --borda:#232c40; --borda2:#36415c;
  --txt:#eaeef6; --mut:#9aa6ba; --fra:#6b7689;

  --ac:#7c74ff; --ac2:#a78bfa; --ac-fr:#1e1b45;
  --pos:#34d399; --pos-fr:#06291f;
  --neg:#f87171; --neg-fr:#331013;
  --ala:#fbbf24; --ala-fr:#332608;
  --inv:#22d3ee; --inv-fr:#062b31;

  --som:0 2px 4px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
}}

*{box-sizing:border-box;margin:0;padding:0;border-color:var(--borda);}
html{-webkit-text-size-adjust:100%;}
html,body{max-width:100%;overflow-x:hidden;}
body{
  background:var(--bg); color:var(--txt);
  font:400 16px/1.55 ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--borda2);border-radius:6px;}

/* Dinheiro usa largura de dígito fixa. Sem isso a coluna de valores fica
   serrilhada, porque o "1" é mais estreito que o "8". */
.tab{font-variant-numeric:tabular-nums;font-feature-settings:'tnum';}

/* ---------------------------------------------------------- LAYOUT */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:248px;flex-shrink:0;background:var(--sup);
  border-right:1px solid var(--borda);
  display:flex;flex-direction:column;
}
#sidebar .marca{
  display:flex;align-items:center;gap:10px;padding:18px 16px;
  border-bottom:1px solid var(--borda);font-size:17px;font-weight:650;
  letter-spacing:-.02em;
}
#sidebar .marca em{font-style:normal;color:var(--ac);}
#sidebar nav{flex:1;overflow-y:auto;padding:10px 12px;}
.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:none;color:var(--mut);
  min-height:var(--tap);padding:0 14px;border-radius:12px;
  font:500 15px inherit;font-family:inherit;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.navbtn+.navbtn{margin-top:3px;}
.navbtn:hover{background:var(--sup2);color:var(--txt);}
.navbtn.ativo{background:var(--ac-fr);color:var(--ac);font-weight:650;}
.navbtn .ico{width:20px;height:20px;flex-shrink:0;opacity:.8;}
.navbtn.ativo .ico{opacity:1;}
.navbtn .rot{min-width:0;overflow:hidden;text-overflow:ellipsis;}
#sidebar .pe{padding:12px;border-top:1px solid var(--borda);font-size:12px;color:var(--fra);}
/* Quem está lançando agora. É botão, não rótulo: no celular do casal um pega o
   aparelho do outro o tempo todo, e trocar precisa ser um toque. */
#quemSou{
  display:flex;align-items:center;gap:9px;width:100%;
  min-height:var(--tap);padding:0 12px;
  background:var(--sup2);border:1px solid var(--borda);border-radius:12px;
  font:600 14px inherit;font-family:inherit;color:var(--txt);cursor:pointer;
  text-align:left;-webkit-tap-highlight-color:transparent;
}
#quemSou:hover{border-color:var(--ac);}
#quemSou .rot{font-size:10px;font-weight:400;color:var(--fra);display:block;line-height:1;}
#quemSou .seta{margin-left:auto;color:var(--fra);font-size:11px;}
#versaoApp{margin-top:8px;padding-left:2px;}

#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  background:var(--sup);border-bottom:1px solid var(--borda);
  padding:14px 24px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:5;
}
#topbar h1{font-size:19px;font-weight:650;letter-spacing:-.02em;}
#topbar .sub{font-size:12.5px;color:var(--mut);margin-top:1px;}
#topbar .tit{min-width:0;flex:1;}
#content{padding:24px 26px 56px;flex:1;min-width:0;}

/* botões da gaveta: escondidos no computador, onde a lateral é fixa */
#btnMenu,#btnFecharGaveta,#gavetaFundo{display:none;}

/* ---------------------------------------------------------- COMPONENTES */
.card{
  background:var(--sup);border:1px solid var(--borda);
  border-radius:var(--r);box-shadow:var(--som);
  padding:22px;margin-bottom:20px;
}
.card h2{
  font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--fra);margin-bottom:14px;
}
.card h2 .aux{float:right;text-transform:none;letter-spacing:0;font-weight:600;
              font-size:13px;color:var(--ac);cursor:pointer;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:var(--tap);padding:0 18px;border-radius:12px;border:1px solid transparent;
  font:650 15px inherit;font-family:inherit;cursor:pointer;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;transition:filter .12s,background .12s;
}
.btn-1{background:var(--ac);color:#fff;}
.btn-1:hover{filter:brightness(1.08);}
.btn-2{background:transparent;color:var(--mut);border-color:var(--borda2);}
.btn-2:hover{background:var(--sup2);color:var(--txt);}
.btn-x{background:transparent;color:var(--neg);}
.btn-x:hover{background:var(--neg-fr);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
/* botão de linha de lista — menor, mas ainda alcançável pelo dedo */
.btn-p{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px;}

label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:5px;}
input,select,textarea{
  width:100%;min-height:var(--tap);
  background:var(--sup);border:1px solid var(--borda2);border-radius:12px;
  padding:9px 14px;color:var(--txt);
  /* 16px não é escolha estética: abaixo disso o Safari do iPad dá zoom ao focar */
  font:400 16px inherit;font-family:inherit;
}
textarea{min-height:80px;line-height:1.5;}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--ac);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--ac) 18%, transparent);
}
input::placeholder{color:var(--fra);}
.campo{margin-bottom:14px;}

.chip{
  display:inline-flex;align-items:center;gap:5px;border-radius:999px;
  padding:5px 11px;font-size:13px;font-weight:600;
  background:var(--sup2);color:var(--mut);
}
.chip-ac{background:var(--ac-fr);color:var(--ac);}
.chip-pos{background:var(--pos-fr);color:var(--pos);}
.chip-neg{background:var(--neg-fr);color:var(--neg);}
.chip-ala{background:var(--ala-fr);color:var(--ala);}

/* quadradinho colorido com o emoji da categoria */
.ic-t{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  font-size:18px;flex:none;line-height:1;
}
.av{
  width:30px;height:30px;border-radius:999px;display:grid;place-items:center;
  font-size:15px;flex:none;line-height:1;
}

.trilho{height:10px;border-radius:999px;background:var(--sup2);overflow:hidden;}
.trilho>div{height:100%;border-radius:999px;transition:width .4s;}
.trilho-p{height:7px;}

/* números */
.n-g{font-size:clamp(38px,7vw,58px);font-weight:700;letter-spacing:-.03em;line-height:1.05;}
.n-m{font-size:32px;font-weight:700;letter-spacing:-.025em;line-height:1.1;}
.n-s{font-size:24px;font-weight:650;letter-spacing:-.02em;line-height:1.2;}

.lin{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.mut{color:var(--mut);} .fra{color:var(--fra);}
.pos{color:var(--pos);} .neg{color:var(--neg);} .inv{color:var(--inv);}
.p{font-size:13px;} .pp{font-size:12px;}
.ajuda{font-size:12.5px;color:var(--fra);line-height:1.6;margin-top:6px;}

.grade{display:grid;gap:18px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr);}}
/* Item de grid nasce com min-width:auto, e um número comprido
   ("R$ 1.234.567,89") empurra a coluna além do 1fr, alargando a linha inteira. */
.grade>*{min-width:0;}

/* cartão de destaque do painel: onde mora o saldo */
.heroi{
  border-radius:var(--r);padding:28px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#9333ea 100%);
  box-shadow:0 10px 30px rgba(79,70,229,.28);margin-bottom:20px;
}
/* brilho difuso; sem ele o gradiente fica chapado em tela grande */
.heroi::after{
  content:'';position:absolute;inset:auto -20% -60% auto;width:70%;aspect-ratio:1;
  background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%);
  pointer-events:none;
}
.heroi .rot{font-size:14px;font-weight:500;opacity:.85;}
.heroi .sub{margin-top:10px;font-size:14px;opacity:.9;max-width:46ch;}
.bolso{
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);
  border-radius:12px;padding:9px 13px;backdrop-filter:blur(4px);
}
.bolsos{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;position:relative;}

/* faixas de aviso no topo do conteúdo */
.faixa{padding:11px 26px;font-size:13px;font-weight:600;line-height:1.55;
       border-bottom:1px solid var(--borda);}
.faixa-erro{background:var(--neg-fr);color:var(--neg);border-bottom-color:var(--neg);}
.faixa-ala{background:var(--ala-fr);color:var(--ala);border-bottom-color:var(--ala);}

.aviso{
  display:flex;gap:14px;align-items:flex-start;padding:18px 20px;
  border-radius:var(--r);border:1px solid var(--neg);background:var(--neg-fr);
  margin-bottom:20px;
}
.aviso.ala{border-color:var(--ala);background:var(--ala-fr);}
.aviso .ic{font-size:22px;line-height:1;flex:none;}

table{width:100%;border-collapse:collapse;font-size:15px;}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;
   padding:12px 16px;border-bottom:1px solid var(--borda);white-space:nowrap;}
td{padding:13px 16px;border-bottom:1px solid var(--borda);}
tr:last-child td{border-bottom:none;}
.dir{text-align:right;}
.rolar{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.vazio{padding:30px;text-align:center;color:var(--fra);font-size:14px;}

.modal-bg{position:fixed;inset:0;background:rgba(10,12,18,.55);z-index:100;
          display:flex;align-items:flex-start;justify-content:center;
          overflow-y:auto;padding:28px 14px;}
.modal{background:var(--sup);border-radius:var(--r);max-width:640px;width:100%;
       padding:24px;margin-bottom:30px;}
.modal.largo{max-width:900px;}
.modal h2{font-size:18px;font-weight:650;margin-bottom:16px;text-transform:none;
          letter-spacing:0;color:var(--txt);}
.modal-acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;
             border-top:1px solid var(--borda);padding-top:16px;}

.toast{position:fixed;bottom:22px;right:22px;background:var(--txt);color:var(--bg);
       padding:13px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;
       box-shadow:0 8px 24px rgba(0,0,0,.25);}
@media(max-width:760px){.toast{left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));}}

/* faixa de estado da sincronização — aparece em todas as telas */
.sync-ind{display:flex;align-items:center;gap:10px;padding:10px 26px;
          font-size:13px;font-weight:600;border-bottom:1px solid var(--borda);}
.sync-ind .pt{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.sync-ind button{margin-left:auto;}
.sync-ind.pendente{background:var(--ala-fr);color:var(--ala);border-bottom-color:var(--ala);}
.sync-ind.pendente .pt{background:var(--ala);box-shadow:0 0 0 3px color-mix(in srgb,var(--ala) 25%,transparent);}
.sync-ind.ok{background:var(--pos-fr);color:var(--pos);border-bottom-color:var(--pos);}
.sync-ind.ok .pt{background:var(--pos);}
.sync-ind.neutro{background:var(--ac-fr);color:var(--ac);border-bottom-color:var(--ac);}
.sync-ind.neutro .pt{background:var(--ac);}

/* =========================================================
   CELULAR E TABLET
   Três problemas resolvidos aqui, todos herdados do RH:
   1. logo e título passavam POR BAIXO do relógio do iPhone -> safe-area
   2. as abas rolavam de lado e escondiam páginas -> gaveta
   3. a página rolava de lado atrás de botão -> tabela vira ficha
   ========================================================= */
@media(max-width:900px){
  #app{flex-direction:column;}

  /* cabeçalho escuro de propósito: no iPhone o relógio e a bateria são
     desenhados em BRANCO por cima da página. Sobre barra clara eles somem. */
  #topbar{
    background:var(--ac);border-bottom:none;padding:10px 14px;
    padding-top:calc(10px + env(safe-area-inset-top));
    padding-left:calc(14px + env(safe-area-inset-left));
    padding-right:calc(14px + env(safe-area-inset-right));
  }
  #topbar h1{color:#fff;font-size:17px;}
  #topbar .sub{color:rgba(255,255,255,.8);font-size:12px;}
  #topbar h1,#topbar .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  #btnMenu{
    display:flex;align-items:center;justify-content:center;
    width:40px;height:40px;flex-shrink:0;
    background:rgba(255,255,255,.18);border:none;border-radius:11px;color:#fff;
    cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;
  }
  #btnMenu svg{width:22px;height:22px;}

  /* a barra lateral vira gaveta */
  #sidebar{
    position:fixed;top:0;left:0;bottom:0;z-index:120;
    width:84%;max-width:320px;
    transform:translateX(-102%);transition:transform .22s ease-out;
    box-shadow:2px 0 22px rgba(0,0,0,.34);border-right:none;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
  }
  #app.gaveta-aberta #sidebar{transform:translateX(0);}
  #gavetaFundo{
    display:block;position:fixed;inset:0;z-index:110;background:rgba(8,11,18,.5);
    opacity:0;pointer-events:none;transition:opacity .22s ease-out;
  }
  #app.gaveta-aberta #gavetaFundo{opacity:1;pointer-events:auto;}

  #sidebar .marca{position:relative;}
  #btnFecharGaveta{
    display:flex;align-items:center;justify-content:center;
    position:absolute;top:14px;right:12px;width:36px;height:36px;
    background:none;border:none;color:var(--fra);cursor:pointer;padding:0;
    -webkit-tap-highlight-color:transparent;
  }
  #btnFecharGaveta svg{width:20px;height:20px;}
  #sidebar nav{display:block;overflow-y:auto;overflow-x:hidden;
               -webkit-overflow-scrolling:touch;}
  .navbtn{padding:0 16px;font-size:15.5px;}

  #content{padding:18px 16px 44px;
           padding-left:calc(16px + env(safe-area-inset-left));
           padding-right:calc(16px + env(safe-area-inset-right));
           padding-bottom:calc(44px + env(safe-area-inset-bottom));}
  .sync-ind,.faixa{padding-left:calc(16px + env(safe-area-inset-left));
                   padding-right:calc(16px + env(safe-area-inset-right));}
  .card{padding:18px;border-radius:var(--r2);}
  .heroi{padding:22px;border-radius:var(--r2);}
}

/* =========================================================
   TABELA VIRA FICHA
   Cada LINHA vira um cartão empilhado, com o nome da coluna ao lado do valor.
   O rótulo vem do data-rotulo, que o 09c_ui_mobile.js coloca sozinho lendo o
   <th> da própria tabela — vale para toda tela sem mexer em nenhuma delas.
   ========================================================= */
@media(max-width:900px){
  table.empilha,table.empilha tbody,table.empilha tr,table.empilha td{
    display:block;width:100%;
  }
  table.empilha thead{
    position:absolute;width:1px;height:1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;   /* some da vista, fica para o leitor de tela */
  }
  table.empilha tr{
    border:1px solid var(--borda);border-radius:var(--r2);
    padding:4px 0;margin-bottom:10px;background:var(--sup);
  }
  table.empilha td{
    display:flex;align-items:flex-start;gap:12px;
    padding:8px 14px;border-bottom:1px solid var(--sup2);text-align:left;
  }
  table.empilha tr td:last-child{border-bottom:none;}
  table.empilha td::before{
    content:attr(data-rotulo);flex:0 0 38%;max-width:38%;
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    color:var(--fra);padding-top:2px;
  }
  table.empilha td[data-rotulo='']::before,
  table.empilha td:not([data-rotulo])::before{display:none;}
  table.empilha td:first-child{
    font-weight:700;font-size:15px;background:var(--sup2);
    border-radius:var(--r2) var(--r2) 0 0;padding:11px 14px;
  }
  table.empilha td:first-child::before{display:none;}

  /* a que não empilha rola dentro da caixa, com aviso de que dá para arrastar */
  .rolar{position:relative;}
  .rolar.rolavel::after{
    content:'arraste de lado para ver o resto →';
    display:block;font-size:11px;color:var(--fra);padding:6px 2px 0;text-align:right;
  }
}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important;}
}
</style>
</head>
<body>
<div id="app">
  <!-- Fundo escurecido atrás da gaveta. Só existe no celular. -->
  <div id="gavetaFundo" onclick="fecharGaveta()"></div>

  <div id="sidebar">
    <div class="marca">
      Finanças <em>Casal</em>
      <button id="btnFecharGaveta" onclick="fecharGaveta()" aria-label="Fechar menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <nav id="navMenu"></nav>
    <div class="pe">
      <button id="quemSou" onclick="trocarPessoa()"></button>
      <div id="versaoApp"></div>
    </div>
  </div>

  <div id="main">
    <div id="topbar">
      <!-- Botão da gaveta. Só aparece no celular; no computador a barra lateral
           fica sempre visível e o CSS esconde este botão. -->
      <button id="btnMenu" onclick="abrirGaveta()" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="tit">
        <h1 id="tituloPagina">Painel</h1>
        <div class="sub" id="subPagina">A visão do mês</div>
      </div>
    </div>
    <div id="syncIndicador" class="sync-ind neutro"></div>
    <div id="content"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* Os dois ícones vão embutidos como data URI, e o build.sh os injeta a partir de
   fonte/logo.txt e fonte/logo-ios.txt. É o que mantém a promessa do arquivo
   único: nada de buscar imagem na rede, e funciona igual aberto por duplo
   clique ou publicado.

   São dois porque o iOS trata o ícone dele de um jeito próprio: arredonda
   sozinho e compõe o que for transparente sobre PRETO. Um PNG já arredondado
   com fundo transparente vira recorte duplo com moldura escura. Por isso o do

const VERSAO = '2026-08-30 17:33';
/* =========================================================
   FINANÇAS CASAL — offline, dados no localStorage
   Mayky e Mari. Ver CLAUDE.md para as regras de negócio.
   ========================================================= */

const DB_KEY  = 'financasCasal_v1';

               'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

                     'jul','ago','set','out','nov','dez'];

/* ---------------------------------------------------------

   --------------------------------------------------------- */
function defaultDB(){
  return {
    /* Ninguém vem cadastrado. O app serve para um casal, para uma pessoa só ou
       para mais gente da casa — quem usa se cadastra no primeiro uso.
       Dois motivos para não embutir nome nenhum aqui:
         - o repositório é público, e nome de pessoa no fonte fica publicado;
         - o app precisa servir para qualquer um que o instalar.
       O PIN também nasce vazio, e cada pessoa cria o dela no primeiro uso
       (ver 08b_acesso.js). */
    pessoas: [],   // {id, nome, emoji, cor, pinHash, pinSal}

    contas:     [],   // {id, nome, tipo, donoId, saldoInicial, cor}
    cartoes:    [],   // {id, nome, donoId, limite, diaFechamento, diaVencimento, cor}
    categorias: categoriasSugeridas(),
    lancamentos:[],   // o coração — ver formaLancamento() logo abaixo
    compras:    [],   // {id, cartaoId, categoriaId, descricao, total, parcelas, dataCompra}
    recorrentes:[],   // {id, descricao, valor, tipo, dia, pessoaId, categoriaId, alvo, inicio, fim, ativo}
    metas:      [],   // {id, nome, tipo, alvo, prazo, pessoaId, cor}

    config: {

/* Forma de um lançamento. Não é usada em runtime — está aqui para quem abrir o
   arquivo daqui a três meses saber o que cada campo significa.

   {
     id, _ts, _dev,
     data:        'AAAA-MM-DD'  quando aconteceu
     descricao:   'Mercado semanal'
     valor:       12345          SEMPRE em centavos, SEMPRE positivo
     tipo:        'saida' | 'entrada' | 'transf' | 'transf_entra'
     pessoaId:    'p_mari' | ''  vazio = do casal
     categoriaId: 'c_mercado' | ''
     alvo:        'conta:x' | 'cartao:y'
     mesFatura:   'AAAA-MM'      só para cartão; em qual fatura caiu
     mesComp:     'AAAA-MM'      MÊS DE COMPETÊNCIA — ver regra 3 do CLAUDE.md
     pago:        true | false   false = previsto, ainda não saiu
     compraId, parcelaN, parcelaDe    quando faz parte de um parcelamento
     recorrenteId                     quando veio de uma conta fixa
     nota

/* Sugestões iniciais. Vieram das planilhas do casal, com duas correções:
   - saíram "Outros Gastos Mari/Maycon" — pessoa é campo próprio (regra 2)
   - saíram "Cartão Nubank/C6" — pagar fatura é transferência (regra 6) */
function categoriasSugeridas(){
  const c = (id,nome,tipo,grupo,icone,cor)=>({id,nome,tipo,grupo,icone,cor});
  return [
    c('c_salario',  'Salário',        'entrada','receita',     '💰','#0e9f6e'),
    c('c_estagio',  'Estágio',        'entrada','receita',     '🎓','#14b8a6'),
    c('c_extra',    'Extra e freela', 'entrada','receita',     '💼','#06b6d4'),
    c('c_rendim',   'Rendimentos',    'entrada','receita',     '📈','#0ea5e9'),

    c('c_moradia',  'Moradia',        'saida','essencial',     '🏠','#6366f1'),
    c('c_luz',      'Conta de luz',   'saida','essencial',     '💡','#eab308'),

/* Completa o que faltar num banco vindo de versão anterior ou de outro aparelho.
   Nunca apaga o que já existe — só preenche buraco. */
function migrar(db){
  const base = defaultDB();
  ['contas','cartoes','categorias','lancamentos','compras',
   'recorrentes','metas','aportes','pessoas'].forEach(k=>{
    db[k] = db[k] || base[k];
  });
  db.orcamentos = db.orcamentos || {};
  db.config = Object.assign({}, base.config, db.config||{});
  db._meta  = Object.assign({}, base._meta,  db._meta||{});
  db._meta.tombstones = db._meta.tombstones || {};
  db._meta.mapaTs     = db._meta.mapaTs     || {};
  db._meta.objetoTs   = db._meta.objetoTs   || {};
  db._meta.base       = db._meta.base       || {};
  db._meta.conflitos  = db._meta.conflitos  || [];

  /* Lançamento antigo sem mês de competência: calcula agora. Sem isso ele
     sumiria de todas as telas de mês, que é como o campo é consultado. */
  db.lancamentos.forEach(l=>{
    if(!l.mesComp) l.mesComp = l.mesFatura || (l.data||'').slice(0,7);
  });
  return db;
}

let DB = carregarDB();

function carregarDB(){
  try{
    const cru = localStorage.getItem(DB_KEY);

    return migrar(Object.assign(defaultDB(), JSON.parse(cru)));
  }catch(e){
    console.error('Falha ao carregar; começando banco novo.', e);
    return defaultDB();
  }
}

/* 123456 -> "R$ 1.234,56" */
function fmt(centavos){
  return ((Number(centavos)||0) / 100)
    .toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
/* 123456 -> "R$ 1.235" — para rótulo de gráfico, onde espaço é curto */
function fmtCurto(centavos){
  return 'R$ ' + Math.round((Number(centavos)||0)/100).toLocaleString('pt-BR');
}

function fmtSimples(centavos){

}

   É esta função que as telas usam, nunca a fmt() direto. */
function $(centavos){

}

/**
 * Converte o que a pessoa digitou em centavos.
 * Aceita os dois formatos que um brasileiro usa: "1.234,56" e "1234.56".
 * Devolve null quando não dá para interpretar.
 */
function lerDinheiro(texto){
  const cru = String(texto==null?'':texto).trim().replace(/[R$\s]/gi,'');
  if(!cru) return null;

  const temVirgula = cru.indexOf(',') >= 0;
  const temPonto   = cru.indexOf('.') >= 0;
  let n;

  if(temVirgula && temPonto){
    /* "1.234,56" — ponto é milhar, vírgula é decimal */
    n = cru.replace(/\./g,'').replace(',','.');
  } else if(temVirgula){
    n = cru.replace(',','.');
  } else if(temPonto){
    /* Ambíguo: "1.234" pode ser mil-duzentos ou um-e-pouco.
       Se depois do último ponto sobram 3 dígitos, é separador de milhar. */
    const p = cru.split('.');
    n = (p[p.length-1].length === 3 && p.length >= 2) ? p.join('') : cru;
  } else {
    n = cru;
  }

  const v = Number(n);
  if(!isFinite(v)) return null;
  return Math.round(v * 100);
}

/** Divide um total em N parcelas sem perder centavo: a sobra vai na primeira. */
function dividirParcelas(total, n){
  total = Number(total)||0;
  n = Math.max(1, Math.floor(n)||1);
  const base = Math.floor(total / n);
  const sobra = total - base * n;
  const r = [];
  for(let i=0;i<n;i++) r.push(i===0 ? base + sobra : base);
  return r;
}

/* ---------------------------------------------------------
   DATAS
   Chave de mês é "AAAA-MM": ordena como texto igual à cronologia e não sofre
   com fuso horário, que é a origem clássica do "lançamento caiu no mês errado".
   --------------------------------------------------------- */
function hojeISO(){
  const d = new Date();
  return d.getFullYear() + '-'
       + String(d.getMonth()+1).padStart(2,'0') + '-'
       + String(d.getDate()).padStart(2,'0');
}
function mesAtual(){ return hojeISO().slice(0,7); }
function mesDe(iso){ return (iso||'').slice(0,7); }

/** "2026-08" + 5 -> "2027-01" (aceita negativo) */
function mesMais(ym, n){
  let [y,m] = ym.split('-').map(Number);
  const t = y*12 + (m-1) + n;
  return Math.floor(t/12) + '-' + String((t%12)+1).padStart(2,'0');
}
/** ("2026-08","2027-02") -> 6 */
function mesesEntre(de, ate){
  const [ay,am] = de.split('-').map(Number);
  const [by,bm] = ate.split('-').map(Number);
  return (by*12+bm) - (ay*12+am);
}
/** "2026-08" -> "Agosto de 2026" */
function nomeMes(ym){
  const [y,m] = ym.split('-').map(Number);
  return MESES[m-1] + ' de ' + y;
}
/** "2026-08" -> "ago/26" */
function nomeMesCurto(ym){
  const [y,m] = ym.split('-').map(Number);
  return MESES_CURTO[m-1] + '/' + String(y).slice(2);
}
function diasNoMes(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
/** Encaixa um dia que pode não existir: vencimento 31 em fevereiro vira 28. */
function diaDoMes(ym, dia){
  const ult = diasNoMes(ym);
  return ym + '-' + String(Math.min(Math.max(dia,1), ult)).padStart(2,'0');
}
/** "2026-08-26" -> "26 de ago" */
function fmtDiaMes(iso){
  if(!iso) return '—';
  const [,m,d] = iso.split('-');
  return Number(d) + ' de ' + MESES_CURTO[Number(m)-1];
}
/** "2026-08-26" -> "26/08/2026" */
function fmtData(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return d + '/' + m + '/' + y;
}
function somarDias(iso, n){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d + n);
  return dt.getFullYear() + '-'
       + String(dt.getMonth()+1).padStart(2,'0') + '-'
       + String(dt.getDate()).padStart(2,'0');
}

/* ---------------------------------------------------------
   FATURA — regra 4 do CLAUDE.md
   --------------------------------------------------------- */

/**
 * Em qual fatura uma compra cai.
 *
 * A fatura fecha no dia `fechamento`. Compra DEPOIS disso já entra no ciclo
 * seguinte. A fatura é identificada pelo mês do VENCIMENTO, que é como o banco
 * fala — "a fatura de maio" é a que vence em maio.
 *
 * Cartão que fecha 28 e vence 5:
 *   compra 20/abr -> fecha 28/abr -> vence 5/mai -> "2026-05"
 *   compra 29/abr -> fecha 28/mai -> vence 5/jun -> "2026-06"
 */
function faturaDaCompra(iso, fechamento, vencimento){
  const [y,m,d] = iso.split('-').map(Number);
  let ano = y, mes = m - 1;                       // mes 0-11 para facilitar a conta

  if(d > fechamento) mes += 1;                    // passou do fechamento
  if(vencimento <= fechamento) mes += 1;          // vence no mês seguinte ao fechamento

  ano += Math.floor(mes/12);
  mes = ((mes % 12) + 12) % 12;
  return ano + '-' + String(mes+1).padStart(2,'0');
}

/** Data em que a fatura de um mês vence de verdade. */
function vencimentoDaFatura(ym, diaVencimento){
  return diaDoMes(ym, diaVencimento);
}

/**
 * MÊS DE COMPETÊNCIA — regra 3, a mais importante do app.
 * O gasto pertence ao mês em que o dinheiro SAI, não ao mês da compra.
 *   débito/dinheiro/pix -> mês da data
 *   crédito             -> mês da fatura
 */
function competencia(lanc){
  if(lanc.mesFatura) return lanc.mesFatura;
  return mesDe(lanc.data);
}

function exportarBackup(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'financas-casal-backup-' + hojeISO() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup exportado. Guarde numa subpasta do Drive.');
}

function importarBackup(evt){
  const arq = evt.target.files[0];
  evt.target.value = '';
  if(!arq) return;

  const leitor = new FileReader();
  leitor.onload = function(e){
    try{
      const dados = JSON.parse(e.target.result);
      if(!confirm('Restaurar este backup vai SUBSTITUIR tudo que está neste aparelho.\n\n'
                + 'Não é sincronização: o que estiver aqui e não estiver no backup se perde.\n\n'
                + 'Continuar?')) return;
      DB = migrar(Object.assign(defaultDB(), dados));
      /* Zera a foto: sem isso o próximo salvamento compararia o banco novo com
         a fotografia do banco antigo e carimbaria tudo como alteração de agora,
         atropelando o outro aparelho na sincronização seguinte. */
      try{ _foto = null; }catch(err){}
      salvarDB();
      toast('Backup restaurado.');
      desenhar();
    }catch(err){
      alert('Arquivo inválido: ' + err.message);
    }
  };
  leitor.readAsText(arq);
}

/* ---------------------------------------------------------
   INTERPRETADOR DE FRASE

   "mercado 250,90 nubank 3x"  -> saída, R$ 250,90, cartão Nubank, 3 parcelas
   "uber 32 ontem"             -> saída, R$ 32,00, Transporte, data de ontem

   "aluguel 1800 dia 05"       -> no dia 5 deste mês (o 05 não vira valor)

   Trabalha por TOKENS: cada etapa consome as palavras que reconheceu, e o que
   sobra no fim é a descrição — remontada com o acento e a maiúscula originais.
   --------------------------------------------------------- */

const DICAS_ENTRADA = ['salario','recebi','receita','freela','freelance','rendimento',

   dita pelo nome. A lista é curta de propósito: chute demais irrita mais do que
   ajuda, porque a pessoa tem que conferir tudo. */
const DICAS_CATEGORIA = [
  [['mercado','supermercado','atacadao','feira'], 'Mercado'],
  [['hortifruti','verdura','fruta','sacolao'], 'Hortifruti'],
  [['padaria','pao'], 'Padaria'],
  [['ifood','lanche','almoco','janta','jantar','pizza','hamburguer','cafe','bar','sorvete','acai','delivery','restaurante'], 'Lanches'],
  [['uber','taxi','onibus','metro','gasolina','combustivel','estacionamento','pedagio','oficina','moto','carro'], 'Transporte'],
  [['aluguel','condominio','iptu','internet','wifi','agua','gas','faxina'], 'Moradia'],
  [['luz','energia','cemig','enel','light'], 'Conta de luz'],
  [['farmacia','remedio','medico','dentista','exame','consulta','psicologo','vet','veterinario'], 'Saúde'],
  [['racao','areia','gato','gatos','petshop'], 'Comida dos gatos'],
  [['academia','crossfit','personal'], 'Academia'],
  [['netflix','spotify','disney','prime','hbo','assinatura'], 'Assinaturas'],
  [['cinema','show','viagem','praia','cerveja','festa','jogo','steam'], 'Lazer'],
  [['roupa','sapato','tenis','shopping','presente','amazon','shopee'], 'Compras'],
  [['celular','recarga','vivo','claro','tim'], 'Plano do celular'],
  [['salario'], 'Salário'],
  [['estagio'], 'Estágio']
];

const DIAS_PALAVRA = {hoje:0, ontem:-1, anteontem:-2, amanha:1};

/* Remove acento e baixa a caixa: "Alimentação" -> "alimentacao". */
function semAcento(txt){
  return String(txt||'')
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .toLowerCase();
}

/* Acha o nome de uma conta/cartão/categoria/pessoa nos tokens livres.
   Testa janelas de várias palavras, porque nome tem espaço ("conta corrente"),
   e prefere sempre a correspondência MAIS LONGA. */
function consumirNome(itens, tokens, campoNome){
  campoNome = campoNome || 'nome';
  let melhor = null;

  itens.forEach(function(item){
    const alvo = semAcento(item[campoNome]);
    if(alvo.length < 2) return;
    const partes = alvo.split(/\s+/).filter(Boolean);

    for(let i=0; i + partes.length <= tokens.length; i++){
      let bate = true;
      for(let k=0; k<partes.length; k++){
        const t = tokens[i+k];
        if(t.usado || t.norm !== partes[k]){ bate = false; break; }
      }
      if(bate && (!melhor || partes.length > melhor.n)){
        melhor = {item: item, i: i, n: partes.length};
      }
    }
  });

  if(!melhor) return null;
  for(let k=0;k<melhor.n;k++) tokens[melhor.i+k].usado = true;
  return melhor.item;
}

function interpretar(texto, hoje){
  hoje = hoje || hojeISO();
  const cru = String(texto||'').trim();
  const forcaEntrada = cru.charAt(0) === '+';

  const tokens = (forcaEntrada ? cru.slice(1) : cru)
    .split(/\s+/).filter(Boolean)
    .map(function(p){ return {bruto:p, norm:semAcento(p), usado:false}; });

  const livres = function(){ return tokens.filter(function(t){ return !t.usado; }); };

  const r = {
    descricao:'', valor:null, tipo:'saida', data:hoje,
    alvo:'', categoriaId:'', pessoaId: quemEstaUsando() || '',
    parcelas:1,
    achou:{valor:false, alvo:'', categoria:'', pessoa:'', data:'', parcelas:false}
  };

  /* 1. PARCELAS antes do valor — senão o "3" de "3x" vira dinheiro. */
  livres().some(function(t){
    const m = t.norm.match(/^(\d{1,2})x$/);
    if(!m) return false;
    const n = Number(m[1]);
    if(n < 1 || n > 60) return false;
    r.parcelas = n;
    r.achou.parcelas = n > 1;
    t.usado = true;
    const i = tokens.indexOf(t);
    if(i > 0 && tokens[i-1].norm === 'em') tokens[i-1].usado = true;  // "em 3x"
    return true;
  });

  /* 2. DATA */
  livres().some(function(t){
    const d = DIAS_PALAVRA[t.norm];
    if(d !== undefined){
      r.data = somarDias(hoje, d);
      r.achou.data = t.bruto;
      t.usado = true;
      return true;
    }
    /* 12/03 ou 12/03/2026 */
    const b = t.norm.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
    if(b){
      let ano = b[3] ? Number(b[3]) : Number(hoje.slice(0,4));
      if(ano < 100) ano += 2000;
      const dia = Number(b[1]), mes = Number(b[2]);
      if(dia>=1 && dia<=31 && mes>=1 && mes<=12){
        r.data = ano + '-' + String(mes).padStart(2,'0') + '-' + String(dia).padStart(2,'0');
        r.achou.data = t.bruto;
        t.usado = true;
        return true;
      }
    }
    /* "dia 05" -> dia 5 do mês corrente */
    if(t.norm === 'dia'){
      const i = tokens.indexOf(t);
      const prox = tokens[i+1];
      const dia = prox && !prox.usado ? Number(prox.norm) : NaN;
      if(dia>=1 && dia<=31){
        r.data = diaDoMes(hoje.slice(0,7), dia);
        r.achou.data = 'dia ' + dia;
        t.usado = true; prox.usado = true;
        return true;
      }
    }
    return false;
  });

  /* 3. PESSOA antes de conta e cartão: nome de gente costuma ser uma palavra só
     e some fácil dentro da descrição. */
  const p = consumirNome(DB.pessoas, tokens);
  if(p){ r.pessoaId = p.id; r.achou.pessoa = p.nome; }

  /* 4. DESTINO — cartão antes de conta: dito "nubank", quase sempre é o cartão */
  const cart = consumirNome(DB.cartoes, tokens);
  if(cart){ r.alvo = 'cartao:' + cart.id; r.achou.alvo = cart.nome; }
  else {
    const cta = consumirNome(DB.contas, tokens);
    if(cta){ r.alvo = 'conta:' + cta.id; r.achou.alvo = cta.nome; }
  }

  /* 5. ENTRADA OU SAÍDA */
  r.tipo = (forcaEntrada || livres().some(function(t){
    return DICAS_ENTRADA.indexOf(t.norm) >= 0;
  })) ? 'entrada' : 'saida';

  /* 6. VALOR — o último número que sobrou */
  const nums = livres().filter(function(t){ return /^\d+([.,]\d+)*$/.test(t.norm); });
  if(nums.length){
    const t = nums[nums.length-1];
    const c = lerDinheiro(t.norm);
    if(c !== null && c > 0){ r.valor = c; r.achou.valor = true; t.usado = true; }
  }

  /* 7. CATEGORIA — nome explícito primeiro, palavra-chave depois */
  const cats = DB.categorias.filter(function(c){ return c.tipo === r.tipo; });
  const catNome = consumirNome(cats, tokens);
  if(catNome){ r.categoriaId = catNome.id; r.achou.categoria = catNome.nome; }
  else {
    const palavras = {};
    livres().forEach(function(t){ palavras[t.norm] = true; });
    for(let i=0;i<DICAS_CATEGORIA.length && !r.categoriaId;i++){
      const chaves = DICAS_CATEGORIA[i][0], nome = DICAS_CATEGORIA[i][1];
      for(let k=0;k<chaves.length;k++){
        if(!palavras[chaves[k]]) continue;
        const achada = cats.filter(function(c){
          return semAcento(c.nome) === semAcento(nome);
        })[0];
        if(achada){ r.categoriaId = achada.id; r.achou.categoria = achada.nome; break; }
      }
    }
  }

  /* 8. DESCRIÇÃO — o que sobrou, na grafia original */
  const resto = livres().map(function(t){ return t.bruto; }).join(' ').trim();
  r.descricao = resto || r.achou.categoria || (forcaEntrada ? 'Recebimento' : 'Lançamento');

  return r;
}

/* ---------------------------------------------------------
   GRAVAR
   --------------------------------------------------------- */

/* Preenche mesFatura e mesComp de um lançamento a partir do alvo.
   É AQUI que a regra 3 do CLAUDE.md acontece: crédito compete no mês da fatura,
   o resto no mês da data. */
function carimbarCompetencia(l){
  if(alvoEhCartao(l.alvo)){
    /* Se o mês da fatura já veio pronto, respeita. É o caso das parcelas: a
       data delas É o dia do vencimento da própria fatura, então recalcular a
       partir dessa data empurraria cada uma um ciclo para a frente. Uma compra
       em 6x apareceria de outubro a março em vez de setembro a fevereiro — e
       sem dar erro em tela nenhuma. */
    if(!l.mesFatura){
      const c = cartao(idDoAlvo(l.alvo));
      l.mesFatura = c ? faturaDaCompra(l.data, c.diaFechamento, c.diaVencimento) : mesDe(l.data);
    }
  } else {
    l.mesFatura = '';
  }
  l.mesComp = l.mesFatura || mesDe(l.data);
  return l;
}

function novoLancamento(dados){
  return carimbarCompetencia(Object.assign({
    id: uid(), data: hojeISO(), descricao: '', valor: 0, tipo: 'saida',
    pessoaId: '', categoriaId: '', alvo: '', mesFatura: '', mesComp: '',
    pago: true, nota: ''
  }, dados));
}

/**
 * Grava uma compra parcelada: UM lançamento por parcela, cada um na fatura do
 * seu mês. São registros separados de propósito — é o que faz a mesclagem
 * funcionar quando os dois lançam ao mesmo tempo (regra 5 do CLAUDE.md).
 *
 * `jaPagas` existe para compra que começou antes do app: cria só o que falta.
 */
function gravarParcelado(d){
  const c = cartao(d.cartaoId);
  if(!c) return;

  const valores = dividirParcelas(d.total, d.parcelas);
  const primeira = faturaDaCompra(d.data, c.diaFechamento, c.diaVencimento);
  const jaPagas = Math.max(0, Math.min(d.jaPagas || 0, d.parcelas - 1));

  const compraId = uid();
  DB.compras.push({
    id: compraId, cartaoId: c.id, categoriaId: d.categoriaId || '',
    descricao: d.descricao, total: d.total, parcelas: d.parcelas,
    jaPagas: jaPagas, dataCompra: d.data
  });

  for(let i = jaPagas; i < d.parcelas; i++){
    const mesFatura = mesMais(primeira, i);
    DB.lancamentos.push(novoLancamento({
      /* A parcela "acontece" no vencimento da fatura dela, não na data da
         compra — assim cai no mês certo de toda tela. */
      data: diaDoMes(mesFatura, c.diaVencimento),
      descricao: d.descricao + ' (' + (i+1) + '/' + d.parcelas + ')',
      valor: valores[i], tipo: 'saida',
      pessoaId: d.pessoaId || '', categoriaId: d.categoriaId || '',
      alvo: 'cartao:' + c.id, mesFatura: mesFatura, pago: false,
      compraId: compraId, parcelaN: i+1, parcelaDe: d.parcelas
    }));
  }
}

/* Apagar uma parcela sozinha deixaria a compra pela metade e a dívida errada.
   Então apagar qualquer parcela apaga a compra inteira. */
function excluirLancamento(id){
  const l = DB.lancamentos.filter(function(x){ return x.id === id; })[0];
  if(!l) return;

  if(l.transferenciaId){
    const outra = DB.lancamentos.filter(function(x){
      return x.transferenciaId === l.transferenciaId && x.id !== l.id;
    })[0];
    if(!confirm('Excluir esta transferência?\n\n'
              + 'Os dois lados somem juntos — o que saiu e o que entrou.')) return;
    DB.lancamentos = DB.lancamentos.filter(function(x){
      return x.transferenciaId !== l.transferenciaId;
    });
    salvarDB(); desenhar();
    toast('Transferência excluída.');
    return;
  }

  if(l.compraId){
    const compra = DB.compras.filter(function(c){ return c.id === l.compraId; })[0];
    const quantas = DB.lancamentos.filter(function(x){ return x.compraId === l.compraId; }).length;
    if(!confirm('Este lançamento é uma parcela de "' + (compra ? compra.descricao : l.descricao) + '".\n\n'
              + 'Excluir vai apagar as ' + quantas + ' parcelas que ainda existem.\n\nContinuar?')) return;
    DB.lancamentos = DB.lancamentos.filter(function(x){ return x.compraId !== l.compraId; });
    DB.compras     = DB.compras.filter(function(c){ return c.id !== l.compraId; });
  } else {
    if(!confirm('Excluir "' + l.descricao + '"?')) return;
    DB.lancamentos = DB.lancamentos.filter(function(x){ return x.id !== id; });
  }

  salvarDB();
  desenhar();
  toast('Excluído.');
}

function alternarPago(id){
  const l = DB.lancamentos.filter(function(x){ return x.id === id; })[0];
  if(!l) return;
  l.pago = !l.pago;
  salvarDB();
  desenhar();
}

/* ---------------------------------------------------------
   A BARRA DE LANÇAMENTO RÁPIDO
   Fica no topo do Painel e dos Lançamentos. O preview embaixo mostra o que o
   app entendeu ANTES de gravar — assim não existe o medo de "será que foi para
   a categoria certa?".
   --------------------------------------------------------- */
function barraRapida(){
  const semDestino = !DB.contas.length && !DB.cartoes.length;

  if(semDestino){
    return '<div class="card" style="border:1px solid var(--ac)">'
      + '<h2>Antes de lançar</h2>'
      + '<p class="ajuda" style="margin-top:-8px">Cadastre pelo menos uma conta ou um '
      + 'cartão. É o que diz de onde o dinheiro sai.</p>'
      + '<button class="btn btn-1" style="margin-top:12px" onclick="irPara(\'ajustes\')">'
      + 'Ir para Ajustes</button></div>';
  }

  return '<div class="card">'
    + '<div style="display:flex;gap:10px">'
    +   '<input id="rapido" placeholder="Lance numa frase — ex.: mercado 250,90 nubank 3x" '
    +   'autocomplete="off" autocapitalize="none" spellcheck="false" '
    +   'oninput="previewRapido()" onkeydown="if(event.key===\'Enter\') gravarRapido()">'
    +   '<button class="btn btn-1" onclick="gravarRapido()">Lançar</button>'
    + '</div>'
    + '<div id="rapidoPreview" style="margin-top:12px"></div>'
    + (DB.contas.length > 1
      ? '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--borda)">'
        + '<button class="btn btn-2 btn-p" onclick="transferirEntreContas()">'
        + '⇄ Transferir entre contas</button></div>'
      : '')
    + '</div>';
}

/* Redesenhar a tela inteira a cada tecla destruiria o campo em que se está
   digitando, e o foco iria junto. Por isso só o preview é reescrito. */
function previewRapido(){
  const campo = document.getElementById('rapido');
  const alvo  = document.getElementById('rapidoPreview');
  if(!campo || !alvo) return;

  const txt = campo.value.trim();
  if(!txt){
    alvo.innerHTML = '<div style="display:flex;gap:6px;flex-wrap:wrap">'
      + ['mercado 250,90', 'uber 32 ontem', 'fone 899 nubank 6x', '+salário 4200']
        .map(function(ex){
          return '<button class="chip" style="border:none;cursor:pointer;font-family:inherit" '
               + 'onclick="usarExemplo(\'' + ex.replace(/'/g,"\\'") + '\')">' + esc(ex) + '</button>';
        }).join('')
      + '</div>';
    return;
  }

  const r = interpretar(txt);
  const eu = pessoa(r.pessoaId);
  const chips = [];

  chips.push('<span class="chip ' + (r.tipo==='entrada'?'chip-pos':'chip-neg') + '">'
           + (r.tipo==='entrada'?'Entrada':'Saída') + '</span>');
  chips.push('<span class="chip tab"' + (r.valor===null?' style="opacity:.55"':'') + '>'
           + (r.valor===null ? 'falta o valor' : fmt(r.valor)) + '</span>');
  if(r.descricao) chips.push('<span class="chip">' + esc(r.descricao) + '</span>');
  if(eu) chips.push('<span class="chip' + (r.achou.pessoa?' chip-ac':'') + '">'
                  + eu.emoji + ' ' + esc(eu.nome) + '</span>');
  if(r.achou.alvo) chips.push('<span class="chip chip-ac">' + esc(r.achou.alvo) + '</span>');
  if(r.achou.categoria) chips.push('<span class="chip">' + esc(r.achou.categoria) + '</span>');
  if(r.parcelas > 1){
    chips.push('<span class="chip chip-ala">' + r.parcelas + '× de '
             + fmt(Math.floor((r.valor||0)/r.parcelas)) + '</span>');
  }
  chips.push('<span class="chip">' + fmtDiaMes(r.data) + '</span>');

  /* Mostrar a competência quando ela for diferente do mês da data evita a
     pergunta "por que esse gasto não apareceu neste mês?" (regra 3). */
  let extra = '';
  if(r.alvo && alvoEhCartao(r.alvo)){
    const l = carimbarCompetencia({data:r.data, alvo:r.alvo});
    if(l.mesComp !== mesDe(r.data)){
      extra = '<p class="ajuda">Cai na fatura de <b>' + nomeMes(l.mesComp)
            + '</b> — é nesse mês que vai contar.</p>';
    }
  }

  alvo.innerHTML = '<div style="display:flex;gap:6px;flex-wrap:wrap">'
                 + chips.join('') + '</div>' + extra;
}

function usarExemplo(txt){
  const c = document.getElementById('rapido');
  if(!c) return;
  c.value = txt;
  c.focus();
  previewRapido();
}

function gravarRapido(){
  const campo = document.getElementById('rapido');
  if(!campo) return;
  const txt = campo.value.trim();
  if(!txt) return;

  const r = interpretar(txt);
  if(r.valor === null){
    toast('Não achei o valor. Exemplo: mercado 150 nubank');
    return;
  }

  /* Sem destino dito, cai na primeira conta — ou no primeiro cartão, se só
     houver cartão cadastrado. */
  let alvo = r.alvo;
  if(!alvo){
    if(DB.contas.length) alvo = 'conta:' + DB.contas[0].id;
    else if(DB.cartoes.length) alvo = 'cartao:' + DB.cartoes[0].id;
    else { toast('Cadastre uma conta antes de lançar.'); return; }
  }

  if(alvoEhCartao(alvo) && r.parcelas > 1){
    gravarParcelado({
      cartaoId: idDoAlvo(alvo), total: r.valor, parcelas: r.parcelas,
      descricao: r.descricao, data: r.data,
      categoriaId: r.categoriaId, pessoaId: r.pessoaId, jaPagas: 0
    });
  } else {
    DB.lancamentos.push(novoLancamento({
      data: r.data, descricao: r.descricao, valor: r.valor, tipo: r.tipo,
      pessoaId: r.pessoaId, categoriaId: r.categoriaId, alvo: alvo,
      /* Compra no cartão só vira "pago" quando a fatura é quitada. */
      pago: !alvoEhCartao(alvo)
    }));
  }

  salvarDB();
  campo.value = '';
  desenhar();
  /* Devolve o foco: lançar três gastos seguidos não deve exigir tocar no campo
     de novo. Depois do desenhar(), o campo é outro elemento. */
  setTimeout(function(){
    const novo = document.getElementById('rapido');
    if(novo) novo.focus();
  }, 30);
  toast(r.descricao + ' · ' + fmt(r.valor));
}

/* ---------------------------------------------------------
   TRANSFERIR ENTRE CONTAS

   Tirar do Itaú e pôr no Nubank não é gasto nem receita — é o mesmo dinheiro
   mudando de lugar. Por isso vira um PAR de lançamentos do tipo transferência,
   que mexem nos dois saldos mas ficam de fora do "entrou" e do "saiu" do mês.
   Sem isso, uma transferência de R$ 500 apareceria como R$ 500 de gasto e
   R$ 500 de receita, inventando movimento que não existiu.
   --------------------------------------------------------- */
function transferirEntreContas(){
  if(DB.contas.length < 2){
    alert('Você precisa de pelo menos duas contas cadastradas.');
    return;
  }

  const opcoes = function(exceto){
    return DB.contas.filter(function(c){ return c.id !== exceto; })
      .map(function(c){
        return '<option value="' + c.id + '">' + esc(c.nome)
             + ' · ' + fmt(saldoDaConta(c.id)) + '</option>';
      }).join('');
  };

  abrirModal(
    '<h2>Transferir entre contas</h2>'
    + '<div class="campo"><label>Sai de</label>'
    + '<select id="trDe" onchange="trAtualizarPara()">' + opcoes('') + '</select></div>'
    + '<div class="campo"><label>Entra em</label>'
    + '<select id="trPara"></select></div>'
    + '<div class="grade g2" style="gap:12px">'
    +   '<div class="campo"><label>Valor</label>'
    +   '<input id="trValor" inputmode="decimal" placeholder="0,00"></div>'
    +   '<div class="campo"><label>Data</label>'
    +   '<input id="trData" type="date" value="' + hojeISO() + '"></div>'
    + '</div>'
    + '<div class="campo"><label>Observação <span class="fra">(opcional)</span></label>'
    + '<input id="trNota" placeholder="Ex.: guardei para pagar a fatura"></div>'
    + '<p class="ajuda">Isto <b>não</b> conta como gasto nem como receita do mês — é o '
    + 'mesmo dinheiro mudando de lugar. Só os saldos das duas contas mudam.</p>'
    + '<div class="modal-acoes">'
    + '<button class="btn btn-2" onclick="fecharModal()">Cancelar</button>'
    + '<button class="btn btn-1" onclick="salvarTransferencia()">Transferir</button></div>');

  trAtualizarPara();
}

/* A conta de destino nunca pode ser a mesma da origem. */
function trAtualizarPara(){
  const de = v('trDe');
  const para = document.getElementById('trPara');
  if(!para) return;
  const anterior = para.value;
  para.innerHTML = DB.contas.filter(function(c){ return c.id !== de; })
    .map(function(c){
      return '<option value="' + c.id + '"' + (c.id === anterior ? ' selected' : '') + '>'
           + esc(c.nome) + ' · ' + fmt(saldoDaConta(c.id)) + '</option>';
    }).join('');
}

function salvarTransferencia(){
  const de = v('trDe'), para = v('trPara');
  const valor = lerDinheiro(v('trValor'));
  const data = v('trData') || hojeISO();
  const nota = (v('trNota') || '').trim();

  if(!valor || valor <= 0){ alert('Valor inválido.'); return; }
  if(de === para){ alert('Escolha duas contas diferentes.'); return; }

  const cDe = conta(de), cPara = conta(para);
  const saldo = saldoDaConta(de);
  if(valor > saldo){
    if(!confirm('A conta ' + cDe.nome + ' tem ' + fmt(saldo) + ' e você está tirando '
              + fmt(valor) + '.\n\nO saldo dela vai ficar negativo. Continuar?')) return;
  }

  /* O par carrega o mesmo transferenciaId: é o que permite apagar os dois
     juntos. Apagar só um lado deixaria dinheiro aparecendo ou sumindo do nada. */
  const par = uid();

  DB.lancamentos.push(novoLancamento({
    data: data, descricao: 'Para ' + cPara.nome, valor: valor, tipo: 'transf',
    pessoaId: quemEstaUsando() || '', alvo: 'conta:' + de, pago: true,
    transferenciaId: par, nota: nota
  }));
  DB.lancamentos.push(novoLancamento({
    data: data, descricao: 'De ' + cDe.nome, valor: valor, tipo: 'transf_entra',
    pessoaId: quemEstaUsando() || '', alvo: 'conta:' + para, pago: true,
    transferenciaId: par, nota: nota
  }));

  salvarDB(); fecharModal(); desenhar();
  toast(fmt(valor) + ' de ' + cDe.nome + ' para ' + cPara.nome + '.');
}

/* ---------------------------------------------------------
   TELA DE LANÇAMENTOS
   --------------------------------------------------------- */
let filtroPessoa = '';

function lancamentosDoMes(ym){
  return DB.lancamentos
    .filter(function(l){ return (l.mesComp || mesDe(l.data)) === ym; })
    .filter(function(l){ return !filtroPessoa || l.pessoaId === filtroPessoa; })
    .sort(function(a,b){ return (b.data||'').localeCompare(a.data||''); });
}

function desenharLancamentos(){
  const c = document.getElementById('content');
  const lista = lancamentosDoMes(mesVisivel);

  let entrou = 0, saiu = 0;
  lista.forEach(function(l){
    if(l.tipo === 'entrada') entrou += l.valor;
    else if(l.tipo === 'saida') saiu += l.valor;
  });

  /* Agrupa por dia: lista corrida de 60 linhas é ilegível. */
  const dias = [];
  const porDia = {};
  lista.forEach(function(l){
    if(!porDia[l.data]){ porDia[l.data] = []; dias.push(l.data); }
    porDia[l.data].push(l);
  });

  c.innerHTML =
    barraRapida()
  + navegadorDeMes()

  + '<div class="grade g3">'
  +   '<div class="card"><p class="p mut">Entrou</p>'
  +     '<p class="n-s tab pos">' + $(entrou) + '</p></div>'
  +   '<div class="card"><p class="p mut">Saiu</p>'
  +     '<p class="n-s tab neg">' + $(saiu) + '</p></div>'
  +   '<div class="card"><p class="p mut">Diferença</p>'
  +     '<p class="n-s tab ' + (entrou-saiu >= 0 ? 'pos':'neg') + '">' + $(entrou-saiu) + '</p></div>'
  + '</div>'

  + (temVariasPessoas() ? filtroDePessoa() : '')

  + (lista.length
    ? dias.map(function(d){
        const doDia = porDia[d];
        const soma = doDia.reduce(function(s,l){
          return s + (l.tipo==='entrada' ? l.valor : (l.tipo==='saida' ? -l.valor : 0));
        }, 0);
        return '<div style="margin-bottom:18px">'
          + '<div class="lin" style="padding:0 4px 8px">'
          +   '<span class="p" style="font-weight:650;color:var(--mut)">' + fmtDiaMes(d) + '</span>'
          +   '<span class="p tab ' + (soma>=0?'pos':'fra') + '">'
          +   (soma>=0?'+':'') + $(soma) + '</span>'
          + '</div>'
          + '<div class="card" style="padding:6px 16px">'
          + doDia.map(linhaLancamento).join('')
          + '</div></div>';
      }).join('')
    : '<div class="card vazio">Nenhum lançamento em ' + nomeMes(mesVisivel) + '.<br>'
      + '<span class="p">Use a barra lá em cima.</span></div>');
}

function filtroDePessoa(){
  const opcoes = [{id:'', nome:'Todos', emoji:''}].concat(DB.pessoas);
  return '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">'
    + opcoes.map(function(p){
        const on = filtroPessoa === p.id;
        return '<button class="chip' + (on?' chip-ac':'') + '" '
          + 'style="border:none;cursor:pointer;font-family:inherit;padding:9px 16px;font-size:14px'
          + (on?';background:var(--ac);color:#fff':'') + '" '
          + 'onclick="filtroPessoa=\'' + p.id + '\'; desenhar()">'
          + (p.emoji ? p.emoji + ' ' : '') + esc(p.nome) + '</button>';
      }).join('')
    + '</div>';
}

function linhaLancamento(l){
  const cat = categoria(l.categoriaId);
  const p   = pessoa(l.pessoaId);
  const transf = l.tipo === 'transf' || l.tipo === 'transf_entra';
  const cor = transf ? '#94a3b8' : (cat ? cat.cor : '#94a3b8');
  const ic  = transf ? '⇄' : (cat ? cat.icone : '•');

  const sinal = l.tipo === 'entrada' ? '+' : (transf ? '' : '−');
  const corValor = l.tipo === 'entrada' ? 'var(--pos)'
                 : (transf ? 'var(--mut)' : 'var(--txt)');

  return '<div style="display:flex;align-items:center;gap:12px;padding:11px 0;'
    + 'border-top:1px solid var(--borda)">'
    + '<span class="ic-t" style="background:' + cor + '1f">' + ic + '</span>'
    + '<div style="min-width:0;flex:1">'
    +   '<p style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
    +   esc(l.descricao) + '</p>'
    +   '<p class="pp fra">'
    +   esc(transf ? 'Transferência' : (cat ? cat.nome : 'Sem categoria'))
    +   (l.alvo ? ' · ' + esc(nomeAlvo(l.alvo)) : '')
    +   (p ? ' · ' + p.emoji + ' ' + esc(p.nome) : '')
    +   '</p>'
    + '</div>'
    + (!l.pago ? '<span class="chip chip-ala">previsto</span>' : '')
    + '<span class="tab" style="font-weight:650;color:' + corValor + ';white-space:nowrap">'
    +   sinal + $(l.valor) + '</span>'
    + '<div style="display:flex;gap:2px;flex:none">'
    +   '<button class="btn btn-2 btn-p" style="border:none;padding:0 8px" '
    +   'onclick="alternarPago(\'' + l.id + '\')" title="' + (l.pago?'Marcar como previsto':'Marcar como pago') + '">'
    +   (l.pago ? '↺' : '✓') + '</button>'
    +   '<button class="btn btn-x btn-p" style="padding:0 8px" '
    +   'onclick="excluirLancamento(\'' + l.id + '\')" title="Excluir">×</button>'
    + '</div>'
    + '</div>';
}

/* Navegação de mês, usada por Painel, Lançamentos e Cartões. */
function navegadorDeMes(){
  return '<div class="lin" style="margin-bottom:18px">'
    + '<button class="btn btn-2" onclick="mudarMes(-1)" aria-label="Mês anterior">‹</button>'
    + '<span style="font-weight:650;font-size:17px;text-align:center;flex:1">'
    + nomeMes(mesVisivel) + '</span>'
    + '<button class="btn btn-2" onclick="mudarMes(1)" aria-label="Próximo mês">›</button>'
    + '</div>';
}
function mudarMes(n){ mesVisivel = mesMais(mesVisivel, n); desenhar(); }
/* =========================================================
   PAINEL — a visão do mês, com o saldo em cima de tudo

   As contas ficam todas aqui, num lugar só, para nenhuma tela recalcular
   dinheiro por conta própria. Ver as regras 3, 6, 7 e 8 do CLAUDE.md.
   ========================================================= */

/* ---------------------------------------------------------
   CÁLCULO
   --------------------------------------------------------- */

/* Movimentação interna: muda o dinheiro de lugar sem ser receita nem gasto.
   Pagar fatura e guardar numa meta entram aqui — a despesa já foi contada
   quando a compra aconteceu, e contar de novo dobraria o mês (regra 6). */
function ehTransferencia(tipo){ return tipo === 'transf' || tipo === 'transf_entra'; }

/* Saldo de uma conta: inicial + entradas efetivadas − saídas efetivadas.
   Lançamento previsto não entra (ainda não mexeu no dinheiro), e lançamento de
   cartão também não — ele só mexe quando a fatura é paga (regra 8). */
function saldoDaConta(contaId){
  const c = conta(contaId);
  if(!c) return 0;
  let s = c.saldoInicial || 0;
  DB.lancamentos.forEach(function(l){
    if(!l.pago || l.alvo !== 'conta:' + contaId) return;
    if(l.tipo === 'entrada' || l.tipo === 'transf_entra') s += l.valor;
    else s -= l.valor;
  });
  return s;
}

function caixaTotal(){
  return DB.contas.reduce(function(s,c){ return s + saldoDaConta(c.id); }, 0);
}

/* Fatura de um cartão num mês: tudo que caiu naquela fatura. */
function faturaDoMes(cartaoId, ym){
  return DB.lancamentos
    .filter(function(l){ return l.alvo === 'cartao:' + cartaoId && l.mesFatura === ym; })
    .reduce(function(s,l){ return s + (l.tipo==='entrada' ? -l.valor : l.valor); }, 0);
}
/* Tudo que ainda vai virar fatura: a dívida real do cartão. */
function dividaDoCartao(cartaoId, aPartirDe){
  return DB.lancamentos
    .filter(function(l){
      return l.alvo === 'cartao:' + cartaoId && l.mesFatura >= aPartirDe && !l.pago;
    })
    .reduce(function(s,l){ return s + l.valor; }, 0);
}

/* O resumo de um mês. `ym` é o mês de COMPETÊNCIA, não o da data. */
function resumoDoMes(ym){
  const r = {entrou:0, saiu:0, previsto:0, porCategoria:{}, porPessoa:{}, porGrupo:{}};

  DB.lancamentos.forEach(function(l){
    if((l.mesComp || mesDe(l.data)) !== ym) return;
    if(ehTransferencia(l.tipo)) return;

    if(l.tipo === 'entrada'){
      r.entrou += l.valor;
      const k = l.pessoaId || '';
      r.porPessoa[k] = r.porPessoa[k] || {saiu:0, entrou:0};
      r.porPessoa[k].entrou += l.valor;
      return;
    }

    r.saiu += l.valor;
    if(!l.pago) r.previsto += l.valor;

    const k = l.pessoaId || '';
    r.porPessoa[k] = r.porPessoa[k] || {saiu:0, entrou:0};
    r.porPessoa[k].saiu += l.valor;

    const cid = l.categoriaId || '';
    r.porCategoria[cid] = r.porCategoria[cid] || {total:0, deFaturaFechada:0};
    r.porCategoria[cid].total += l.valor;
    /* Parte que veio de compra no crédito de mês anterior. É o que o Maycon
       pediu para ficar visível: o mês já nasce com parte do teto comprometida. */
    if(l.mesFatura && mesDe(l.data) < ym){
      r.porCategoria[cid].deFaturaFechada += l.valor;
    }

    const cat = categoria(cid);
    const g = cat ? cat.grupo : 'superfluo';
    r.porGrupo[g] = (r.porGrupo[g] || 0) + l.valor;
  });

  return r;
}

/* Patrimônio: dinheiro nas contas + o que já foi guardado nas metas.
   Guardar sai do caixa disponível mas continua sendo da casa — mostrar só o
   saldo faria parecer que poupar empobrece (regra 8). */
function patrimonio(){
  let reserva = 0, guardado = 0, doMes = 0;
  const ym = mesVisivel;

  DB.metas.forEach(function(m){
    const soma = DB.aportes
      .filter(function(a){ return a.metaId === m.id; })
      .reduce(function(s,a){ return s + a.valor; }, 0);
    if(m.tipo === 'reserva') reserva += soma; else guardado += soma;
  });
  DB.aportes.forEach(function(a){ if(mesDe(a.data) === ym) doMes += a.valor; });

  const caixa = caixaTotal();
  return {caixa: caixa, reserva: reserva, guardado: guardado,
          total: caixa + reserva + guardado, doMes: doMes};
}

/**
 * Projeção dos próximos meses — "quanto vamos ter no fim do mês que vem".
 * Junta o caixa de hoje, os lançamentos já gravados com data futura (inclui as
 * parcelas) e as contas fixas que ainda não viraram lançamento naquele mês.
 * Uma recorrente só é somada se NÃO existir lançamento dela no mês, senão
 * contaria duas vezes.
 */
function projecao(meses){
  meses = meses || 12;
  const linhas = [];
  let acumulado = caixaTotal();

  for(let i=0;i<meses;i++){
    const ym = mesMais(mesAtual(), i);
    const linha = {mes: ym, entra:0, sai:0, parcelas:0, fixas:0, liquido:0, saldo:0};
    const jaTem = {};

    DB.lancamentos.forEach(function(l){
      if((l.mesComp || mesDe(l.data)) !== ym) return;
      if(ehTransferencia(l.tipo)) return;
      if(l.recorrenteId) jaTem[l.recorrenteId] = true;

      if(l.tipo === 'entrada') linha.entra += l.valor;
      else {
        linha.sai += l.valor;
        if(l.compraId) linha.parcelas += l.valor;
        else if(l.recorrenteId) linha.fixas += l.valor;
      }
    });

    DB.recorrentes.forEach(function(rc){
      if(!rc.ativo || jaTem[rc.id]) return;
      const quando = diaDoMes(ym, rc.dia);
      if(rc.inicio && quando < rc.inicio) return;
      if(rc.fim && quando > rc.fim) return;
      if(rc.tipo === 'entrada') linha.entra += rc.valor;
      else { linha.sai += rc.valor; linha.fixas += rc.valor; }
    });

    linha.liquido = linha.entra - linha.sai;
    acumulado += linha.liquido;
    linha.saldo = acumulado;
    linhas.push(linha);
  }
  return linhas;
}

/* ---------------------------------------------------------
   DESENHO
   --------------------------------------------------------- */
const GRUPO_ROTULO = {essencial:'Essencial', superfluo:'Supérfluo',
                      divida:'Dívida', investimento:'Investimento', receita:'Receita'};

function desenharPainel(){
  const c = document.getElementById('content');
  const r = resumoDoMes(mesVisivel);
  const pat = patrimonio();
  const proj = projecao(12);

  const faturasAbertas = DB.cartoes.reduce(function(s,ct){
    const f = faturaDoMes(ct.id, mesVisivel);
    const paga = DB.lancamentos.some(function(l){
      return l.alvo === 'cartao:' + ct.id && l.mesFatura === mesVisivel && l.pago;
    });
    return s + (paga ? 0 : f);
  }, 0);

  const disponivel = pat.caixa - faturasAbertas - r.previsto;
  const quebra = proj.filter(function(p){ return p.saldo < 0; })[0];

  c.innerHTML =
    barraRapida()
  + navegadorDeMes()
  + heroiSaldo(pat.caixa, disponivel, faturasAbertas, r.previsto)
  + primeirosPassos()
  + (pat.total > pat.caixa ? cartaoPatrimonio(pat) : '')
  + cartaoDoMes(r)
  + (quebra ? avisoQuebra(quebra) : '')
  + cartaoFuturo(proj);
}

function heroiSaldo(caixa, disponivel, faturas, previsto){
  const explica = (faturas || previsto)
    ? 'Depois de pagar ' + (faturas ? 'as faturas' : '')
      + (faturas && previsto ? ' e ' : '')
      + (previsto ? 'as contas previstas' : '')
      + ' deste mês, sobram <b class="tab">' + $(disponivel) + '</b>.'
    : 'Nenhuma fatura ou conta em aberto — esse valor está todo livre.';

  return '<div class="heroi">'
    + '<div class="rot">Vocês têm agora</div>'
    + '<div class="n-g tab" style="margin-top:6px">' + $(caixa) + '</div>'
    + '<div class="sub">' + explica + '</div>'
    + (DB.contas.length
      ? '<div class="bolsos">' + DB.contas.map(function(ct){
          const dono = pessoa(ct.donoId);
          return '<div class="bolso">'
            + '<div style="font-size:12px;opacity:.88">' + esc(ct.nome)
            + (dono ? ' · ' + esc(dono.nome) : '') + '</div>'
            + '<div style="font-size:16px;font-weight:650;margin-top:1px" class="tab">'
            + $(saldoDaConta(ct.id)) + '</div></div>';
        }).join('') + '</div>'
      : '')
    + '</div>';
}

/* Só aparece enquanto falta configurar. Some sozinho quando tudo está pronto. */
function primeirosPassos(){
  const passos = [
    {ok: DB.contas.length > 0,  txt:'Cadastrar as contas',
     det:'Com o saldo de hoje em cada uma. É a base do número lá em cima.'},
    {ok: DB.cartoes.length > 0, txt:'Cadastrar os cartões',
     det:'Com o dia de fechamento e o de vencimento — é o que põe cada parcela na fatura certa.'},
    {ok: DB.lancamentos.length > 0, txt:'Fazer o primeiro lançamento',
     det:'Pela barra do topo: escreva "mercado 150" e aperte Enter.'}
  ];
  if(passos.every(function(p){ return p.ok; })) return '';

  return '<div class="card" style="border:1px solid var(--ac)">'
    + '<h2>Primeiros passos</h2>'
    + passos.map(function(p){
        return '<div style="display:flex;gap:12px;align-items:flex-start;padding:8px 0">'
          + '<span style="margin-top:3px;width:18px;height:18px;border-radius:999px;flex:none;'
          + 'display:grid;place-items:center;font-size:11px;color:#fff;'
          + 'border:2px solid ' + (p.ok?'var(--pos)':'var(--borda2)') + ';'
          + 'background:' + (p.ok?'var(--pos)':'transparent') + '">' + (p.ok?'✓':'') + '</span>'
          + '<div style="flex:1;min-width:0">'
          + '<p style="font-weight:500;color:' + (p.ok?'var(--fra)':'var(--txt)') + '">'
          + (p.ok ? '<s>' + p.txt + '</s>' : p.txt) + '</p>'
          + (p.ok ? '' : '<p class="ajuda" style="margin-top:2px">' + p.det + '</p>')
          + '</div>'
          + (p.ok ? '' : '<button class="btn btn-2 btn-p" onclick="irPara(\'ajustes\')">Ir</button>')
          + '</div>';
      }).join('')
    + '</div>';
}

function cartaoPatrimonio(pat){
  const partes = [
    {nome:'Em conta',  v:pat.caixa,    cor:'var(--ac)'},
    {nome:'Reserva',   v:pat.reserva,  cor:'var(--pos)'},
    {nome:'Guardado',  v:pat.guardado, cor:'var(--inv)'}
  ].filter(function(p){ return p.v > 0; });
  const total = partes.reduce(function(s,p){ return s + p.v; }, 0) || 1;

  return '<div class="card">'
    + '<h2>Patrimônio<span class="aux" onclick="irPara(\'investimentos\')">Detalhar</span></h2>'
    + '<p class="n-m tab">' + $(pat.total) + '</p>'
    + '<p class="ajuda">Tudo que é de vocês: dinheiro em conta mais o que já foi guardado.'
    + (pat.doMes ? ' <b class="' + (pat.doMes>0?'pos':'neg') + '">'
                 + (pat.doMes>0?'+':'') + $(pat.doMes) + '</b> neste mês.' : '') + '</p>'
    + '<div style="display:flex;height:14px;border-radius:999px;overflow:hidden;margin-top:16px">'
    + partes.map(function(p){
        return '<div style="width:' + (p.v/total*100) + '%;background:' + p.cor + '" '
             + 'title="' + esc(p.nome) + '"></div>';
      }).join('')
    + '</div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px">'
    + partes.map(function(p){
        return '<div style="display:flex;align-items:center;gap:7px" class="p">'
          + '<span style="width:10px;height:10px;border-radius:999px;background:' + p.cor + '"></span>'
          + '<span class="mut">' + p.nome + '</span>'
          + '<b class="tab">' + $(p.v) + '</b></div>';
      }).join('')
    + '</div></div>';
}

function cartaoDoMes(r){
  const sobra = r.entrou - r.saiu;

  /* Categorias do mês, maior primeiro. */
  const cats = Object.keys(r.porCategoria).map(function(id){
    const cat = categoria(id);
    const d = r.porCategoria[id];
    return {
      id: id,
      nome: cat ? cat.nome : 'Sem categoria',
      cor:  cat ? cat.cor  : '#94a3b8',
      icone:cat ? cat.icone: '•',
      total: d.total,
      deFatura: d.deFaturaFechada,
      teto: orcamentoDe(id, mesVisivel)
    };
  }).sort(function(a,b){ return b.total - a.total; });

  return '<div class="card">'
  + '<h2>' + nomeMes(mesVisivel).split(' de ')[0] + '</h2>'

  + '<div class="grade g3" style="gap:16px">'
  +   '<div><p class="p mut">Entrou</p><p class="n-s tab pos">' + $(r.entrou) + '</p></div>'
  +   '<div><p class="p mut">Saiu</p><p class="n-s tab neg">' + $(r.saiu) + '</p>'
  +   (r.previsto ? '<p class="ajuda">' + $(r.previsto) + ' ainda não pagos</p>' : '') + '</div>'
  +   '<div><p class="p mut">' + (sobra>=0?'Sobrou':'Faltou') + '</p>'
  +   '<p class="n-s tab ' + (sobra>=0?'pos':'neg') + '">' + $(sobra) + '</p></div>'
  + '</div>'

  + (cats.length
    ? '<div style="height:1px;background:var(--borda);margin:20px 0"></div>'
      + '<h2>Para onde foi</h2>'
      + cats.slice(0,8).map(function(c, i){ return linhaCategoria(c, r.saiu, i===0); }).join('')
      + resumoPorGrupo(r)
    : '')

  + (temVariasPessoas() && r.saiu > 0 ? blocoQuemGastou(r) : '')
  + '</div>';
}

/* Uma linha de categoria, com a barra do teto quando houver.
   A parte "veio da fatura fechada" fica explícita: sem isso o número confunde,
   porque o mês nasce com o teto já parcialmente comprometido (regra 3). */
function linhaCategoria(c, totalSaiu, primeira){
  const estourou = c.teto !== null && c.total > c.teto;
  const fracao = c.teto ? c.total / c.teto : (totalSaiu ? c.total / totalSaiu : 0);

  let rodape = '';
  if(c.teto !== null){
    rodape = estourou
      ? '<span class="neg">passou ' + $(c.total - c.teto) + ' do teto de ' + $(c.teto) + '</span>'
      : 'teto ' + $(c.teto) + ' · restam ' + $(c.teto - c.total);
  }
  if(c.deFatura > 0){
    rodape += (rodape ? ' · ' : '')
      + '<span class="ala">' + $(c.deFatura) + ' vieram de fatura fechada</span>';
  }

  return '<div style="display:flex;gap:12px;align-items:center;padding:11px 0'
    + (primeira ? '' : ';border-top:1px solid var(--borda)') + '">'
    + '<span class="ic-t" style="background:' + c.cor + '1f">' + c.icone + '</span>'
    + '<div style="flex:1;min-width:0">'
    +   '<div class="lin" style="margin-bottom:6px">'
    +     '<span style="font-weight:500">' + esc(c.nome) + '</span>'
    +     '<span class="tab" style="font-weight:650">' + $(c.total) + '</span>'
    +   '</div>'

/* Gráfico de linha em SVG puro — sem biblioteca, para o arquivo continuar único. */
function graficoLinha(proj){
  const L = 440, A = 170, esq = 44, base = 26;
  const vals = proj.map(function(p){ return p.saldo; });
  const min = Math.min.apply(null, vals.concat([0]));
  const max = Math.max.apply(null, vals.concat([1]));
  const x = function(i){ return esq + i * ((L - esq - 14) / Math.max(proj.length-1, 1)); };
  const y = function(v){ return A - base - ((v - min) / ((max - min) || 1)) * (A - base - 14); };
  const pts = proj.map(function(p,i){ return x(i) + ',' + y(p.saldo); }).join(' ');

  return '<svg viewBox="0 0 ' + L + ' ' + A + '" style="width:100%;height:210px" '
    + 'role="img" aria-label="Saldo projetado dos próximos meses">'
    + '<defs><linearGradient id="gsaldo" x1="0" y1="0" x2="0" y2="1">'
    +   '<stop offset="0%" stop-color="var(--ac)" stop-opacity=".30"/>'
    +   '<stop offset="100%" stop-color="var(--ac)" stop-opacity=".02"/></linearGradient></defs>'
    + (min < 0
      ? '<line x1="' + esq + '" x2="' + (L-14) + '" y1="' + y(0) + '" y2="' + y(0) + '" '
        + 'stroke="var(--neg)" stroke-dasharray="5 5" stroke-width="1.5"/>'
      : '')
    + '<polygon points="' + esq + ',' + (A-base) + ' ' + pts + ' '
    +   x(proj.length-1) + ',' + (A-base) + '" fill="url(#gsaldo)"/>'
    + '<polyline points="' + pts + '" fill="none" stroke="var(--ac)" stroke-width="2.5" '
    +   'stroke-linejoin="round"/>'
    + proj.map(function(p,i){
        return '<circle cx="' + x(i) + '" cy="' + y(p.saldo) + '" r="3.5" fill="'
          + (p.saldo<0 ? 'var(--neg)' : 'var(--ac)') + '" stroke="var(--sup)" stroke-width="1.5">'
          + '<title>' + nomeMes(p.mes) + ': ' + fmt(p.saldo) + '</title></circle>';
      }).join('')
    + proj.map(function(p,i){
        return i % 2 === 0
          ? '<text x="' + x(i) + '" y="' + (A-7) + '" text-anchor="middle" font-size="11" '
            + 'fill="var(--fra)">' + nomeMesCurto(p.mes) + '</text>'
          : '';
      }).join('')
    + '</svg>';
}

/**
 * Pagar a fatura: marca as compras como quitadas e tira o valor de uma conta.
 * A saída é um TRANSFER, não uma despesa — as compras já foram contadas quando
 * aconteceram, e contar de novo dobraria o mês (regra 6 do CLAUDE.md).
 */
function pagarFatura(cartaoId){
  const ct = cartao(cartaoId);
  const total = faturaDoMes(cartaoId, mesVisivel);

  if(!DB.contas.length){
    alert('Cadastre uma conta antes — é dela que o dinheiro sai.');
    return;
  }
  if(total <= 0){ toast('Esta fatura está zerada.'); return; }

  abrirModal(
    '<h2>Pagar a fatura do ' + esc(ct.nome) + '</h2>'
    + '<p>Vai marcar as compras de <b>' + nomeMes(mesVisivel) + '</b> como pagas e tirar '
    + '<b class="tab">' + fmt(total) + '</b> da conta escolhida.</p>'
    + '<div class="campo" style="margin-top:16px"><label>Tirar de</label><select id="fatConta">'
    + DB.contas.map(function(c){
        return '<option value="' + c.id + '">' + esc(c.nome) + ' · '
             + fmt(saldoDaConta(c.id)) + '</option>';
      }).join('') + '</select></div>'
    + '<p class="ajuda">Isso <b>não</b> conta como gasto novo do mês: as compras já foram '
    + 'contadas quando aconteceram. Só o saldo da conta muda.</p>'
    + '<div class="modal-acoes">'
    + '<button class="btn btn-2" onclick="fecharModal()">Cancelar</button>'
    + '<button class="btn btn-1" onclick="confirmarPagamento(\'' + cartaoId + '\')">Confirmar</button>'
    + '</div>');
}

function confirmarPagamento(cartaoId){
  const ct = cartao(cartaoId);
  const contaId = v('fatConta');
  let total = 0;

  DB.lancamentos.forEach(function(l){
    if(l.alvo === 'cartao:' + cartaoId && l.mesFatura === mesVisivel && !l.pago){
      l.pago = true;
      total += (l.tipo === 'entrada' ? -l.valor : l.valor);
    }
  });

  if(total > 0){
    DB.lancamentos.push(novoLancamento({
      data: vencimentoDaFatura(mesVisivel, ct.diaVencimento),
      descricao: 'Fatura ' + ct.nome,
      valor: total, tipo: 'transf',
      pessoaId: ct.donoId || '', alvo: 'conta:' + contaId, pago: true,
      nota: 'Pagamento da fatura de ' + mesVisivel
    }));
  }

  salvarDB(); fecharModal(); desenhar();
  toast('Fatura paga. ' + fmt(total) + ' saiu de ' + conta(contaId).nome + '.');
}

function blocoParceladas(){
  const abertas = DB.compras.filter(function(c){
    return DB.lancamentos.some(function(l){ return l.compraId === c.id && !l.pago; });
  });

  return '<div class="card">'
  + '<h2>Compras parceladas'
  + '<span class="aux" onclick="cadastrarParcelada()">+ Já em andamento</span></h2>'
  + (abertas.length
    ? abertas.map(function(c){
        const parcelas = DB.lancamentos.filter(function(l){ return l.compraId === c.id; });
        const pagas = parcelas.filter(function(l){ return l.pago; }).length + (c.jaPagas||0);
        const falta = parcelas.filter(function(l){ return !l.pago; })
                              .reduce(function(s,l){ return s + l.valor; }, 0);
        const ultima = parcelas.filter(function(l){ return !l.pago; })
                               .sort(function(a,b){ return (a.mesFatura||'').localeCompare(b.mesFatura||''); })
                               .slice(-1)[0];
        const ct = cartao(c.cartaoId);
        return '<div style="padding:13px 0;border-top:1px solid var(--borda)">'
          + '<div class="lin" style="align-items:baseline;flex-wrap:wrap">'
          +   '<div style="min-width:0"><p style="font-weight:500">' + esc(c.descricao) + '</p>'
          +   '<p class="pp fra">' + (ct?esc(ct.nome):'') + ' · comprado em '
          +   fmtDiaMes(c.dataCompra) + '</p></div>'
          +   '<div style="text-align:right"><p class="tab" style="font-weight:650">'
          +   $(c.total) + '</p><p class="pp fra tab">faltam ' + $(falta) + '</p></div>'
          + '</div>'
          + '<div class="trilho trilho-p" style="margin-top:9px"><div style="width:'
          + (pagas / c.parcelas * 100) + '%;background:' + (ct?ct.cor:'var(--ac)') + '"></div></div>'
          + '<p class="pp fra tab" style="margin-top:5px">' + pagas + ' de ' + c.parcelas
          + ' parcelas pagas'
          + (ultima ? ' · última em ' + nomeMes(ultima.mesFatura) : '') + '</p>'
          + '</div>';
      }).join('')
    : '<p class="ajuda">Nenhuma parcela em aberto. Bom lugar para estar.</p>')
  + '</div>';
}

/**
 * Cadastrar compra que começou ANTES do app existir.
