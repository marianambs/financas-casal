  if(semDestino){
    return '<div class="card" style="border:1px solid var(--ac)">'
      + '<h2>Antes de lançar</h2>'
      + '<p class="ajuda" style="margin-top:-8px">Cadastre pelo menos uma conta ou um '
      + 'cartão. É o que diz de onde o dinheiro sai.</p>'
      + '<button class="btn btn-1" style="margin-top:12px" onclick="irPara(\'contas\')">'
      + 'Ir para Contas & Cartões</button></div>';
  }

  return '<div class="card">'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
    +   '<button class="btn btn-1" onclick="formLancamento()">+ Lançar</button>'
    +   (DB.contas.length > 1
        ? '<button class="btn btn-2" onclick="transferirEntreContas()">'
          + '⇄ Transferir entre contas</button>'
        : '')
    +   (DB.cartoes.length
        ? '<button class="btn btn-2" onclick="irPara(\'cartoes\')">'
          + '▤ Faturas e parcelas</button>'
        : '')
    + '</div></div>';
}

/* ---------------------------------------------------------
   LANÇAR EM DETALHE

   A barra de frase é rápida para quem já sabe a frase. Ela não serve para
   DECIDIR: escolher a categoria olhando a lista, dizer se foi no crédito ou no
   débito, conferir a data antes de gravar. Este formulário é o caminho de quem
   quer ver o que está fazendo — e o único jeito de corrigir depois.
   --------------------------------------------------------- */

/* Corrigir não pode oferecer parcelamento: mudar 1× para 6× num lançamento que
   já existe é outra operação (a da tela de compras parceladas). */
let lancEditando = false;

/**
 * Conta e cartão no MESMO campo, separados por grupo. É assim que "foi no
 * crédito ou no débito?" vira uma escolha só, em vez de duas perguntas que
 * podem se contradizer.
 */
function seletorAlvo(id, atual){
  return '<select id="' + id + '" onchange="lancAlvoMudou()">'
    + (DB.contas.length
      ? '<optgroup label="Conta — débito, pix, dinheiro">'
        + DB.contas.map(function(c){
            return '<option value="conta:' + c.id + '"'
              + (atual === 'conta:' + c.id ? ' selected' : '') + '>'
              + esc(c.nome) + '</option>';
          }).join('') + '</optgroup>'
      : '')
    + (DB.cartoes.length
      ? '<optgroup label="Cartão — crédito">'
        + DB.cartoes.map(function(c){
            return '<option value="cartao:' + c.id + '"'
              + (atual === 'cartao:' + c.id ? ' selected' : '') + '>'
              + esc(c.nome) + '</option>';
          }).join('') + '</optgroup>'
      : '')
    + '</select>';
}

/** Sem argumento, e um lancamento novo. Com um lancamento, corrige aquele. */
function formLancamento(l){
  if(!DB.contas.length && !DB.cartoes.length){
    alert('Cadastre uma conta ou um cartão antes — é o que diz de onde o dinheiro sai.');
    return;
  }

  lancEditando = !!l;
  const tipo = l ? l.tipo : 'saida';
  const alvo = l ? l.alvo
             : (DB.contas.length ? 'conta:' + DB.contas[0].id
                                 : 'cartao:' + DB.cartoes[0].id);

  abrirModal(
    '<h2>' + (l ? 'Corrigir lançamento' : 'Novo lançamento') + '</h2>'

    + '<div class="campo"><label>É saída ou entrada</label>'
    + '<select id="lcTipo" onchange="lancTipoMudou()">'
    +   '<option value="saida"' + (tipo==='saida'?' selected':'') + '>Saída — gasto</option>'
    +   '<option value="entrada"' + (tipo==='entrada'?' selected':'') + '>Entrada — recebimento</option>'
    + '</select></div>'

    + '<div class="grade g2" style="gap:12px">'
    +   '<div class="campo"><label>Valor</label>'
    +   '<input id="lcValor" inputmode="decimal" placeholder="0,00" value="'
    +   (l ? fmtSimples(l.valor) : '') + '"></div>'
    +   '<div class="campo"><label>Data</label>'
    +   '<input id="lcData" type="date" onchange="lancAlvoMudou()" value="'
    +   (l ? l.data : hojeISO()) + '"></div>'
    + '</div>'

    + '<div class="campo"><label>Descrição</label>'
    + '<input id="lcDesc" placeholder="Mercado, gasolina, salário…" value="'
    + (l ? esc(l.descricao) : '') + '"></div>'

    + '<div class="campo"><label id="lcAlvoRot">Pagou com</label>'
    + seletorAlvo('lcAlvo', alvo) + '</div>'

    + '<div class="campo" id="lcParcelasBox" style="display:none">'
    +   '<label>Em quantas vezes</label>'
    +   '<input id="lcParcelas" type="number" min="1" max="60" value="1" '
    +   'oninput="lancAlvoMudou()">'
    +   '<p class="ajuda">1 é à vista. Acima disso o app cria uma parcela por '
    +   'fatura, cada uma no mês dela.</p></div>'

    + '<div class="campo"><label>Categoria</label><span id="lcCatBox"></span></div>'

    + seletorDono('lcPessoa', l ? (l.pessoaId || '') : quemEstaUsando(), 'De quem')

    + '<div class="campo" id="lcPagoBox"><label>Situação</label>'
    + '<select id="lcPago">'
    +   '<option value="1">Já saiu da conta</option>'
    +   '<option value="0">Ainda vai acontecer — previsto</option>'
    + '</select></div>'

    + '<p class="ajuda" id="lcAviso" style="min-height:20px"></p>'

    + '<div class="modal-acoes">'
    + '<button class="btn btn-2" onclick="fecharModal()">Cancelar</button>'
    + '<button class="btn btn-1" onclick="salvarLancamento('
    + (l ? "'" + l.id + "'" : '') + ')">' + (l ? 'Salvar' : 'Lançar') + '</button></div>');

  lancCategorias(l ? (l.categoriaId || '') : '');
  const sit = document.getElementById('lcPago');
  if(sit) sit.value = (l ? (l.pago ? '1' : '0') : '1');
  lancAlvoMudou();
}

/* A lista de categorias muda com o tipo: categoria de gasto não serve para
   recebimento, e misturar as duas é o começo do relatório errado. */
function lancCategorias(atual){
  const box = document.getElementById('lcCatBox');
  if(!box) return;
  const tipo = v('lcTipo') || 'saida';
  box.innerHTML = '<select id="lcCat">'
    + '<option value="">Sem categoria</option>'
    + DB.categorias.filter(function(c){ return c.tipo === tipo; })
        .map(function(c){
          return '<option value="' + c.id + '"' + (c.id === atual ? ' selected' : '') + '>'
            + c.icone + ' ' + esc(c.nome) + '</option>';
        }).join('')
    + '</select>';
}

function lancTipoMudou(){
  lancCategorias(v('lcCat'));   /* mantém a escolha se ela existir no novo tipo */
  lancAlvoMudou();
}

/* Ajusta a tela ao que foi escolhido. */
function lancAlvoMudou(){
  const alvo = v('lcAlvo');
  const tipo = v('lcTipo') || 'saida';
  const noCartao = alvoEhCartao(alvo);

  const rot   = document.getElementById('lcAlvoRot');
  const parc  = document.getElementById('lcParcelasBox');
  const sit   = document.getElementById('lcPagoBox');
  const aviso = document.getElementById('lcAviso');

  if(rot) rot.textContent = (tipo === 'entrada') ? 'Entrou em' : 'Pagou com';

  /* Parcelar só existe em compra NOVA no cartão. */
  if(parc) parc.style.display = (noCartao && tipo === 'saida' && !lancEditando) ? '' : 'none';

  /* No cartão a situação não é escolha: a compra vira "paga" quando a fatura é
     paga. Deixar o campo aberto ali seria oferecer uma mentira. */
  if(sit) sit.style.display = noCartao ? 'none' : '';

  if(!aviso) return;
  if(!noCartao){ aviso.textContent = ''; return; }

  const ct = cartao(idDoAlvo(alvo));
  if(!ct){ aviso.textContent = ''; return; }
  const mes = faturaDaCompra(v('lcData') || hojeISO(), ct.diaFechamento, ct.diaVencimento);
  const n = Math.max(1, Number(v('lcParcelas')) || 1);

  aviso.innerHTML = 'Cai na <b>fatura de ' + nomeMes(mes) + '</b> — é nesse mês que '
    + 'vai contar no orçamento.'
    + (n > 1 && !lancEditando
        ? ' A última parcela cai em <b>' + nomeMes(mesMais(mes, n - 1)) + '</b>.'
        : ' Vira "pago" quando a fatura for paga.');
}

function salvarLancamento(id){
  const tipo  = (v('lcTipo') === 'entrada') ? 'entrada' : 'saida';
  const valor = lerDinheiro(v('lcValor'));
  const desc  = (v('lcDesc') || '').trim();
  const data  = v('lcData') || hojeISO();
  const alvo  = v('lcAlvo');
  const cat   = v('lcCat') || '';
  const quem  = v('lcPessoa') || '';
  const parcelas = Math.max(1, Number(v('lcParcelas')) || 1);

  if(!valor || valor <= 0){ alert('Valor inválido.'); return; }
  if(!desc){ alert('Descreva o lançamento.'); return; }
  if(!alvo){ alert('Escolha a conta ou o cartão.'); return; }

  const noCartao = alvoEhCartao(alvo);
  const pago = noCartao ? false : (v('lcPago') !== '0');

  /* ---- corrigir um que já existe ---- */
  if(id){
    const l = DB.lancamentos.filter(function(x){ return x.id === id; })[0];
    if(!l){ alert('Lançamento não encontrado.'); return; }

    const mesAntes = l.mesFatura;
    l.tipo = tipo; l.valor = valor; l.descricao = desc; l.data = data;
    l.alvo = alvo; l.categoriaId = cat; l.pessoaId = quem;

    /* Zerar antes de recarimbar é obrigatório: carimbarCompetencia respeita o
       mesFatura que já veio pronto (é o que protege as parcelas), então mudar
       a data ou o cartão não teria efeito nenhum sem esta linha. */
    l.mesFatura = '';
    carimbarCompetencia(l);

    /* Mudou de fatura estando marcada como paga? Volta a não paga — a fatura
       nova não foi paga. Mesma regra da correção de compra parcelada. */
    if(noCartao) l.pago = (mesAntes === l.mesFatura) ? l.pago : false;
    else         l.pago = pago;

    /* Trocar o alvo de volta para um cartão desfaz o adiantamento: a marca não
       pode sobreviver, senão a linha continuaria dizendo "adiantada" sobre uma
       parcela que voltou para a fatura. */
    if(noCartao){ delete l.adiantadoDe; delete l.faturaOriginal; }

    salvarDB(); fecharModal(); desenhar();
    toast('Lançamento corrigido.');
    return;
  }

  /* ---- novo, parcelado ---- */
  if(noCartao && tipo === 'saida' && parcelas > 1){
    gravarParcelado({
      cartaoId: idDoAlvo(alvo), total: valor, parcelas: parcelas,
      descricao: desc, data: data, categoriaId: cat, pessoaId: quem, jaPagas: 0
    });
    salvarDB(); fecharModal(); desenhar();
    toast(parcelas + '× · ' + desc);
    return;
  }

  /* ---- novo, à vista ---- */
  DB.lancamentos.push(novoLancamento({
    data: data, descricao: desc, valor: valor, tipo: tipo,
    pessoaId: quem, categoriaId: cat, alvo: alvo, pago: pago
  }));
  salvarDB(); fecharModal(); desenhar();
  toast(desc + ' · ' + fmt(valor));
}

/**
 * O ✎ de cada linha. Cada tipo de lançamento tem o seu editor certo, e mandar
 * todos para o formulário comum quebraria os que são feitos de vários
 * registros amarrados.
 */
function editarLancamento(id){
  const l = DB.lancamentos.filter(function(x){ return x.id === id; })[0];
  if(!l) return;

  if(l.compraId)        { editarParcelada(l.compraId); return; }
  if(l.transferenciaId) { transferirEntreContas(l.transferenciaId); return; }
  if(l.faturaCartaoId)  {
    alert('Este é o pagamento de uma fatura.\n\n'
        + 'Para mudar o valor, exclua este pagamento e lance de novo pelo '
        + 'botão "Pagar fatura" — assim a fatura volta a contar certo.');
    return;
  }
  formLancamento(l);
}

/* ---------------------------------------------------------
   TRANSFERIR ENTRE CONTAS

   Tirar do Itaú e pôr no Nubank não é gasto nem receita — é o mesmo dinheiro
   mudando de lugar. Por isso vira um PAR de lançamentos do tipo transferência,
   que mexem nos dois saldos mas ficam de fora do "entrou" e do "saiu" do mês.
   Sem isso, uma transferência de R$ 500 apareceria como R$ 500 de gasto e
   R$ 500 de receita, inventando movimento que não existiu.
   --------------------------------------------------------- */
/** Sem argumento, é uma transferência nova. Com o par, corrige aquela. */
function transferirEntreContas(parId){
  if(DB.contas.length < 2){
    alert('Você precisa de pelo menos duas contas cadastradas.');
    return;
  }

  /* Os dois lados da transferência que está sendo corrigida. */
  const lados   = parId
    ? DB.lancamentos.filter(function(l){ return l.transferenciaId === parId; })
    : [];
  const saida   = lados.filter(function(l){ return l.tipo === 'transf'; })[0];
  const entrada = lados.filter(function(l){ return l.tipo === 'transf_entra'; })[0];
  const corrigindo = !!(saida && entrada);

  const deAtual   = corrigindo ? idDoAlvo(saida.alvo)   : '';
  const paraAtual = corrigindo ? idDoAlvo(entrada.alvo) : '';

  abrirModal(
    '<h2>' + (corrigindo ? 'Corrigir transferência' : 'Transferir entre contas') + '</h2>'
    + '<div class="campo"><label>Sai de</label>'
    + '<select id="trDe" onchange="trAtualizarPara()">'
    + DB.contas.map(function(c){
        return '<option value="' + c.id + '"' + (c.id === deAtual ? ' selected' : '') + '>'
             + esc(c.nome) + ' · ' + fmt(saldoDaConta(c.id)) + '</option>';
      }).join('')
    + '</select></div>'
    + '<div class="campo"><label>Entra em</label>'
    + '<select id="trPara"></select></div>'
    + '<div class="grade g2" style="gap:12px">'
    +   '<div class="campo"><label>Valor</label>'
    +   '<input id="trValor" inputmode="decimal" placeholder="0,00" value="'
    +   (corrigindo ? fmtSimples(saida.valor) : '') + '"></div>'
    +   '<div class="campo"><label>Data</label>'
    +   '<input id="trData" type="date" value="'
    +   (corrigindo ? saida.data : hojeISO()) + '"></div>'
    + '</div>'
    + '<div class="campo"><label>Observação <span class="fra">(opcional)</span></label>'
    + '<input id="trNota" placeholder="Ex.: guardei para pagar a fatura" value="'
    + (corrigindo ? esc(saida.nota || '') : '') + '"></div>'
    + '<p class="ajuda">Isto <b>não</b> conta como gasto nem como receita do mês — é o '
    + 'mesmo dinheiro mudando de lugar. Só os saldos das duas contas mudam.</p>'
    + '<div class="modal-acoes">'
    + '<button class="btn btn-2" onclick="fecharModal()">Cancelar</button>'
    + '<button class="btn btn-1" onclick="salvarTransferencia('
    + (corrigindo ? "'" + parId + "'" : '') + ')">'
    + (corrigindo ? 'Salvar' : 'Transferir') + '</button></div>');

  trAtualizarPara();
  /* Depois de montar o "entra em": o valor guardado só pode ser escolhido
     quando a opção já existe na lista. */
  const para = document.getElementById('trPara');
  if(corrigindo && para) para.value = paraAtual;
}

/* A conta de destino nunca pode ser a mesma da origem. */
function trAtualizarPara(){
  const de = v('trDe');
  const para = document.getElementById('trPara');
  if(!para) return;
  const anterior = para.value;
  para.innerHTML = DB.contas.filter(function(c){ return c.id !== de; })
    .map(function(c){
      return '<option value="' + c.id + '"' + (c.id === anterior ? ' selected' : '') + '>'
           + esc(c.nome) + ' · ' + fmt(saldoDaConta(c.id)) + '</option>';
    }).join('');
}

function salvarTransferencia(parId){
  const de = v('trDe'), para = v('trPara');
  const valor = lerDinheiro(v('trValor'));
  const data = v('trData') || hojeISO();
  const nota = (v('trNota') || '').trim();

  if(!valor || valor <= 0){ alert('Valor inválido.'); return; }
  if(de === para){ alert('Escolha duas contas diferentes.'); return; }

  const cDe = conta(de), cPara = conta(para);
  if(!cDe || !cPara){ alert('Conta não encontrada.'); return; }

  /* ---- corrigir uma que já existe ---- */
  if(parId){
    const lados = DB.lancamentos.filter(function(l){ return l.transferenciaId === parId; });
    const saida   = lados.filter(function(l){ return l.tipo === 'transf'; })[0];
    const entrada = lados.filter(function(l){ return l.tipo === 'transf_entra'; })[0];
    if(!saida || !entrada){ alert('Transferência não encontrada.'); return; }

    /* Os dois lados são corrigidos NO LUGAR, mantendo os ids: para a
       sincronização isto é "os dois mudaram", e não "sumiram dois e nasceram
       dois". Mesma razão da correção de compra parcelada. */
    saida.alvo = 'conta:' + de;   saida.descricao   = 'Para ' + cPara.nome;
    entrada.alvo = 'conta:' + para; entrada.descricao = 'De ' + cDe.nome;
    [saida, entrada].forEach(function(l){
      l.valor = valor; l.data = data; l.nota = nota;
      l.mesFatura = '';
      carimbarCompetencia(l);
    });

    salvarDB(); fecharModal(); desenhar();
    toast('Transferência corrigida.');
    return;
  }

  /* ---- nova ---- */
  const saldo = saldoDaConta(de);
  if(valor > saldo){
    if(!confirm('A conta ' + cDe.nome + ' tem ' + fmt(saldo) + ' e você está tirando '
              + fmt(valor) + '.\n\nO saldo dela vai ficar negativo. Continuar?')) return;
  }

  /* O par carrega o mesmo transferenciaId: é o que permite apagar os dois
     juntos. Apagar só um lado deixaria dinheiro aparecendo ou sumindo do nada. */
  const par = uid();

  DB.lancamentos.push(novoLancamento({
    data: data, descricao: 'Para ' + cPara.nome, valor: valor, tipo: 'transf',
    pessoaId: quemEstaUsando() || '', alvo: 'conta:' + de, pago: true,
    transferenciaId: par, nota: nota
  }));
  DB.lancamentos.push(novoLancamento({
    data: data, descricao: 'De ' + cDe.nome, valor: valor, tipo: 'transf_entra',
    pessoaId: quemEstaUsando() || '', alvo: 'conta:' + para, pago: true,
    transferenciaId: par, nota: nota
  }));

  salvarDB(); fecharModal(); desenhar();
  toast(fmt(valor) + ' de ' + cDe.nome + ' para ' + cPara.nome + '.');
}

/* ---------------------------------------------------------
   TELA DE LANÇAMENTOS
   --------------------------------------------------------- */
let filtroPessoa = '';

function lancamentosDoMes(ym){
  return DB.lancamentos
    .filter(function(l){ return (l.mesComp || mesDe(l.data)) === ym; })
    .filter(function(l){ return !filtroPessoa || l.pessoaId === filtroPessoa; })
    .sort(function(a,b){ return (b.data||'').localeCompare(a.data||''); });
}

function desenharLancamentos(){
  const c = document.getElementById('content');
  const lista = lancamentosDoMes(mesVisivel);

  let entrou = 0, saiu = 0;
  lista.forEach(function(l){
    if(l.tipo === 'entrada') entrou += l.valor;
    else if(l.tipo === 'saida') saiu += l.valor;
  });

  /* Agrupa por dia: lista corrida de 60 linhas é ilegível. */
  const dias = [];
  const porDia = {};
  lista.forEach(function(l){
    if(!porDia[l.data]){ porDia[l.data] = []; dias.push(l.data); }
    porDia[l.data].push(l);
  });

  c.innerHTML =
    barraRapida()
  + navegadorDeMes()

  + '<div class="grade g3">'
  +   '<div class="card"><p class="p mut">Entrou</p>'
  +     '<p class="n-s tab pos">' + $(entrou) + '</p></div>'
  +   '<div class="card"><p class="p mut">Saiu</p>'
  +     '<p class="n-s tab neg">' + $(saiu) + '</p></div>'
  +   '<div class="card"><p class="p mut">Diferença</p>'
  +     '<p class="n-s tab ' + (entrou-saiu >= 0 ? 'pos':'neg') + '">' + $(entrou-saiu) + '</p></div>'
  + '</div>'

  + (temVariasPessoas() ? filtroDePessoa() : '')

  + (lista.length
    ? dias.map(function(d){
        const doDia = porDia[d];
        const soma = doDia.reduce(function(s,l){
          return s + (l.tipo==='entrada' ? l.valor : (l.tipo==='saida' ? -l.valor : 0));
        }, 0);
        return '<div style="margin-bottom:18px">'
          + '<div class="lin" style="padding:0 4px 8px">'
          +   '<span class="p" style="font-weight:650;color:var(--mut)">' + fmtDiaMes(d) + '</span>'
          +   '<span class="p tab ' + (soma>=0?'pos':'fra') + '">'
          +   (soma>=0?'+':'') + $(soma) + '</span>'
          + '</div>'
          + '<div class="card" style="padding:6px 16px">'
          + doDia.map(linhaLancamento).join('')
          + '</div></div>';
      }).join('')
    : '<div class="card vazio">Nenhum lançamento em ' + nomeMes(mesVisivel) + '.<br>'
      + '<span class="p">Escreva na barra lá em cima, ou use '
      + '<b>Lançar em detalhe</b> para escolher campo a campo.</span></div>');
}

function filtroDePessoa(){
  const opcoes = [{id:'', nome:'Todos', emoji:''}].concat(DB.pessoas);
  return '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">'
    + opcoes.map(function(p){
        const on = filtroPessoa === p.id;
        return '<button class="chip' + (on?' chip-ac':'') + '" '
          + 'style="border:none;cursor:pointer;font-family:inherit;padding:9px 16px;font-size:14px'
          + (on?';background:var(--ac);color:#fff':'') + '" '
          + 'onclick="filtroPessoa=\'' + p.id + '\'; desenhar()">'
          + (p.emoji ? p.emoji + ' ' : '') + esc(p.nome) + '</button>';
      }).join('')
    + '</div>';
}

function linhaLancamento(l){
  const cat = categoria(l.categoriaId);
  const p   = pessoa(l.pessoaId);
  const transf = l.tipo === 'transf' || l.tipo === 'transf_entra';
  const cor = transf ? '#94a3b8' : (cat ? cat.cor : '#94a3b8');
  const ic  = transf ? '⇄' : (cat ? cat.icone : '•');

  const sinal = l.tipo === 'entrada' ? '+' : (transf ? '' : '−');
  const corValor = l.tipo === 'entrada' ? 'var(--pos)'
                 : (transf ? 'var(--mut)' : 'var(--txt)');

  return '<div style="display:flex;align-items:center;gap:12px;padding:11px 0;'
    + 'border-top:1px solid var(--borda)">'
    + '<span class="ic-t" style="background:' + cor + '1f">' + ic + '</span>'
    + '<div style="min-width:0;flex:1">'
    +   '<p style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
    +   esc(l.descricao) + '</p>'
    +   '<p class="pp fra">'
    +   esc(transf ? 'Transferência' : (cat ? cat.nome : 'Sem categoria'))
    +   (l.alvo ? ' · ' + esc(nomeAlvo(l.alvo)) : '')
    +   (l.adiantadoDe ? ' · adiantada da fatura de ' + nomeMes(l.faturaOriginal) : '')
    +   (p ? ' · ' + p.emoji + ' ' + esc(p.nome) : '')
    +   '</p>'
    + '</div>'
    + (!l.pago ? '<span class="chip chip-ala">previsto</span>' : '')
    + '<span class="tab" style="font-weight:650;color:' + corValor + ';white-space:nowrap">'
    +   sinal + $(l.valor) + '</span>'
    + '<div style="display:flex;gap:2px;flex:none">'
    +   '<button class="btn btn-2 btn-p" style="border:none;padding:0 8px" '
    +   'onclick="editarLancamento(\'' + l.id + '\')" title="Corrigir">✎</button>'
    +   '<button class="btn btn-2 btn-p" style="border:none;padding:0 8px" '
    +   'onclick="alternarPago(\'' + l.id + '\')" title="' + (l.pago?'Marcar como previsto':'Marcar como pago') + '">'
    +   (l.pago ? '↺' : '✓') + '</button>'
    +   '<button class="btn btn-x btn-p" style="padding:0 8px" '
    +   'onclick="excluirLancamento(\'' + l.id + '\')" title="Excluir">×</button>'
    + '</div>'
    + '</div>';
}

/* Navegação de mês, usada por Painel, Lançamentos e Cartões. */
function navegadorDeMes(){
  return '<div class="lin" style="margin-bottom:18px">'
    + '<button class="btn btn-2" onclick="mudarMes(-1)" aria-label="Mês anterior">‹</button>'
    + '<span style="font-weight:650;font-size:17px;text-align:center;flex:1">'
    + nomeMes(mesVisivel) + '</span>'
    + '<button class="btn btn-2" onclick="mudarMes(1)" aria-label="Próximo mês">›</button>'
    + '</div>';
}
function mudarMes(n){ mesVisivel = mesMais(mesVisivel, n); desenhar(); }
/* =========================================================
   PAINEL — a visão do mês, com o saldo em cima de tudo

   As contas ficam todas aqui, num lugar só, para nenhuma tela recalcular
   dinheiro por conta própria. Ver as regras 3, 6, 7 e 8 do CLAUDE.md.
   ========================================================= */

/* ---------------------------------------------------------
   CÁLCULO
   --------------------------------------------------------- */

/* Movimentação interna: muda o dinheiro de lugar sem ser receita nem gasto.
   Pagar fatura e guardar numa meta entram aqui — a despesa já foi contada
   quando a compra aconteceu, e contar de novo dobraria o mês (regra 6). */
function ehTransferencia(tipo){ return tipo === 'transf' || tipo === 'transf_entra'; }

/* Saldo de uma conta: inicial + entradas efetivadas − saídas efetivadas.
   Lançamento previsto não entra (ainda não mexeu no dinheiro), e lançamento de
   cartão também não — ele só mexe quando a fatura é paga (regra 8). */
function saldoDaConta(contaId){
  const c = conta(contaId);
  if(!c) return 0;
  let s = c.saldoInicial || 0;
  DB.lancamentos.forEach(function(l){
    if(!l.pago || l.alvo !== 'conta:' + contaId) return;
    if(l.tipo === 'entrada' || l.tipo === 'transf_entra') s += l.valor;
    else s -= l.valor;
  });
  return s;
}

function caixaTotal(){
  return DB.contas.reduce(function(s,c){ return s + saldoDaConta(c.id); }, 0);
}

/* Fatura de um cartão num mês: tudo que caiu naquela fatura. */
function faturaDoMes(cartaoId, ym){
  return DB.lancamentos
    .filter(function(l){ return l.alvo === 'cartao:' + cartaoId && l.mesFatura === ym; })
    .reduce(function(s,l){ return s + (l.tipo==='entrada' ? -l.valor : l.valor); }, 0);
}
/* Quanto já foi pago POR CIMA de uma fatura específica.

   Pagamento parcial existe: dá para pagar R$ 400 de uma fatura de R$ 1.000 e
   deixar o resto. Enquanto a fatura não fecha por inteiro, as compras dela
   continuam marcadas como NÃO pagas — marcar algumas seria escolher quais no
   chute. Quem sabe o quanto foi abatido são estes registros de pagamento. */
function pagoDaFatura(cartaoId, ym){
  return DB.lancamentos
    .filter(function(l){ return l.faturaCartaoId === cartaoId && l.faturaMes === ym; })
    .reduce(function(s,l){ return s + l.valor; }, 0);
}

/* O que ainda falta pagar de uma fatura. Zero quando já foi quitada. */
function faltaDaFatura(cartaoId, ym){
  const emAberto = DB.lancamentos
    .filter(function(l){
      return l.alvo === 'cartao:' + cartaoId && l.mesFatura === ym && !l.pago;
    })
    .reduce(function(s,l){ return s + (l.tipo==='entrada' ? -l.valor : l.valor); }, 0);
  return Math.max(0, emAberto - pagoDaFatura(cartaoId, ym));
}

/* Meses de fatura com algo em aberto, do mais antigo para o mais novo.
   Os vencidos entram: pagar em setembro a fatura de agosto é o normal. */
function faturasEmAberto(cartaoId){
  const meses = {};
  DB.lancamentos.forEach(function(l){
    if(l.alvo === 'cartao:' + cartaoId && l.mesFatura && !l.pago) meses[l.mesFatura] = true;
  });
  return Object.keys(meses)
    .filter(function(ym){ return faltaDaFatura(cartaoId, ym) > 0; })
    .sort();
}

/* Tudo que ainda vai virar fatura: a dívida real do cartão. */
function dividaDoCartao(cartaoId, aPartirDe){
  /* Mês a mês, e não tudo somado de uma vez. Com pagamento parcial, o que foi
     abatido vale só para a fatura que foi paga — somando tudo junto, um
     adiantamento de agosto abateria dívida de dezembro. */
  const meses = {};
  DB.lancamentos.forEach(function(l){
    if(l.alvo === 'cartao:' + cartaoId && l.mesFatura >= aPartirDe && !l.pago){
      meses[l.mesFatura] = true;
    }
  });
  return Object.keys(meses).reduce(function(s, ym){
    return s + faltaDaFatura(cartaoId, ym);
  }, 0);
}

/* O resumo de um mês. `ym` é o mês de COMPETÊNCIA, não o da data. */
function resumoDoMes(ym){
  const r = {entrou:0, saiu:0, previsto:0, porCategoria:{}, porPessoa:{}, porGrupo:{}};

  DB.lancamentos.forEach(function(l){
    if((l.mesComp || mesDe(l.data)) !== ym) return;
    if(ehTransferencia(l.tipo)) return;

    if(l.tipo === 'entrada'){
      r.entrou += l.valor;
      const k = l.pessoaId || '';
      r.porPessoa[k] = r.porPessoa[k] || {saiu:0, entrou:0};
      r.porPessoa[k].entrou += l.valor;
      return;
    }

    r.saiu += l.valor;
    if(!l.pago) r.previsto += l.valor;

    const k = l.pessoaId || '';
    r.porPessoa[k] = r.porPessoa[k] || {saiu:0, entrou:0};
    r.porPessoa[k].saiu += l.valor;

    const cid = l.categoriaId || '';
    r.porCategoria[cid] = r.porCategoria[cid] || {total:0, deFaturaFechada:0};
    r.porCategoria[cid].total += l.valor;
    /* Parte que veio de compra no crédito de mês anterior. É o que o Maycon
       pediu para ficar visível: o mês já nasce com parte do teto comprometida. */
    if(l.mesFatura && mesDe(l.data) < ym){
      r.porCategoria[cid].deFaturaFechada += l.valor;
    }

    const cat = categoria(cid);
    const g = cat ? cat.grupo : 'superfluo';
    r.porGrupo[g] = (r.porGrupo[g] || 0) + l.valor;
  });

  return r;
}

/* Patrimônio: dinheiro nas contas + o que já foi guardado nas metas.
   Guardar sai do caixa disponível mas continua sendo da casa — mostrar só o
   saldo faria parecer que poupar empobrece (regra 8). */
function patrimonio(){
  let reserva = 0, guardado = 0, doMes = 0;
  const ym = mesVisivel;

  DB.metas.forEach(function(m){
    const soma = DB.aportes
      .filter(function(a){ return a.metaId === m.id; })
      .reduce(function(s,a){ return s + a.valor; }, 0);
    if(m.tipo === 'reserva') reserva += soma; else guardado += soma;
  });
  DB.aportes.forEach(function(a){ if(mesDe(a.data) === ym) doMes += a.valor; });

  const caixa = caixaTotal();
  return {caixa: caixa, reserva: reserva, guardado: guardado,
          total: caixa + reserva + guardado, doMes: doMes};
}

/**
 * Projeção dos próximos meses — "quanto vamos ter no fim do mês que vem".
 * Junta o caixa de hoje, os lançamentos já gravados com data futura (inclui as
 * parcelas) e as contas fixas que ainda não viraram lançamento naquele mês.
 * Uma recorrente só é somada se NÃO existir lançamento dela no mês, senão
 * contaria duas vezes.
 */
function projecao(meses){
  meses = meses || 12;
  const linhas = [];
  let acumulado = caixaTotal();

  for(let i=0;i<meses;i++){
    const ym = mesMais(mesAtual(), i);
    const linha = {mes: ym, entra:0, sai:0, parcelas:0, fixas:0, liquido:0, saldo:0};
    const jaTem = {};

    DB.lancamentos.forEach(function(l){
      if((l.mesComp || mesDe(l.data)) !== ym) return;
      if(ehTransferencia(l.tipo)) return;
      if(l.recorrenteId) jaTem[l.recorrenteId] = true;

      if(l.tipo === 'entrada') linha.entra += l.valor;
      else {
        linha.sai += l.valor;
        if(l.compraId) linha.parcelas += l.valor;
        else if(l.recorrenteId) linha.fixas += l.valor;
      }
    });

    DB.recorrentes.forEach(function(rc){
      if(!rc.ativo || jaTem[rc.id]) return;
      const quando = diaDoMes(ym, rc.dia);
      if(rc.inicio && quando < rc.inicio) return;
      if(rc.fim && quando > rc.fim) return;
      if(rc.tipo === 'entrada') linha.entra += rc.valor;
      else { linha.sai += rc.valor; linha.fixas += rc.valor; }
    });

    linha.liquido = linha.entra - linha.sai;
    acumulado += linha.liquido;
    linha.saldo = acumulado;
    linhas.push(linha);
  }
  return linhas;
}

/* ---------------------------------------------------------
   DESENHO
   --------------------------------------------------------- */
const GRUPO_ROTULO = {essencial:'Essencial', superfluo:'Supérfluo',
                      divida:'Dívida', investimento:'Investimento', receita:'Receita'};

/* O painel mostra só o mês atual, de propósito (pedido do Maycon, 02/09/2026):
   a projeção de 12 meses morava aqui e assustava com saldo negativo sempre que
   uma parcela nova entrava sem o salário estar cadastrado como conta fixa —
   informação real, mas fora de lugar numa tela que deveria responder "como
   estou agora". Quem quiser ver o mês a mês entra em Planejamento por
   escolha, já sabendo o que a projeção soma e o que ela ainda não sabe. */
function desenharPainel(){
  const c = document.getElementById('content');
  const r = resumoDoMes(mesVisivel);
  const pat = patrimonio();

  const faturasAbertas = DB.cartoes.reduce(function(s,ct){
    const f = faturaDoMes(ct.id, mesVisivel);
    const paga = DB.lancamentos.some(function(l){
      return l.alvo === 'cartao:' + ct.id && l.mesFatura === mesVisivel && l.pago;
    });
    return s + (paga ? 0 : f);
  }, 0);

  const disponivel = pat.caixa - faturasAbertas - r.previsto;

  c.innerHTML =
    barraRapida()
  + navegadorDeMes()
  + heroiSaldo(pat.caixa, disponivel, faturasAbertas, r.previsto)
  + primeirosPassos()
  + (pat.total > pat.caixa ? cartaoPatrimonio(pat) : '')
  + cartaoDoMes(r)
  + (DB.cartoes.length ? cartaoCartoesResumo() : '');
}

function heroiSaldo(caixa, disponivel, faturas, previsto){
  const explica = (faturas || previsto)
    ? 'Depois de pagar ' + (faturas ? 'as faturas' : '')
      + (faturas && previsto ? ' e ' : '')
      + (previsto ? 'as contas previstas' : '')
      + ' deste mês, sobram <b class="tab">' + $(disponivel) + '</b>.'
    : 'Nenhuma fatura ou conta em aberto — esse valor está todo livre.';

  return '<div class="heroi">'
    + '<div class="rot">Vocês têm agora</div>'
    + '<div class="n-g tab" style="margin-top:6px">' + $(caixa) + '</div>'
    + '<div class="sub">' + explica + '</div>'
    + (DB.contas.length
      ? '<div class="bolsos">' + DB.contas.map(function(ct){
          const dono = pessoa(ct.donoId);
          return '<div class="bolso">'
            + '<div style="font-size:12px;opacity:.88">' + esc(ct.nome)
            + (dono ? ' · ' + esc(dono.nome) : '') + '</div>'
            + '<div style="font-size:16px;font-weight:650;margin-top:1px" class="tab">'
            + $(saldoDaConta(ct.id)) + '</div></div>';
        }).join('') + '</div>'
      : '')
    + '</div>';
}

/* Só aparece enquanto falta configurar. Some sozinho quando tudo está pronto. */
function primeirosPassos(){
  const passos = [
    {ok: DB.contas.length > 0,  txt:'Cadastrar as contas', destino:'contas',
     det:'Com o saldo de hoje em cada uma. É a base do número lá em cima.'},
    {ok: DB.cartoes.length > 0, txt:'Cadastrar os cartões', destino:'contas',
     det:'Com o dia de fechamento e o de vencimento — é o que põe cada parcela na fatura certa.'},
    {ok: DB.lancamentos.length > 0, txt:'Fazer o primeiro lançamento', destino:'',
     det:'Pelo botão "+ Lançar", ali em cima.'}
  ];
  if(passos.every(function(p){ return p.ok; })) return '';

  return '<div class="card" style="border:1px solid var(--ac)">'
    + '<h2>Primeiros passos</h2>'
    + passos.map(function(p){
        return '<div style="display:flex;gap:12px;align-items:flex-start;padding:8px 0">'
          + '<span style="margin-top:3px;width:18px;height:18px;border-radius:999px;flex:none;'
          + 'display:grid;place-items:center;font-size:11px;color:#fff;'
          + 'border:2px solid ' + (p.ok?'var(--pos)':'var(--borda2)') + ';'
          + 'background:' + (p.ok?'var(--pos)':'transparent') + '">' + (p.ok?'✓':'') + '</span>'
          + '<div style="flex:1;min-width:0">'
          + '<p style="font-weight:500;color:' + (p.ok?'var(--fra)':'var(--txt)') + '">'
          + (p.ok ? '<s>' + p.txt + '</s>' : p.txt) + '</p>'
          + (p.ok ? '' : '<p class="ajuda" style="margin-top:2px">' + p.det + '</p>')
          + '</div>'
          + (p.ok ? '' : '<button class="btn btn-2 btn-p" onclick="'
            + (p.destino ? 'irPara(\'' + p.destino + '\')' : 'formLancamento()') + '">Ir</button>')
          + '</div>';
      }).join('')
    + '</div>';
}

function cartaoPatrimonio(pat){
  const partes = [
    {nome:'Em conta',  v:pat.caixa,    cor:'var(--ac)'},
    {nome:'Reserva',   v:pat.reserva,  cor:'var(--pos)'},
    {nome:'Guardado',  v:pat.guardado, cor:'var(--inv)'}
  ].filter(function(p){ return p.v > 0; });
  const total = partes.reduce(function(s,p){ return s + p.v; }, 0) || 1;

  return '<div class="card">'
    + '<h2>Patrimônio<span class="aux" onclick="irPara(\'investimentos\')">Detalhar</span></h2>'
    + '<p class="n-m tab">' + $(pat.total) + '</p>'
    + '<p class="ajuda">Tudo que é de vocês: dinheiro em conta mais o que já foi guardado.'
    + (pat.doMes ? ' <b class="' + (pat.doMes>0?'pos':'neg') + '">'
                 + (pat.doMes>0?'+':'') + $(pat.doMes) + '</b> neste mês.' : '') + '</p>'
    + '<div style="display:flex;height:14px;border-radius:999px;overflow:hidden;margin-top:16px">'
    + partes.map(function(p){
        return '<div style="width:' + (p.v/total*100) + '%;background:' + p.cor + '" '
             + 'title="' + esc(p.nome) + '"></div>';
      }).join('')
    + '</div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px">'
    + partes.map(function(p){
        return '<div style="display:flex;align-items:center;gap:7px" class="p">'
          + '<span style="width:10px;height:10px;border-radius:999px;background:' + p.cor + '"></span>'
          + '<span class="mut">' + p.nome + '</span>'
          + '<b class="tab">' + $(p.v) + '</b></div>';
      }).join('')
    + '</div></div>';
}

function cartaoDoMes(r){
  const sobra = r.entrou - r.saiu;

  /* Categorias do mês, maior primeiro. */
  const cats = Object.keys(r.porCategoria).map(function(id){
    const cat = categoria(id);
    const d = r.porCategoria[id];
    return {
      id: id,
      nome: cat ? cat.nome : 'Sem categoria',
      cor:  cat ? cat.cor  : '#94a3b8',
      icone:cat ? cat.icone: '•',
      total: d.total,
      deFatura: d.deFaturaFechada,
      teto: orcamentoDe(id, mesVisivel)
    };
  }).sort(function(a,b){ return b.total - a.total; });

  return '<div class="card">'
  + '<h2>' + nomeMes(mesVisivel).split(' de ')[0] + '</h2>'

  + '<div class="grade g3" style="gap:16px">'
  +   '<div><p class="p mut">Entrou</p><p class="n-s tab pos">' + $(r.entrou) + '</p></div>'
  +   '<div><p class="p mut">Saiu</p><p class="n-s tab neg">' + $(r.saiu) + '</p>'
  +   (r.previsto ? '<p class="ajuda">' + $(r.previsto) + ' ainda não pagos</p>' : '') + '</div>'
  +   '<div><p class="p mut">' + (sobra>=0?'Sobrou':'Faltou') + '</p>'
  +   '<p class="n-s tab ' + (sobra>=0?'pos':'neg') + '">' + $(sobra) + '</p></div>'
  + '</div>'

  + (cats.length
    ? '<div style="height:1px;background:var(--borda);margin:20px 0"></div>'
      + '<h2>Para onde foi</h2>'
      + cats.slice(0,8).map(function(c, i){ return linhaCategoria(c, r.saiu, i===0); }).join('')
      + resumoPorGrupo(r)
    : '')

  + (temVariasPessoas() && r.saiu > 0 ? blocoQuemGastou(r) : '')
  + '</div>';
}

/* Uma linha de categoria, com a barra do teto quando houver.
   A parte "veio da fatura fechada" fica explícita: sem isso o número confunde,
   porque o mês nasce com o teto já parcialmente comprometido (regra 3). */
function linhaCategoria(c, totalSaiu, primeira){
  const estourou = c.teto !== null && c.total > c.teto;
  const fracao = c.teto ? c.total / c.teto : (totalSaiu ? c.total / totalSaiu : 0);

  let rodape = '';
  if(c.teto !== null){
    rodape = estourou
      ? '<span class="neg">passou ' + $(c.total - c.teto) + ' do teto de ' + $(c.teto) + '</span>'
      : 'teto ' + $(c.teto) + ' · restam ' + $(c.teto - c.total);
  }
  if(c.deFatura > 0){
    rodape += (rodape ? ' · ' : '')
      + '<span class="ala">' + $(c.deFatura) + ' vieram de fatura fechada</span>';
  }

  return '<div style="display:flex;gap:12px;align-items:center;padding:11px 0'
    + (primeira ? '' : ';border-top:1px solid var(--borda)') + '">'
    + '<span class="ic-t" style="background:' + c.cor + '1f">' + c.icone + '</span>'
    + '<div style="flex:1;min-width:0">'
    +   '<div class="lin" style="margin-bottom:6px">'
    +     '<span style="font-weight:500">' + esc(c.nome) + '</span>'
    +     '<span class="tab" style="font-weight:650">' + $(c.total) + '</span>'
    +   '</div>'
    +   '<div class="trilho trilho-p"><div style="width:' + (Math.min(fracao,1)*100) + '%;'
    +   'background:' + (estourou?'var(--neg)':c.cor) + '"></div></div>'
    +   (rodape ? '<p class="pp fra" style="margin-top:5px">' + rodape + '</p>' : '')
    + '</div></div>';
}

function resumoPorGrupo(r){
  const gs = Object.keys(r.porGrupo).map(function(g){
    return {g:g, v:r.porGrupo[g]};
  }).sort(function(a,b){ return b.v - a.v; });
  if(!gs.length || !r.saiu) return '';

  return '<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--borda)">'
    + gs.map(function(x){
        return '<div class="lin p" style="padding:3px 0">'
          + '<span class="mut">' + (GRUPO_ROTULO[x.g] || x.g) + '</span>'
          + '<span class="tab" style="font-weight:500">'
          + Math.round(x.v/r.saiu*100) + '% · ' + $(x.v) + '</span></div>';
      }).join('')
    + '</div>';
}

function blocoQuemGastou(r){
  const linhas = DB.pessoas.map(function(p){
    const d = r.porPessoa[p.id] || {saiu:0, entrou:0};
    return {nome:p.nome, emoji:p.emoji, cor:p.cor, saiu:d.saiu, entrou:d.entrou};
  });
  const semDono = r.porPessoa[''];
  if(semDono && (semDono.saiu || semDono.entrou)){
    linhas.push({nome:'Da casa', emoji:'🏠', cor:'#94a3b8',
                 saiu:semDono.saiu, entrou:semDono.entrou});
  }

  return '<div style="height:1px;background:var(--borda);margin:20px 0"></div>'
    + '<h2>Quem gastou</h2>'
    + '<div class="grade g2">'
    + linhas.map(function(l){
        const parte = r.saiu ? l.saiu / r.saiu : 0;
        return '<div>'
          + '<div class="lin" style="margin-bottom:8px">'
          +   '<span style="display:flex;align-items:center;gap:10px;min-width:0">'
          +     '<span class="av" style="background:' + l.cor + '26">' + l.emoji + '</span>'
          +     '<span style="font-weight:650">' + esc(l.nome) + '</span></span>'
          +   '<span class="tab" style="font-size:19px;font-weight:650">' + $(l.saiu) + '</span>'
          + '</div>'
          + '<div class="trilho"><div style="width:' + (parte*100) + '%;background:' + l.cor + '"></div></div>'
          + '<p class="pp fra" style="margin-top:6px">' + Math.round(parte*100) + '% dos gastos'
          + (l.entrou ? ' · entrou ' + $(l.entrou) : '') + '</p>'
          + '</div>';
      }).join('')
    + '</div>'
    + '<p class="ajuda">Independente da categoria: o mesmo lanche conta em Lanches '
    + '<em>e</em> na pessoa que pagou.</p>';
}

/* Gráfico de linha em SVG puro — sem biblioteca, para o arquivo continuar único. */
function graficoLinha(proj){
  const L = 440, A = 170, esq = 44, base = 26;
  const vals = proj.map(function(p){ return p.saldo; });
  const min = Math.min.apply(null, vals.concat([0]));
  const max = Math.max.apply(null, vals.concat([1]));
  const x = function(i){ return esq + i * ((L - esq - 14) / Math.max(proj.length-1, 1)); };
  const y = function(v){ return A - base - ((v - min) / ((max - min) || 1)) * (A - base - 14); };
  const pts = proj.map(function(p,i){ return x(i) + ',' + y(p.saldo); }).join(' ');

  return '<svg viewBox="0 0 ' + L + ' ' + A + '" style="width:100%;height:210px" '
    + 'role="img" aria-label="Saldo projetado dos próximos meses">'
    + '<defs><linearGradient id="gsaldo" x1="0" y1="0" x2="0" y2="1">'
    +   '<stop offset="0%" stop-color="var(--ac)" stop-opacity=".30"/>'
    +   '<stop offset="100%" stop-color="var(--ac)" stop-opacity=".02"/></linearGradient></defs>'
    + (min < 0
      ? '<line x1="' + esq + '" x2="' + (L-14) + '" y1="' + y(0) + '" y2="' + y(0) + '" '
        + 'stroke="var(--neg)" stroke-dasharray="5 5" stroke-width="1.5"/>'
      : '')
    + '<polygon points="' + esq + ',' + (A-base) + ' ' + pts + ' '
    +   x(proj.length-1) + ',' + (A-base) + '" fill="url(#gsaldo)"/>'

/**
 * PAGAR A FATURA — inteira ou em parte, de qualquer mês em aberto.
 *
 * O pagamento é uma TRANSFERÊNCIA, não uma despesa: as compras já foram
 * contadas quando aconteceram, e contar de novo dobraria o mês (regra 6).
 *
 * O mês vem escolhido num campo porque a fatura que se paga quase nunca é a do
 * mês em que se está: em setembro paga-se a de agosto. E o valor é editável
 * porque pagar uma parte e deixar o resto é comum — e não tinha como registrar.
 */
function pagarFatura(cartaoId, mesEscolhido){
  const ct = cartao(cartaoId);
  if(!ct) return;
  if(!DB.contas.length){
    alert('Cadastre uma conta antes — é dela que o dinheiro sai.');
    return;
  }

  const meses = faturasEmAberto(cartaoId);
  if(!meses.length){ toast('Não há fatura em aberto neste cartão.'); return; }

  /* Abre no mês que está na tela quando ele tem fatura aberta. Senão, na mais
     ANTIGA em aberto — que é a vencida, a que costuma estar pegando fogo. */
  const mes = (mesEscolhido && meses.indexOf(mesEscolhido) >= 0) ? mesEscolhido
            : (meses.indexOf(mesVisivel) >= 0 ? mesVisivel : meses[0]);

  const total   = faturaDoMes(cartaoId, mes);
  const abatido = pagoDaFatura(cartaoId, mes);
  const falta   = faltaDaFatura(cartaoId, mes);

  abrirModal(
    '<h2>Pagar fatura do ' + esc(ct.nome) + '</h2>'

    + '<div class="campo"><label>Qual fatura</label>'
    /* Trocar o mês reabre o modal já com os números daquele mês. Reabrir é
       mais simples e mais seguro do que remendar meia dúzia de campos. */
    + '<select id="fatMes" onchange="pagarFatura(\'' + cartaoId + '\', this.value)">'
    + meses.map(function(ym){
        return '<option value="' + ym + '"' + (ym === mes ? ' selected' : '') + '>'
          + nomeMes(ym) + ' · falta ' + fmt(faltaDaFatura(cartaoId, ym))
          + (ym < mesAtual() ? ' — vencida' : '') + '</option>';
      }).join('')
    + '</select></div>'

    + '<p class="ajuda">Fatura de <b>' + nomeMes(mes) + '</b>: ' + fmt(total)
    + (abatido > 0 ? ' · já pago <b>' + fmt(abatido) + '</b>' : '')
    + ' · falta <b class="tab">' + fmt(falta) + '</b>'
    + (mes < mesAtual() ? ' · <b>venceu em ' + fmtData(vencimentoDaFatura(mes, ct.diaVencimento))
                          + '</b>' : '')
    + '</p>'

    + '<div class="grade g2" style="gap:12px;margin-top:14px">'
    +   '<div class="campo"><label>Quanto vai pagar</label>'
    +   '<input id="fatValor" inputmode="decimal" oninput="pagamentoResumo(\'' + cartaoId
    +   '\',\'' + mes + '\')" value="' + fmtSimples(falta) + '"></div>'
    +   '<div class="campo"><label>Quando saiu</label>'
    +   '<input id="fatData" type="date" value="' + hojeISO() + '"></div>'
    + '</div>'

    + '<div class="campo"><label>Tirar de</label><select id="fatConta">'
    + DB.contas.map(function(c){
        return '<option value="' + c.id + '">' + esc(c.nome) + ' · '
             + fmt(saldoDaConta(c.id)) + '</option>';
      }).join('') + '</select></div>'

    + '<p class="ajuda" id="fatResumo" style="min-height:34px"></p>'

    + '<div class="modal-acoes">'
    + '<button class="btn btn-2" onclick="fecharModal()">Cancelar</button>'
    + '<button class="btn btn-1" onclick="confirmarPagamento(\'' + cartaoId + '\',\''
    + mes + '\')">Confirmar</button>'
    + '</div>');

  pagamentoResumo(cartaoId, mes);
}

/* O que vai acontecer, escrito antes de confirmar. */
function pagamentoResumo(cartaoId, mes){
  const el = document.getElementById('fatResumo');
  if(!el) return;
  const falta = faltaDaFatura(cartaoId, mes);
  const valor = lerDinheiro(v('fatValor')) || 0;

  if(valor <= 0){ el.textContent = ''; return; }

  if(valor >= falta){
    el.innerHTML = 'Quita a fatura de ' + nomeMes(mes) + '.'
      + (valor > falta ? ' <b>Você está pagando ' + fmt(valor - falta)
                       + ' a mais do que falta.</b>' : '')
      + '<br>Isto <b>não</b> conta como gasto novo: as compras já foram contadas '
      + 'quando aconteceram. Só o saldo da conta muda.';
  } else {
    el.innerHTML = 'Abate ' + fmt(valor) + ' · ainda vão faltar <b class="tab">'
      + fmt(falta - valor) + '</b> nesta fatura.'
      + '<br>As compras continuam contando como não pagas até a fatura fechar.';
  }
}

function confirmarPagamento(cartaoId, mes){
  const ct = cartao(cartaoId);
  const contaId = v('fatConta');
  const valor = lerDinheiro(v('fatValor'));
  const data  = v('fatData') || hojeISO();
  const falta = faltaDaFatura(cartaoId, mes);

  if(!valor || valor <= 0){ alert('Valor inválido.'); return; }
  if(!contaId){ alert('Escolha a conta de onde o dinheiro sai.'); return; }
  if(valor > falta){
    if(!confirm('Faltam ' + fmt(falta) + ' nesta fatura e você está pagando '
              + fmt(valor) + '.\n\nContinuar assim mesmo?')) return;
  }

  /* Os dois campos abaixo são o que liga o pagamento à fatura. É por eles que
     pagoDaFatura() sabe o quanto já foi abatido — sem eles, pagamento parcial
     viraria só um dinheiro que sumiu da conta. */
  DB.lancamentos.push(novoLancamento({
    data: data,
    descricao: 'Fatura ' + ct.nome + ' · ' + nomeMesCurto(mes),
    valor: valor, tipo: 'transf',
    pessoaId: ct.donoId || '', alvo: 'conta:' + contaId, pago: true,
    faturaCartaoId: cartaoId, faturaMes: mes,
    nota: 'Pagamento da fatura de ' + mes
  }));

  /* Quitou: as compras daquela fatura viram "pago" e param de contar como
     dívida. Pagamento PARCIAL não marca nenhuma — marcar algumas seria
     escolher quais no chute, e a soma continuaria certa por acaso, não por
     construção. O abatimento vive no registro do pagamento. */
  const quitou = valor >= falta;
  if(quitou){
    DB.lancamentos.forEach(function(l){
      if(l.alvo === 'cartao:' + cartaoId && l.mesFatura === mes) l.pago = true;
    });
  }

  salvarDB(); fecharModal(); desenhar();
  toast(quitou
    ? 'Fatura de ' + nomeMes(mes) + ' quitada · ' + fmt(valor) + ' saiu de ' + conta(contaId).nome + '.'
    : fmt(valor) + ' abatido · faltam ' + fmt(falta - valor) + ' em ' + nomeMes(mes) + '.');
}

/* ---------------------------------------------------------
   ADIANTAR — pagar antes da fatura

   Serve para parcela futura e para compra à vista que ainda vai cair na
   fatura. O dinheiro sai da CONTA agora, e aquilo deixa de existir na fatura
   em que cairia.

   Por isso o lançamento troca de alvo: de "cartao:X" para "conta:Y". Não é um
   detalhe de implementação — é o que faz TODAS as telas ficarem certas de uma
   vez, sem nenhuma exceção espalhada:

     - o saldo da conta cai, porque saldoDaConta soma o que tem alvo de conta;
     - a fatura futura encolhe, porque faturaDoMes só olha alvo de cartão;
     - a dívida do cartão encolhe junto;
     - e o gasto passa a contar no MÊS EM QUE O DINHEIRO SAIU, que é a regra 3.

   O caminho de volta fica guardado em adiantadoDe e faturaOriginal.
   --------------------------------------------------------- */
function adiantarLancamento(id){
  const l = DB.lancamentos.filter(function(x){ return x.id === id; })[0];
  if(!l) return;
  if(!alvoEhCartao(l.alvo)){ toast('Isto não está numa fatura.'); return; }
  if(l.pago){ toast('Esta já está paga.'); return; }
  if(!DB.contas.length){
    alert('Cadastre uma conta antes — é dela que o dinheiro sai.');
    return;
  }

  const ct = cartao(idDoAlvo(l.alvo));

  abrirModal(
    '<h2>Adiantar pagamento</h2>'
    + '<p class="ajuda">' + esc(l.descricao) + ' · <b class="tab">' + fmt(l.valor) + '</b>'
    + (ct ? '<br>Hoje está na fatura de <b>' + nomeMes(l.mesFatura) + '</b> do '
          + esc(ct.nome) + '.' : '')
    + '</p>'

    + '<div class="grade g2" style="gap:12px;margin-top:14px">'
    +   '<div class="campo"><label>Sai de</label><select id="adConta">'
    +   DB.contas.map(function(c){
          return '<option value="' + c.id + '">' + esc(c.nome) + ' · '
               + fmt(saldoDaConta(c.id)) + '</option>';
        }).join('') + '</select></div>'
    +   '<div class="campo"><label>Quando saiu</label>'
    +   '<input id="adData" type="date" value="' + hojeISO() + '"></div>'
    + '</div>'

    + '<p class="ajuda">Sai do saldo da conta agora e <b>some da fatura de '
    + nomeMes(l.mesFatura) + '</b>. O gasto passa a contar no mês em que o '
    + 'dinheiro saiu, não mais no da fatura.</p>'

    + '<div class="modal-acoes">'
    + '<button class="btn btn-2" onclick="fecharModal()">Cancelar</button>'
    + '<button class="btn btn-1" onclick="confirmarAdiantamento(\'' + id + '\')">'
    + 'Adiantar</button></div>');
}

function confirmarAdiantamento(id){
  const l = DB.lancamentos.filter(function(x){ return x.id === id; })[0];
  if(!l) return;
  const contaId = v('adConta');
  const data = v('adData') || hojeISO();
  if(!contaId){ alert('Escolha a conta.'); return; }

  const saldo = saldoDaConta(contaId);
  if(l.valor > saldo){
    if(!confirm('A conta tem ' + fmt(saldo) + ' e o adiantamento é de ' + fmt(l.valor)
              + '.\n\nO saldo vai ficar negativo. Continuar?')) return;
  }

  l.adiantadoDe    = l.alvo;        /* de qual cartão saiu */
  l.faturaOriginal = l.mesFatura;   /* em que fatura ela cairia */
  l.alvo = 'conta:' + contaId;
  l.data = data;
  l.pago = true;
  l.mesFatura = '';
  /* alvo virou conta, então a competência passa a ser o mês da data — que é
     justamente o mês em que o dinheiro saiu. */
  carimbarCompetencia(l);

  salvarDB(); fecharModal(); desenhar();
  toast('Adiantado · ' + fmt(l.valor) + ' saiu de ' + conta(contaId).nome + '.');
}

/* ---------------------------------------------------------
   COMPRAS PARCELADAS
   --------------------------------------------------------- */
function blocoParceladas(){
  const abertas = DB.compras.filter(function(c){
    return DB.lancamentos.some(function(l){ return l.compraId === c.id && !l.pago; });
  });

  return '<div class="card">'
  + '<h2>Compras parceladas'
  + '<span class="aux" onclick="cadastrarParcelada()">+ Já em andamento</span></h2>'
  + (abertas.length
    ? abertas.map(function(c){
        const parcelas = DB.lancamentos.filter(function(l){ return l.compraId === c.id; });
        const pagas = parcelas.filter(function(l){ return l.pago; }).length + (c.jaPagas||0);
        const falta = parcelas.filter(function(l){ return !l.pago; })
                              .reduce(function(s,l){ return s + l.valor; }, 0);
        const ultima = parcelas.filter(function(l){ return !l.pago; })
                               .sort(function(a,b){ return (a.mesFatura||'').localeCompare(b.mesFatura||''); })
                               .slice(-1)[0];
        const ct = cartao(c.cartaoId);
        return '<div style="padding:13px 0;border-top:1px solid var(--borda)">'
          + '<div class="lin" style="align-items:baseline;flex-wrap:wrap">'
          +   '<div style="min-width:0"><p style="font-weight:500">' + esc(c.descricao) + '</p>'
          +   '<p class="pp fra">' + (ct?esc(ct.nome):'') + ' · comprado em '
          +   fmtData(c.dataCompra) + '</p></div>'
          +   '<div style="text-align:right"><p class="tab" style="font-weight:650">'
          +   $(c.total) + '</p><p class="pp fra tab">faltam ' + $(falta) + '</p></div>'
          + '</div>'
          + '<div class="trilho trilho-p" style="margin-top:9px"><div style="width:'
          + (pagas / c.parcelas * 100) + '%;background:' + (ct?ct.cor:'var(--ac)') + '"></div></div>'
          + '<div class="lin" style="margin-top:5px;align-items:baseline">'
          +   '<p class="pp fra tab" style="min-width:0">' + pagas + ' de ' + c.parcelas
          +   ' parcelas pagas'
          +   (ultima ? ' · última em ' + nomeMes(ultima.mesFatura) : '') + '</p>'
          +   '<button class="btn btn-2 btn-p" onclick="editarParcelada(\'' + c.id + '\')">'
          +   'Editar</button>'
          + '</div>'
          + '</div>';
      }).join('')
    : '<p class="ajuda">Nenhuma parcela em aberto. Bom lugar para estar.</p>')
  + '</div>';
}

/**
 * O FORMULÁRIO DA COMPRA PARCELADA — serve para cadastrar e para corrigir.
 *
 * É um só de propósito: o erro que se quer corrigir (número de parcelas
 * digitado errado) costuma vir acompanhado de outro no mesmo formulário, e
 * manter duas telas parecidas garante que uma delas fique para trás.
 *
 * Sem "compra" e cadastrar = cadastrar. Preenchido = corrigir aquela.
 */
function formParcelada(compra){
  if(!DB.cartoes.length){ alert('Cadastre um cartão antes.'); return; }

  const corrigindo = !!compra;
  /* Ao corrigir, o campo mostra o valor de UMA parcela — é assim que a pessoa
     pensa a compra ("12x de 250"), e é o que ela quer conferir. */
  const parcela = corrigindo ? Math.round(compra.total / compra.parcelas) : 0;

  /* Quantas a data explicaria sozinha, e quantas a compra realmente tem.
     Quando os dois números diferem, houve adiantamento — e o campo manual
     precisa nascer aberto, senão a correção apagaria o adiantamento. */
  const pelaData = corrigindo
    ? parceladaVencidas(cartao(compra.cartaoId), compra.dataCompra, compra.parcelas)
    : 0;   /* sem data ainda não há o que contar; parceladaDataMudou() refaz */
  const pagasIniciais = corrigindo ? (compra.jaPagas || 0) : pelaData;
  /* O que sobra além do que o calendário explica foi adiantamento. */
  const adiantadasIniciais = Math.max(0, pagasIniciais - pelaData);
  const manual = adiantadasIniciais > 0;

  /* Parcela já paga ou adiantada não é refeita na correção. */
  const congeladas = corrigindo
    ? DB.lancamentos.filter(function(l){
        return l.compraId === compra.id && (l.pago || l.adiantadoDe);

/* De quem é a compra: ao corrigir, quem já estava nas parcelas. */
function parceladaDeQuem(compra){

/**
 * Quantas parcelas já venceram, contando só pelo calendário.
 *
 * Venceu o que caiu em fatura de mês ANTERIOR ao de hoje. A deste mês ainda
 * está correndo, então a parcela dela é a próxima a pagar, não uma paga.
 */
function parceladaVencidas(ct, data, total){
  if(!ct || !data) return 0;
  const primeira = faturaDaCompra(data, ct.diaFechamento, ct.diaVencimento);
  const hoje = hojeISO();
  const limite = (total >= 1) ? total : 60;

  /* Uma a uma, comparando a DATA de vencimento com hoje. Contar meses inteiros
     era o defeito: uma fatura que vence dia 9 já venceu no dia 30 do mesmo mês,
     e a diferença de meses ali é zero. */
  let n = 0;
  while(n < limite
     && vencimentoDaFatura(mesMais(primeira, n), ct.diaVencimento) <= hoje) n++;
  return n;
}

/* A data, o cartão ou o total mudaram: refaz a conta.
   Não encosta no número quando a pessoa marcou que adiantou — ali o valor é
   dela, e um recálculo apagaria justamente a informação que o app não tem. */
function parceladaDataMudou(){
  const data  = v('ppData');
  const ct    = cartao(v('ppCartao'));
  const ajuda = document.getElementById('ppPagasAjuda');
  const campo = document.getElementById('ppPagas');
  const cx    = document.getElementById('ppAdiantei');
  const total = Number(v('ppTotal')) || 0;

  const venceram   = parceladaVencidas(ct, data, total);
  const adiantadas = (cx && cx.checked) ? Math.max(0, Number(v('ppAdiantadas')) || 0) : 0;

  /* O total de pagas é a soma das duas: o que o calendário explica mais o que
     só a pessoa sabe. */
  if(campo) campo.value = venceram + adiantadas;

  if(ajuda){
    if(!data){
      ajuda.textContent = 'Preencha a data e o app conta sozinho quantas já venceram.';
    } else {
      const base = venceram === 0
        ? 'Pela data, nenhuma parcela venceu ainda.'
        : 'Pela data, ' + venceram
          + (venceram === 1 ? ' parcela já venceu.' : ' parcelas já venceram.');
      ajuda.innerHTML = base + (adiantadas > 0
        ? ' Com ' + adiantadas + (adiantadas === 1 ? ' adiantada' : ' adiantadas')
          + ', são <b>' + (venceram + adiantadas) + ' de ' + total + ' pagas</b>.'
        : '');
    }
  }
  parceladaResumo();
}

/* Marcar "adiantei" abre o número. Desmarcar devolve a conta ao app. */
function parceladaAdianteiMudou(){
  const cx  = document.getElementById('ppAdiantei');
  const box = document.getElementById('ppPagasBox');
  if(box) box.style.display = (cx && cx.checked) ? '' : 'none';
  parceladaDataMudou();
}

/* O que vai acontecer, escrito antes de salvar. */
function parceladaResumo(){
  const el = document.getElementById('ppResumo');
  if(!el) return;

  const ct      = cartao(v('ppCartao'));
  const parcela = lerDinheiro(v('ppParcela')) || 0;
  const n       = Number(v('ppTotal')) || 0;
  const pagas   = Math.max(0, Number(v('ppPagas')) || 0);

  if(!ct || parcela <= 0 || n < 2){ el.textContent = ''; return; }
  if(pagas >= n){
    el.innerHTML = '<b>Pela data, todas as ' + n + ' parcelas já venceram — não '
      + 'sobrou nenhuma para lançar.</b><br>Confira a data da compra ou o total.';
    return;
  }

  const primeira = faturaDaCompra(parceladaDataDaCompra(ct, pagas),
                                  ct.diaFechamento, ct.diaVencimento);
  const faltam = n - pagas;

  el.innerHTML = n + '× de ' + fmt(parcela) + ' · total ' + fmt(parcela * n) + '<br>'
    + '<b>' + pagas + ' de ' + n + ' já pagas</b> · '
    + faltam + (faltam === 1 ? ' parcela entra' : ' parcelas entram') + ' no app: '
    + nomeMes(mesMais(primeira, pagas)) + ' até ' + nomeMes(mesMais(primeira, n - 1));
}

/* A data que vai para o registro.
   Com data preenchida, é ela quem manda — inclusive sobre o número de pagas,
   que a pessoa pode ter corrigido à mão.
   Sem data, reconstrói para trás: quem já pagou 4 comprou uns 4 meses atrás.
   O dia escolhido é um antes do fechamento, para a compra cair na fatura
   daquele mês e não na seguinte. */
function parceladaDataDaCompra(ct, pagas){
  return v('ppData') || diaDoMes(mesMais(mesAtual(), -pagas),
                                 Math.max(1, ct.diaFechamento - 1));
}

function salvarParcelada(compraId){
  const desc    = (v('ppDesc') || '').trim();
  const parcela = lerDinheiro(v('ppParcela'));
  const total   = Number(v('ppTotal'));
  const pagas   = Number(v('ppPagas'));

  if(!desc){ alert('Descreva a compra.'); return; }
  if(!parcela || parcela <= 0){ alert('Valor da parcela inválido.'); return; }
  if(!Number.isInteger(total) || total < 2){
    alert('O total de parcelas precisa ser 2 ou mais.'); return;
  }
  if(!Number.isInteger(pagas) || pagas < 0 || pagas >= total){
    alert('As já pagas precisam ser menos que o total.'); return;
  }

  const ct = cartao(v('ppCartao'));
  if(!ct){ alert('Escolha um cartão.'); return; }

  const dados = {
    cartaoId: ct.id, total: parcela * total, parcelas: total,
    descricao: desc, data: parceladaDataDaCompra(ct, pagas),
    categoriaId: v('ppCat') || '', pessoaId: v('ppPessoa') || '', jaPagas: pagas
  };

  if(compraId){
    const criadas = regravarParcelada(compraId, dados);
    salvarDB(); fecharModal(); desenhar();
    toast('Compra corrigida: ' + criadas + ' parcelas em aberto.');
  } else {
    gravarParcelado(dados);
    salvarDB(); fecharModal(); desenhar();
    toast((total - pagas) + ' parcelas criadas.');
  }
}

  const meses = [];

  const valores = meses.map(function(m){
    return DB.cartoes.reduce(function(s,ct){ return s + faturaDoMes(ct.id, m); }, 0);

  if(valores.every(function(x){ return x === 0; })){
    return '<div class="card"><h2>Próximas faturas</h2>'
      + '<p class="ajuda">Nenhuma parcela caindo nos próximos meses.</p></div>';

  return '<div class="card"><h2>Próximas faturas já comprometidas</h2>'
    + meses.map(function(m, i){

          + '<div class="lin p" style="margin-bottom:6px">'

/* Contas fixas que ainda não viraram lançamento neste mês. Materializar é o que
   transforma a previsão em lançamento de verdade, com data e status de pago. */
function blocoLancarFixas(){
  const ym = mesVisivel;
  const jaTem = {};
  DB.lancamentos.forEach(function(l){
    if(l.recorrenteId && (l.mesComp || mesDe(l.data)) === ym) jaTem[l.recorrenteId] = true;
  });

  const faltando = DB.recorrentes.filter(function(r){
    if(!r.ativo || jaTem[r.id]) return false;
    const quando = diaDoMes(ym, r.dia);
    if(r.inicio && quando < r.inicio) return false;
    if(r.fim && quando > r.fim) return false;
    return true;
  });

  if(!faltando.length) return '';

  return '<div class="card" style="border:1px solid var(--ac)">'
    + '<div class="lin" style="flex-wrap:wrap;gap:12px">'
    + '<p style="flex:1;min-width:200px"><b>' + faltando.length + '</b> '
    + (faltando.length===1 ? 'conta fixa ainda não foi lançada' : 'contas fixas ainda não foram lançadas')
    + ' em ' + nomeMes(ym) + '.</p>'
    + '<button class="btn btn-1" onclick="lancarFixas()">Lançar agora</button></div>'
    + '<p class="ajuda">Elas entram como <b>previsto</b>. Marque como pago conforme forem saindo.</p>'
    + '</div>';
}

function lancarFixas(){
  const ym = mesVisivel;
  const jaTem = {};
  DB.lancamentos.forEach(function(l){
    if(l.recorrenteId && (l.mesComp || mesDe(l.data)) === ym) jaTem[l.recorrenteId] = true;
  });

  let n = 0;
  DB.recorrentes.forEach(function(r){
    if(!r.ativo || jaTem[r.id]) return;
    const quando = diaDoMes(ym, r.dia);
    if(r.inicio && quando < r.inicio) return;
    if(r.fim && quando > r.fim) return;

    DB.lancamentos.push(novoLancamento({
      data: quando, descricao: r.descricao, valor: r.valor, tipo: r.tipo,
      pessoaId: r.pessoaId || '', categoriaId: r.categoriaId || '',
      alvo: r.alvo || (DB.contas.length ? 'conta:' + DB.contas[0].id : ''),
      pago: false, recorrenteId: r.id
    }));
    n++;
  });

  salvarDB(); desenhar();
  toast(n + ' conta(s) fixa(s) lançada(s) como previsto.');
}

const TIPOS_META = {reserva:'Reserva de emergência', objetivo:'Objetivo', aplicacao:'Investimento'};
const ICONE_META = {reserva:'🛟', objetivo:'🎯', aplicacao:'📈'};

function guardadoNaMeta(metaId){
  return DB.aportes.filter(function(a){ return a.metaId === metaId; })
                   .reduce(function(s,a){ return s + a.valor; }, 0);
}

/* Gasto essencial médio dos meses que tiveram movimento. É contra ele que a
   reserva é medida — "quantos meses vocês aguentam". */
function gastoEssencialMedio(){
  const porMes = {};
  DB.lancamentos.forEach(function(l){
    if(l.tipo !== 'saida') return;
    const cat = categoria(l.categoriaId);
    if(!cat || cat.grupo !== 'essencial') return;
    const m = l.mesComp || mesDe(l.data);
    porMes[m] = (porMes[m] || 0) + l.valor;
  });
  const meses = Object.keys(porMes).filter(function(m){ return porMes[m] > 0; });
  if(!meses.length) return null;
  return Math.round(meses.reduce(function(s,m){ return s + porMes[m]; }, 0) / meses.length);
}

function desenharInvestimentos(){
  const c = document.getElementById('content');
  const pat = patrimonio();
  const guardado = pat.reserva + pat.guardado;
  const essencial = gastoEssencialMedio();
  const cobre = (essencial && essencial > 0) ? pat.reserva / essencial : null;

  const precisaPorMes = DB.metas.reduce(function(s,m){
    if(!m.prazo) return s;
    const falta = Math.max(m.alvo - guardadoNaMeta(m.id), 0);
    const meses = Math.max(mesesEntre(mesAtual(), mesDe(m.prazo)), 0);
    return s + (meses > 0 ? Math.ceil(falta / meses) : falta);
  }, 0);

  c.innerHTML =
    '<div class="grade g3">'
  +   '<div class="card"><p class="p mut">Total guardado</p>'
  +     '<p class="n-m tab inv">' + $(guardado) + '</p>'
  +     '<p class="ajuda">Reserva ' + $(pat.reserva) + ' · outras metas ' + $(pat.guardado) + '</p></div>'
  +   '<div class="card"><p class="p mut">Guardado neste mês</p>'
  +     '<p class="n-m tab ' + (pat.doMes>=0?'pos':'neg') + '">'
  +     (pat.doMes>0?'+':'') + $(pat.doMes) + '</p>'
  +     '<p class="ajuda">' + (precisaPorMes
        ? 'As metas com prazo pedem ' + $(precisaPorMes) + ' por mês'
        : 'Nenhuma meta com prazo definido') + '</p></div>'
  +   '<div class="card"><p class="p mut">A reserva cobre</p>'
  +     '<p class="n-m tab">' + (cobre === null ? '—' : cobre.toFixed(1).replace('.',',') + ' meses') + '</p>'
  +     '<p class="ajuda">' + (essencial === null
        ? 'Lance alguns gastos essenciais para o cálculo aparecer.'
        : 'Seus gastos essenciais são ' + $(essencial) + ' por mês. O ideal é cobrir de 3 a 6.')
  +     '</p></div>'
  + '</div>'

  + (guardado ? blocoOndeGuardado(guardado) : '')

  + '<div class="card">'
  + '<h2>Metas<span class="aux" onclick="editarMeta()">+ Nova meta</span></h2>'
  + (DB.metas.length
    ? DB.metas.map(cartaoMeta).join('')
    : '<p class="ajuda">Nenhuma meta ainda. Comecem pela reserva de emergência: somem os '
      + 'gastos essenciais de um mês e multipliquem por três — é o colchão que evita voltar '
      + 'para o cartão quando algo dá errado.'
      + (essencial ? '<br><br>No caso de vocês, daria cerca de <b>' + fmt(essencial*3) + '</b>.' : '')
      + '</p>')
  + '</div>';
}

function blocoOndeGuardado(total){
  const comSaldo = DB.metas.map(function(m){
    return {m:m, v:guardadoNaMeta(m.id)};
  }).filter(function(x){ return x.v > 0; })
    .sort(function(a,b){ return b.v - a.v; });

  if(!comSaldo.length) return '';

  return '<div class="card"><h2>Onde está guardado</h2>'
    + comSaldo.map(function(x, i){
        const dono = pessoa(x.m.pessoaId);
        return '<div style="display:flex;gap:12px;align-items:center;padding:11px 0'
          + (i===0?'':';border-top:1px solid var(--borda)') + '">'
          + '<span class="ic-t" style="background:' + x.m.cor + '1f">'
          + (ICONE_META[x.m.tipo]||'🎯') + '</span>'
          + '<div style="flex:1;min-width:0">'
          +   '<p style="font-weight:500">' + esc(x.m.nome)
          +   (dono ? '<span class="fra"> · ' + esc(dono.nome) + '</span>' : '') + '</p>'
          +   '<p class="pp fra">' + Math.round(x.v/total*100) + '% do que vocês guardaram</p>'
          + '</div>'
          + '<span class="tab" style="font-weight:650">' + $(x.v) + '</span></div>';
      }).join('')
    + '</div>';
}

function cartaoMeta(m){
  const guardado = guardadoNaMeta(m.id);
  const parte = m.alvo > 0 ? Math.min(guardado / m.alvo, 1) : 0;
  const pronta = guardado >= m.alvo;
  const falta = Math.max(m.alvo - guardado, 0);
  const dono = pessoa(m.pessoaId);

  let prazoTxt = '';
  if(m.prazo){
    const meses = mesesEntre(mesAtual(), mesDe(m.prazo));
    prazoTxt = meses <= 0 ? ' · prazo é este mês'
      : ' · ' + meses + (meses===1 ? ' mês restante' : ' meses restantes');
  }

  let dica = '';
  if(!pronta){
    const meses = m.prazo ? Math.max(mesesEntre(mesAtual(), mesDe(m.prazo)), 0) : 0;
    dica = meses > 0
      ? 'Guardem <b class="tab">' + fmt(Math.ceil(falta/meses)) + '</b> por mês para chegar no prazo.'
      : 'Faltam <b class="tab">' + fmt(falta) + '</b>.';
  }

  return '<div style="padding:16px 0;border-top:1px solid var(--borda)">'
  + '<div class="lin" style="align-items:flex-start">'
  +   '<div style="min-width:0">'
  +     '<p style="font-weight:650">' + esc(m.nome) + '</p>'
  +     '<p class="pp fra">' + (dono ? esc(dono.nome) : 'Da casa') + ' · '
  +     (TIPOS_META[m.tipo]||m.tipo) + prazoTxt + '</p>'
  +   '</div>'
  +   (pronta
      ? '<span class="chip chip-pos">concluída</span>'
      : '<span class="tab" style="font-weight:650">' + Math.round(parte*100) + '%</span>')
  + '</div>'
  + '<div class="trilho" style="margin-top:12px"><div style="width:' + (parte*100)
  + '%;background:' + m.cor + '"></div></div>'
  + '<div class="lin p tab" style="margin-top:7px">'
  +   '<span style="font-weight:500;color:' + m.cor + '">' + $(guardado) + '</span>'
  +   '<span class="mut">de ' + $(m.alvo) + '</span>'
  + '</div>'
  + (dica ? '<p class="ajuda">' + dica + '</p>' : '')
  + '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">'
  +   '<button class="btn btn-2 btn-p" onclick="aportar(\'' + m.id + '\')">Guardar dinheiro</button>'
  +   '<button class="btn btn-2 btn-p" onclick="editarMeta(\'' + m.id + '\')">Editar</button>'
  +   '<button class="btn btn-x btn-p" onclick="removerMeta(\'' + m.id + '\')">Excluir</button>'
  + '</div></div>';
}

  DB.metas   = DB.metas.filter(function(x){ return x.id !== id; });

/**
 * Guardar dinheiro numa meta.
 * Se uma conta for escolhida, o valor também sai dela como TRANSFER — porque
 * guardar não é gastar: sai do caixa disponível mas continua sendo da casa
 * (regra 6 e 8 do CLAUDE.md).
 */
function aportar(metaId){
  const m = meta(metaId);
  abrirModal(
    '<h2>Guardar em ' + esc(m.nome) + '</h2>'
    + '<div class="grade g2" style="gap:12px">'
    +   '<div class="campo"><label>Valor</label>'
    +   '<input id="apValor" inputmode="decimal" placeholder="0,00"></div>'
    +   '<div class="campo"><label>Data</label>'
    +   '<input id="apData" type="date" value="' + hojeISO() + '"></div>'
    + '</div>'
    + '<div class="campo"><label>Tirar de</label><select id="apConta">'
    + '<option value="">Não descontar de nenhuma conta</option>'
    + DB.contas.map(function(c){
        return '<option value="' + c.id + '">' + esc(c.nome) + '</option>';
      }).join('') + '</select>'
    + '<p class="ajuda">Escolher uma conta tira o valor do saldo dela. '
    + '<b>Guardar não conta como gasto do mês.</b></p></div>'
    + '<label style="display:flex;align-items:center;gap:9px;font-weight:400;margin-bottom:8px">'
    + '<input type="checkbox" id="apResgate" style="width:auto;min-height:0"> '
    + 'É um resgate (tirar da meta)</label>'
    + acoesModal('salvarAporte(\'' + metaId + '\')'));
}

function salvarAporte(metaId){
  const valor = lerDinheiro(v('apValor'));
  if(!valor || valor <= 0){ alert('Valor inválido.'); return; }

  const resgate = marcado('apResgate');
  const data = v('apData') || hojeISO();
  const contaId = v('apConta');
  const m = meta(metaId);

  DB.aportes.push({
    id: uid(), metaId: metaId, data: data,
    valor: resgate ? -valor : valor,
    nota: resgate ? 'Resgate' : ''
  });

  if(contaId){
    DB.lancamentos.push(novoLancamento({
      data: data,
      descricao: (resgate ? 'Resgate: ' : 'Guardado: ') + m.nome,
      valor: valor,
      /* Os dois são transferência: mexem no saldo, mas não são receita nem gasto. */
      tipo: resgate ? 'transf_entra' : 'transf',
      pessoaId: m.pessoaId || quemEstaUsando() || '',
      alvo: 'conta:' + contaId, pago: true, nota: 'Meta: ' + m.nome
    }));
  }

  salvarDB(); fecharModal(); desenhar();
  toast(resgate ? 'Resgate registrado.' : 'Guardado ' + fmt(valor) + '.');
}

function salvarCartao(id){
  const nome = (v('kNome')||'').trim();
  if(!nome){ alert('Dê um nome ao cartão.'); return; }

  const limitar = function(x, padrao){
    const n = Number(x);
    return (Number.isInteger(n) && n>=1 && n<=31) ? n : padrao;
  };
  const fecha = limitar(v('kFecha'), 28);
  const vence = limitar(v('kVence'), 5);

  const dados = {
    nome: nome, diaFechamento: fecha, diaVencimento: vence,
    limite: lerDinheiro(v('kLimite')) || 0,
    donoId: v('kDono') || '', cor: escolhido('kCor') || '#7C5CBF'
  };

  if(!id){
    DB.cartoes.push(Object.assign({id:uid()}, dados));
    salvarDB(); fecharModal(); desenhar();
    return;
  }

  const ct = cartao(id);
  const mudouCiclo = ct.diaFechamento !== fecha || ct.diaVencimento !== vence;
  Object.assign(ct, dados);
  salvarDB();
  fecharModal();

  /* A ARMADILHA (regra 4 do CLAUDE.md): os lançamentos já gravados guardam o
     mesFatura calculado pela regra ANTIGA. Corrigir o cadastro não conserta o
     passado, e o erro não aparece na tela — só num total que para de bater. */
  const afetados = DB.lancamentos.filter(function(l){ return l.alvo === 'cartao:' + id; });
  if(mudouCiclo && afetados.length){
    perguntarRecalculo(ct, afetados.length);
  } else {
    desenhar();
  }
}

function perguntarRecalculo(ct, quantos){
  abrirModal(
    '<h2>Recalcular as faturas?</h2>'
    + '<p>Você mudou o ciclo do <b>' + esc(ct.nome) + '</b>. Existem <b>' + quantos
    + ' lançamentos</b> nesse cartão que foram calculados pela regra antiga.</p>'
    + '<p class="ajuda" style="margin-top:12px">'
    + '<b>Recalcular</b> é o certo quando você está corrigindo um cadastro errado.<br>'
    + '<b>Deixar como está</b> é o certo quando o banco realmente mudou a data agora — '
    + 'aí o passado estava correto e só o futuro muda.</p>'
    + '<div class="modal-acoes">'
    + '<button class="btn btn-2" onclick="fecharModal(); desenhar()">Deixar como está</button>'
    + '<button class="btn btn-1" onclick="recalcularFaturas(\'' + ct.id + '\')">Recalcular</button>'
    + '</div>');
}

function recalcularFaturas(cartaoId){
  const ct = cartao(cartaoId);
  let n = 0;
  DB.lancamentos.forEach(function(l){
    if(l.alvo !== 'cartao:' + cartaoId) return;
    const antes = l.mesFatura;
    /* Parcela usa a data do vencimento dela como data; recalcular a partir daí
       daria voltas. O que importa é reencaixar pela data original da compra. */
    const baseData = l.compraId
      ? (DB.compras.filter(function(c){ return c.id === l.compraId; })[0] || {}).dataCompra || l.data
      : l.data;
    const primeira = faturaDaCompra(baseData, ct.diaFechamento, ct.diaVencimento);
    l.mesFatura = l.parcelaN ? mesMais(primeira, l.parcelaN - 1) : primeira;
    l.mesComp = l.mesFatura;
    if(l.parcelaN) l.data = diaDoMes(l.mesFatura, ct.diaVencimento);
    if(antes !== l.mesFatura) n++;
  });
  salvarDB(); fecharModal(); desenhar();
  toast(n ? n + ' lançamento(s) mudaram de fatura.' : 'Nenhum lançamento precisou mudar.');
}

/* Escolha visual de cor ou emoji. Guarda o valor num campo escondido, porque
   <input type=radio> espalhado por um modal é chato de ler depois. */
function escolhedor(id, opcoes, atual, tipo){
  return '<input type="hidden" id="' + id + '" value="' + esc(atual) + '">'
    + '<div style="display:flex;flex-wrap:wrap;gap:7px;padding-top:2px" id="' + id + '_ops">'
    + opcoes.map(function(o){
        const on = o === atual;
        return tipo === 'cor'
          ? '<button type="button" onclick="escolher(\'' + id + '\',\'' + o + '\')" '
            + 'style="width:32px;height:32px;border-radius:999px;cursor:pointer;background:' + o + ';'
            + 'border:' + (on?'3px solid var(--txt)':'2px solid transparent') + '"></button>'
          : '<button type="button" onclick="escolher(\'' + id + '\',\'' + o + '\')" '
            + 'style="width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:18px;'
            + 'background:var(--sup2);font-family:inherit;'
            + 'border:' + (on?'2px solid var(--ac)':'2px solid transparent') + '">' + o + '</button>';
      }).join('')
    + '</div>';
}
function escolher(id, valor){
  document.getElementById(id).value = valor;
  const ops = document.getElementById(id + '_ops');
  Array.prototype.forEach.call(ops.children, function(b){
    const meu = b.textContent || b.style.background;
    const bate = (b.textContent === valor) || (b.style.background === valor)
              || (b.style.backgroundColor && corIgual(b.style.backgroundColor, valor));
    b.style.border = bate
      ? (b.textContent ? '2px solid var(--ac)' : '3px solid var(--txt)')
      : '2px solid transparent';
  });
}
/* O navegador devolve a cor como "rgb(79, 70, 229)"; comparar com o hex direto
   nunca bate. */
function corIgual(rgb, hex){
  const m = String(rgb).match(/\d+/g);
  if(!m || m.length < 3) return false;
  const h = '#' + m.slice(0,3).map(function(n){
    return Number(n).toString(16).padStart(2,'0');
  }).join('');
  return h.toLowerCase() === String(hex).toLowerCase();
}
function escolhido(id){ const e = document.getElementById(id); return e ? e.value : ''; }

/* `vazio` é como chamar a opção "sem dono". Muda com o que se cadastra:
   conta e cartão sempre têm titular, então lá o certo é "Conjunta"; já um gasto
   de luz é da casa mesmo, sem dono. */
